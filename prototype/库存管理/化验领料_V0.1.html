function render(){showList();const del=btn('批量删除',()=>{const chosen=records.filter(r=>selected.has(r.id));if(chosen.some(r=>r.status!=='草稿')){toast('仅草稿记录允许删除');return}records=records.filter(r=>!selected.has(r.id));selected.clear();persist();draw()});del.id='batch-del';$('actions').replaceChildren(del,btn('新增',()=>edit(null),true));draw()}
function draw(){const data=records.filter(r=>(!q.start||r.date>=q.start)&&(!q.end||r.date<=q.end)&&(!q.wh||r.wh===q.wh)&&(!q.status||r.status===q.status)).sort((a,b)=>b.created.localeCompare(a.created));const shown=paginate(data,draw);$('rows').innerHTML=shown.map(r=>`<tr><td class="check"><input type="checkbox" data-check="${r.id}" ${selected.has(r.id)?'checked':''} aria-label="选择${r.code}"></td><td><button class="link" data-view="${r.id}">${esc(r.code)}</button></td><td>${r.date}</td><td>${esc(r.wh)}</td><td>${r.kind}</td><td>${esc(r.person)}</td><td><span class="status ${r.status==='草稿'?'off':r.status==='已审核'?'done':''}">${r.status}</span></td><td>${r.created}</td><td><div class="row-ops">${r.status==='草稿'?`<button class="link" data-edit="${r.id}">编辑</button><button class="link" data-delete="${r.id}">删除</button>`:r.status==='待审核'?`<button class="link" data-audit="${r.id}">审核</button><button class="link" data-return="${r.id}">退回</button>`:'—'}</div></td></tr>`).join('')||'<tr><td colspan="9">暂无数据</td></tr>';
for(const [attr,fn] of [['view',id=>edit(records.find(r=>r.id===id),true)],['edit',id=>edit(records.find(r=>r.id===id))],['delete',id=>{records=records.filter(r=>r.id!==id||r.status!=='草稿');selected.delete(id);persist();draw()}],['audit',audit],['return',id=>{const r=records.find(r=>r.id===id);if(r.status!=='待审核')return;r.status='草稿';persist();draw();toast('已退回，可编辑后重新提交')}]])$('rows').querySelectorAll(`[data-${attr}]`).forEach(b=>b.onclick=()=>fn(b.dataset[attr]));selection(shown,draw);titles()}
function activeConfig(wh){configs=read(configKey,defaults);return configs.find(c=>c.scene==='化验'&&c.wh===wh&&c.enabled==='启用')}
function edit(r,ro=false){configs=read(configKey,defaults);const whs=configs.filter(c=>c.scene==='化验'&&c.enabled==='启用').map(c=>c.wh);draft=clone(r||{id:'lab-'+Date.now(),code:'',scene:'化验',wh:whs.length===1?whs[0]:'',date:day(),kind:'',person:'当前用户',creator:'当前用户',created:'',status:'草稿',reviewer:'',reviewed:'',flow:'',remark:'',items:[]});detail=ro;showForm();$('title').textContent=TITLE+' · '+(ro?'详情':r?'编辑':'新增');$('actions').replaceChildren(btn('返回列表',render));if(!ro)$('actions').append(btn('暂存',()=>save(false)),btn('提交',()=>save(true),true));form()}
function form(){const d=draft,whs=[...new Set([...configs.filter(c=>c.scene==='化验'&&c.enabled==='启用').map(c=>c.wh),...(d.wh?[d.wh]:[])])];$('form').innerHTML='<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">'+field('领料单号',esc(d.code||'保存后生成'))+field('领用日期',input('f-date',d.date,'date',detail))+field('仓库',select('f-wh',whs,d.wh,detail))+field('登记类型',select('f-kind',['领用','开瓶'],d.kind,detail))+field('领用人',input('f-person',d.person,'text',detail))+field('状态',esc(d.status))+field('创建人',esc(d.creator))+field('创建时间',esc(d.created||'—'))+field('审核人',esc(d.reviewer||'—'))+field('审核时间',esc(d.reviewed||'—'))+field('关联出库流水',esc(d.flow||'—'))+field('备注',detail?esc(d.remark||'—'):`<textarea id="f-remark" class="control" placeholder="请输入">${esc(d.remark)}</textarea>`,true)+'</div><p class="error" id="error" role="alert"></p><div class="section-head"><h2>领用明细</h2><div id="item-actions"></div></div><div class="table-wrap"><table><thead><tr><th>物料编码</th><th>物料名称</th><th>规格</th><th style="width:60px">单位</th>'+(!detail?'<th style="width:100px">未开封库存</th>':'')+'<th style="width:110px">领用数量</th>'+(!detail?'<th style="width:60px">操作</th>':'')+'</tr></thead><tbody id="items"></tbody></table></div>';
if(!detail){for(const key of ['date','kind','person','remark'])$('f-'+key).oninput=e=>draft[key]=e.target.value;$('f-wh').onchange=e=>{draft.wh=e.target.value;draft.items=[];form()};$('item-actions').append(btn('添加物料',()=>{const c=activeConfig(draft.wh);if(!c){toast('请先选择仓库，并在倒冲领料设置中启用化验配置');return}pick(c.items.filter(m=>m.enabled==='启用'&&!draft.items.some(x=>x.code===m.code)),picked=>{draft.items.push(...picked.map(m=>({...m,qty:1})));const order=c.items.map(m=>m.code);draft.items.sort((a,b)=>order.indexOf(a.code)-order.indexOf(b.code));itemRows()})}))}itemRows()}
function itemRows(){$('items').innerHTML=draft.items.map((m,i)=>`<tr><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${esc(m.spec)}</td><td>${esc(m.unit)}</td>${detail?'':`<td>${balance(draft.wh,m.code)}</td>`}<td>${detail?esc(m.qty):`<input class="control" type="number" min="1" step="1" value="${esc(m.qty)}" data-qty="${i}" aria-label="${esc(m.name)}领用数量">`}</td>${detail?'':`<td><button class="link" data-remove="${i}">移除</button></td>`}</tr>`).join('')||`<tr><td colspan="${detail?5:7}">暂无物料</td></tr>`;$('items').querySelectorAll('[data-qty]').forEach(i=>i.oninput=()=>{draft.items[+i.dataset.qty].qty=i.value;$('error').textContent=''});$('items').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.items.splice(+b.dataset.remove,1);itemRows()});titles()}
function validate(r,submit){if(!r.wh||!r.date||!r.kind||!r.person.trim())return '请填写日期、仓库、登记类型和领用人';if(r.date>day())return '领用日期不能晚于今天';if(!submit)return '';const c=activeConfig(r.wh);if(!c)return '对应化验配置未启用';if(!r.items.length)return '请至少添加一项物料';for(const m of r.items){if(!c.items.some(x=>x.code===m.code&&x.enabled==='启用'))return m.name+'已停用或移出配置，请调整明细';if(!Number.isInteger(Number(m.qty))||Number(m.qty)<=0)return '瓶装试剂领用数量须为正整数';if(Number(m.qty)>balance(r.wh,m.code))return m.name+'未开封库存不足'}return ''}
function save(submit){const error=validate(draft,submit);if(error){$('error').textContent=error;return}if(!draft.code){const prefix='HYLY'+day().replaceAll('-','').slice(2);let n=1;while(records.some(r=>r.code===prefix+String(n).padStart(2,'0')))n++;draft.code=prefix+String(n).padStart(2,'0')}draft.created ||= now();draft.status=submit?'待审核':'草稿';draft.items.forEach(m=>m.qty=Number(m.qty));records=records.filter(r=>r.id!==draft.id);records.push(clone(draft));persist();render();toast(submit?'已提交，等待库管审核':'暂存成功')}
function audit(id){const r=records.find(r=>r.id===id);if(!r||r.status!=='待审核'){toast('该记录已处理，请刷新列表');return}const error=validate(r,true);if(error){toast(error);return}r.status='已审核';r.reviewer='库管';r.reviewed=now();r.flow='CK-'+r.code;persist();render();toast('审核成功，已生成关联出库流水')}
$('search').onclick=()=>{if($('q-start').value&&$('q-end').value&&$('q-start').value>$('q-end').value){toast('开始日期不能晚于结束日期');return}q={start:$('q-start').value,end:$('q-end').value,wh:$('q-wh').value,status:$('q-status').value};page=1;selected.clear();draw()};$('reset').onclick=()=>{['q-start','q-end','q-wh','q-status'].forEach(id=>$(id).value='');q={};page=1;selected.clear();draw()};render();
</script></body></html>
