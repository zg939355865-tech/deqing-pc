<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月度出入库明细</title><link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px var(--font-ui);color:var(--ink);background:var(--bg-page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}input:focus,select:focus,textarea:focus{outline:none;box-shadow:none}.page{height:100%;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;flex:none}.head h1{margin:0;font-size:20px;line-height:1.5}.actions{display:flex;gap:10px}.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-bg);color:var(--ink)}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.panel{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:6px}.query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;padding:20px 24px;flex:none}.query>label{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;color:var(--gray);white-space:nowrap}.control{width:100%;height:32px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:3px;background:var(--panel-bg);color:var(--ink)}.query-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}.check-field input{width:16px;height:16px;margin:0;justify-self:start;accent-color:var(--teal)}.check-field input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}.list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{height:44px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:normal;overflow-wrap:anywhere}th{position:sticky;top:0;z-index:2;background:var(--bg-soft);color:var(--gray);font-weight:600}tbody tr:hover{background:#f8fbfc}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}.empty td{height:160px;text-align:center;color:var(--gray)}.pager{display:flex;align-items:center;gap:12px;padding-top:16px;flex:none}.pager .total{margin-right:auto;color:var(--gray)}.pager select{width:100px}@media(max-width:960px){.query{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding:12px}.query{grid-template-columns:1fr}.query-actions{justify-content:flex-start}.head{align-items:flex-start;gap:12px}.actions{flex-wrap:wrap;justify-content:flex-end}}
th,td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal;padding:8px}.query>label{grid-template-columns:110px minmax(0,1fr)}.date-range{grid-column:span 2}.range{display:flex;align-items:center;gap:8px;min-width:0}.range input{min-width:0}.error{color:var(--err);margin:0}.error:empty{display:none}@media(max-width:640px){.date-range{grid-column:span 1}}
/* 2026-11-20：按内容分配列宽，名称优先；数值列统一右对齐并留足列间距。 */
#report th,#report td{padding:10px 14px;height:44px;vertical-align:middle}
#report th{height:42px}
#report th:nth-child(4),#report td:nth-child(4){text-align:center}
#report .num{text-align:right;font-variant-numeric:tabular-nums;padding-right:22px}
#report th:nth-child(8),#report td:nth-child(8){padding-left:22px}
@media(max-width:1100px){#report th,#report td{padding:8px}#report .num{padding-right:12px}#report th:nth-child(8),#report td:nth-child(8){padding-left:12px}}
#report th,#report td{padding:8px 6px}#report .num{padding-right:6px}#report th:nth-child(8),#report td:nth-child(8){padding-left:6px}.query-actions{grid-column:2/-1;justify-content:flex-end}@media(max-width:640px){.query-actions{grid-column:auto}}

.query-actions{grid-column:auto}.query>label{grid-template-columns:100px minmax(0,1fr)}.date-inputs{display:flex;gap:4px;align-items:center;min-width:0}.date-inputs input{min-width:0;padding:4px 2px}.doc-link{border:0;padding:0;background:none;color:var(--teal);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}dialog{border:1px solid var(--line);border-radius:6px;padding:24px;width:min(760px,90vw);color:var(--ink)}dialog::backdrop{background:#10243966}.detail{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);margin:16px 0}.detail>*{margin:0;padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow-wrap:anywhere}.detail dt{background:var(--bg-soft)}
/* 2026-11-24：业务日期跨两列，避免日期截断；单据及业务类型对齐四个出入库原型。 */
.query>.business-date{grid-column:span 2}.date-inputs input{flex:1;width:0;min-width:130px;padding:5px 8px}.query-actions{grid-column:1/-1}@media(max-width:640px){.query>.business-date{grid-column:1/-1}.business-date .date-inputs{flex-wrap:wrap}.date-inputs input{min-width:100px}}

/* 2026-11-24：取消业务单据点击，调整12列列宽，完整展示物料类型表头。 */
#report th,#report td{padding:8px 5px}#report th:last-child,#report td:last-child{padding-left:4px;padding-right:4px}
</style></head><body><!-- 2026-11-24 V0.1：按用户指定字段制作。修订：单据、物料、数量、日期及业务类型直接取采购入库、领料出库、其他入库、其他出库原型初始数据；仅纳入已入库/已出库单据，排除草稿。业务类型下拉使用四个页面现有完整枚举。静态演示快照，不与其他页面的内存变更实时联动，不代表现场真实数据。业务日期为含首尾的日期范围；业务单据仅展示普通文本，不提供点击。 --><main class="page"><header class="head"><h1>月度出入库明细</h1><button class="btn" id="export">导出</button></header><section class="panel query" id="query"><label>业务单据<input class="control" id="q-doc" placeholder="请输入"></label><label class="business-date">业务日期<span class="date-inputs"><input class="control" type="date" id="q-from" aria-label="业务开始日期"><span>至</span><input class="control" type="date" id="q-to" aria-label="业务结束日期"></span></label><label>物料类型<select class="control" id="q-mt"><option value="">全部</option></select></label><label>物料分组<select class="control" id="q-g"><option value="">全部</option></select></label><label>物料编码或名称<input class="control" id="q-kw" placeholder="请输入"></label><label>业务类型<select class="control" id="q-t"><option value="">全部</option></select></label><label>仓库<select class="control" id="q-wn"><option value="">全部</option></select></label><div class="query-actions"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section><p class="error" id="error" role="alert"></p><section class="panel list"><div class="table-wrap"><table id="report"><colgroup><col style="width:12%"><col style="width:10%"><col style="width:8%"><col style="width:12%"><col style="width:7%"><col style="width:4%"><col style="width:8%"><col style="width:8%"><col style="width:10%"><col style="width:7%"><col style="width:7%"><col style="width:7%"></colgroup><thead><tr><th>业务单据</th><th>业务日期</th><th>物料编码</th><th>物料名称</th><th>规格</th><th>单位</th><th class="num">入库数量</th><th class="num">出库数量</th><th>业务类型</th><th>仓库</th><th>物料分组</th><th>物料类型</th></tr></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section></main><script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v.toLocaleString('zh-CN',{maximumFractionDigits:3});
const records=[{"doc":"PRI26051401","d":"2026-05-14","t":"采购入库","code":"PJ716","name":"PAC","spec":"","unit":"kg","qty":1000,"wn":"药剂仓库","g":"药剂系列","mt":"药剂"},{"doc":"PRI26051301","d":"2026-05-13","t":"采购入库","code":"PJ978","name":"玻璃珠3-4cm","spec":"3-4cm","unit":"公斤","qty":20,"wn":"化验仓库","g":"化验室器皿","mt":"化验室"},{"doc":"MSO26051401","d":"2026-05-14","t":"领料出库","code":"PJ716","name":"PAC","spec":"","unit":"kg","qty":-1,"wn":"药剂仓库","g":"药剂系列","mt":"药剂"},{"doc":"MSO26051301","d":"2026-05-13","t":"领料出库","code":"PJ708","name":"聚合硫酸铁（水剂）","spec":"","unit":"kg","qty":-1,"wn":"化验仓库","g":"药剂系列","mt":"药剂"},{"doc":"OTI26051401","d":"2026-05-14","t":"其他入库","code":"PJ716","name":"PAC","spec":"","unit":"kg","qty":1000,"wn":"药剂仓库","g":"药剂系列","mt":"药剂"},{"doc":"OTI26051301","d":"2026-05-13","t":"其他入库","code":"PJ978","name":"玻璃珠3-4cm","spec":"3-4cm","unit":"公斤","qty":20,"wn":"化验仓库","g":"化验室器皿","mt":"化验室"},{"doc":"OTO26051401","d":"2026-05-14","t":"报废出库","code":"PJ716","name":"PAC","spec":"","unit":"kg","qty":-1,"wn":"药剂仓库","g":"药剂系列","mt":"药剂"},{"doc":"OTO26051301","d":"2026-05-13","t":"其他出库","code":"PJ708","name":"聚合硫酸铁（水剂）","spec":"","unit":"kg","qty":-1,"wn":"化验仓库","g":"药剂系列","mt":"药剂"}];
const businessTypes=["采购入库","领料出库","盘点调整-入库","其他入库","盘点调整-出库","报废出库","其他出库"];
const headers=['业务单据', '业务日期', '物料编码', '物料名称', '规格', '单位', '入库数量', '出库数量', '业务类型', '仓库', '物料分组', '物料类型'];
let q={},page=1,size=5;
for(const key of ['mt','g','t','wn'])for(const value of (key==='t'?businessTypes:new Set(records.map(r=>r[key])))){const o=document.createElement('option');o.value=value;o.textContent=value;$('q-'+key).append(o)}
function rows(){return records.filter(r=>(!q.doc||r.doc.toLowerCase().includes(q.doc.toLowerCase()))&&(!q.from||r.d>=q.from)&&(!q.to||r.d<=q.to)&&['mt','g','t','wn'].every(k=>!q[k]||r[k]===q[k])&&(!q.kw||(r.code+' '+r.name).toLowerCase().includes(q.kw.toLowerCase()))).sort((a,b)=>b.d.localeCompare(a.d))}
function values(r){return [r.doc,r.d,r.code,r.name,r.spec||'—',r.unit,Math.max(0,r.qty),Math.max(0,-r.qty),r.t,r.wn,r.g,r.mt]}
function button(t,fn,disabled){const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=fn;b.disabled=disabled;return b}
function render(){const data=rows(),pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);$('tbody').innerHTML=data.slice((page-1)*size,page*size).map(r=>'<tr>'+values(r).map((v,i)=>`<td class="${i===6||i===7?'num':''}" title="${esc(v)}">${esc(i===6||i===7?fmt(v):v)}</td>`).join('')+'</tr>').join('')||'<tr class="empty"><td colspan="12">暂无数据</td></tr>';
$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="size" aria-label="每页条数">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(button('上一页',()=>{page--;render()},page===1),button('下一页',()=>{page++;render()},page===pages));$('size').onchange=()=>{size=+$('size').value;page=1;render()}}
function search(){const from=$('q-from').value,to=$('q-to').value;if(from&&to&&from>to){$('error').textContent='开始日期不能晚于结束日期';return false}q={};for(const key of ['doc','from','to','mt','g','kw','t','wn'])q[key]=$('q-'+key).value.trim();$('error').textContent='';page=1;render();return true}
$('search').onclick=search;$('reset').onclick=()=>{for(const key of ['doc','from','to','mt','g','kw','t','wn'])$('q-'+key).value='';q={};page=1;$('error').textContent='';render()};$('query').onkeydown=e=>{if(e.key==='Enter')search()};
function csvText(){return '\uFEFF'+[headers,...rows().map(values)].map(line=>line.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')}
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([csvText()],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='月度出入库明细_'+(q.from||'全部')+'_'+(q.to||'全部')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
