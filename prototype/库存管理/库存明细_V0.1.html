<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>即时库存</title><link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px var(--font-ui);color:var(--ink);background:var(--bg-page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}input:focus,select:focus,textarea:focus{outline:none;box-shadow:none}.page{height:100%;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;flex:none}.head h1{margin:0;font-size:20px;line-height:1.5}.actions{display:flex;gap:10px}.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-bg);color:var(--ink)}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.panel{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:6px}.query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;padding:20px 24px;flex:none}.query>label{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;color:var(--gray);white-space:nowrap}.control{width:100%;height:32px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:3px;background:var(--panel-bg);color:var(--ink)}.query-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}.check-field input{width:16px;height:16px;margin:0;justify-self:start;accent-color:var(--teal)}.check-field input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}.list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{height:44px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:normal;overflow-wrap:anywhere}th{position:sticky;top:0;z-index:2;background:var(--bg-soft);color:var(--gray);font-weight:600}tbody tr:hover{background:#f8fbfc}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}.empty td{height:160px;text-align:center;color:var(--gray)}.pager{display:flex;align-items:center;gap:12px;padding-top:16px;flex:none}.pager .total{margin-right:auto;color:var(--gray)}.pager select{width:100px}@media(max-width:960px){.query{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding:12px}.query{grid-template-columns:1fr}.query-actions{justify-content:flex-start}.head{align-items:flex-start;gap:12px}.actions{flex-wrap:wrap;justify-content:flex-end}}
</style><!-- 2026-11-20：按用户要求，批次号保留字段，详情及列表显示—，表单留空，选择弹窗不显示具体值；仅调整展示，原有数据及业务校验不变。 -->
<!-- 2026-11-20：库存字段名称统一为当前库存。 -->
<!-- 2026-11-24：页面标题同步菜单更名为即时库存，沿用原文件路径及查询逻辑。 -->
</head><body><main class="page" data-scene="water-operations"><header class="head"><h1>即时库存</h1><div class="actions"><button class="btn" type="button" id="export">导出</button></div></header><section class="panel query" id="query"><label>物料类型<select class="control" id="q-type"><option value="">全部</option></select></label><label>物料分组<select class="control" id="q-group"><option value="">全部</option></select></label><label>物料编码或名称<input class="control" id="q-kw" placeholder="请输入"></label><label>仓库<select class="control" id="q-wh"><option value="">全部</option></select></label><label>库位<select class="control" id="q-loc"><option value="">全部</option></select></label><label>批次号<input class="control" id="q-batch" placeholder="请输入"></label><label class="check-field">去除零库存<input type="checkbox" id="q-zero"></label><div class="query-actions"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section><section class="panel list" id="list"><div class="table-wrap"><table><colgroup><col style="width:9%"><col style="width:16%"><col style="width:6%"><col style="width:10%"><col style="width:6%"><col style="width:9%"><col style="width:10%"><col style="width:11%"><col style="width:11%"><col style="width:12%"></colgroup><thead><tr><th>物料编码</th><th>物料名称</th><th>规格</th><th class="num">当前库存</th><th>单位</th><th>仓库</th><th>库位</th><th>批次号</th><th>物料分组</th><th>物料类型</th></tr></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section></main><script>
'use strict';
// 2026-11-18：按用户提供的库存明细列表截图生成，并按用户要求调整查询条件与列表字段。页面为只读查询列表，不提供新增、编辑、删除。
// 截图未提供各物料实际库存数：库存数量与零库存示例为演示数据；物料类型演示值统一为“药剂”，类型下拉沿用物料主数据的类型枚举。
// 本项目不管理批次号：保留批次号字段，示例数据不维护批次值，列表无值时显示“—”。
// 查询条件：物料类型、物料分组、物料编码或名称、仓库、库位、批次号、去除零库存，按每行 4 个排列（4+3），查询/重置按钮位于第二行剩余位置；勾选“去除零库存”时过滤库存数为 0 的记录（AI假设，待确认）。
// 列表字段：物料编码、物料名称、规格、当前库存、单位、仓库、库位、批次号、物料分组、物料类型；批次号仅保留字段、无值显示“—”；固定表格布局与百分比列宽，随可用宽度自适应，不出现横向滚动。
// 仓库、库位为联动筛选：仓库选项取自基础管理/仓库原型，库位选项取自基础管理/库位原型；选择仓库后仅显示该仓库库位。
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[
{code:'PJ708',name:'聚合硫酸铁（水剂）',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'加药间库位',supplier:'网购',stock:1250,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ717',name:'氨氮菌粉',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'脱泥间库位',supplier:'网购',stock:48,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ714',name:'散装活性炭',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'加药间库位',supplier:'网购',stock:860,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ713',name:'活性炭',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'加药间库位',supplier:'网购',stock:320,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ711',name:'复合碳源',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'加药间库位',supplier:'网购',stock:2150,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ716',name:'PAC',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'脱泥间库位',supplier:'网购',stock:1750,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ712',name:'次氯酸钠',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'消毒间库位',supplier:'网购',stock:640,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ709',name:'聚合硫酸铁（干粉）',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'脱泥间库位',supplier:'网购',stock:0,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ720',name:'石灰',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'脱泥间库位',supplier:'网购',stock:900,groupCode:'YJXL',group:'药剂系列'},
{code:'PJ710',name:'葡萄糖',unit:'kg',spec:'',whCode:'YJCK',wh:'药剂仓库',loc:'加药间库位',supplier:'网购',stock:0,groupCode:'YJXL',group:'药剂系列'}].map(r=>({...r,type:'药剂',batch:''}));
let q={type:'',group:'',kw:'',wh:'',loc:'',batch:'',zero:false},page=1,size=5;
const fmt=n=>new Intl.NumberFormat('zh-CN').format(n);
// 仓库取自基础管理/仓库原型的仓库主数据；库位取自基础管理/库位原型，按仓库联动。
const warehouses=[['YJCK','药剂仓库'],['JXCK','机修仓库'],['HYCK','化验仓库'],['WJCK','五金仓库'],['FPCK','废品仓库']];
const locations={YJCK:['加药间库位','脱泥间库位','消毒间库位'],JXCK:['机修库位'],HYCK:['化验库位'],WJCK:['五金库位'],FPCK:['废品库位']};
const option=(value,label)=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o};
function fillLocations(wh,selected=''){const all=wh?locations[wh]||[]:[...new Set(Object.values(locations).flat())];$('q-loc').replaceChildren(option('','全部'),...all.map(x=>option(x,x)));$('q-loc').value=all.includes(selected)?selected:''}
$('q-wh').replaceChildren(option('','全部'),...warehouses.map(([value,label])=>option(value,label)));
$('q-group').append(...[...new Map(rows.map(r=>[r.groupCode,r.group])).entries()].map(([value,label])=>option(value,`${value} ${label}`)));
$('q-type').append(...['药剂','工具','化验室','备品备件','劳保用品'].map(x=>option(x,x)));
fillLocations('');
$('q-wh').onchange=()=>fillLocations($('q-wh').value,$('q-loc').value);
function readQuery(){q={type:$('q-type').value,group:$('q-group').value,kw:$('q-kw').value.trim(),wh:$('q-wh').value,loc:$('q-loc').value,batch:$('q-batch').value.trim(),zero:$('q-zero').checked}}
function filtered(){return rows.filter(r=>(!q.type||r.type===q.type)&&(!q.group||r.groupCode===q.group)&&(!q.kw||r.code.toLowerCase().includes(q.kw.toLowerCase())||r.name.includes(q.kw))&&(!q.wh||r.whCode===q.wh)&&(!q.loc||r.loc===q.loc)&&(!q.batch||r.batch.includes(q.batch))&&(!q.zero||r.stock>0)).sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true}))}
function button(text,onclick,disabled=false){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=text;b.disabled=disabled;b.onclick=onclick;return b}
function render(){const data=filtered(),pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);const shown=data.slice((page-1)*size,page*size);$('tbody').innerHTML=shown.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${r.spec?esc(r.spec):'—'}</td><td class="num">${fmt(r.stock)}</td><td>${esc(r.unit)}</td><td>${esc(r.wh)}</td><td>${esc(r.loc)}</td><td>—</td><td>${esc(r.group)}</td><td>${esc(r.type)}</td></tr>`).join('')||'<tr class="empty"><td colspan="10">暂无数据</td></tr>';$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="pageSize" aria-label="每页条数">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(button('上一页',()=>{page--;render()},page===1),button('下一页',()=>{page++;render()},page===pages));$('pageSize').onchange=e=>{size=+e.target.value;page=1;render()}}
$('search').onclick=()=>{readQuery();page=1;render()};
$('reset').onclick=()=>{$('q-type').value='';$('q-group').value='';$('q-kw').value='';$('q-batch').value='';$('q-wh').value='';fillLocations('');$('q-zero').checked=false;q={type:'',group:'',kw:'',wh:'',loc:'',batch:'',zero:false};page=1;render()};
$('query').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('control')){e.preventDefault();$('search').click()}});
render();
</script></body></html>
