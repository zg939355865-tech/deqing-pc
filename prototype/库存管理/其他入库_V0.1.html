// 2026-11-19：批量操作仅作用于选中单据；反审核恢复草稿并清空审核信息，仅内存演示，不联动真实库存。
function readyForAudit(r){return Boolean(businessTypes.includes(r.type)&&r.date&&r.wh&&r.items.length&&r.items.every(m=>Number.isFinite(Number(m.qty))&&Number(m.qty)>0))}
function audit(id){const r=records.find(r=>r.id===id);if(!r||r.status!=='草稿')return;if(!readyForAudit(r)){toast('入库信息不完整，请先编辑并补全必填信息');return}r.status='已入库';r.reviewer='德清威德';r.reviewed=now();renderList();toast('审核成功')}
function syncReceiptSelection(shown){
 $('tbody').querySelectorAll('[data-select]').forEach(i=>i.onchange=()=>{i.checked?selectedReceipts.add(i.dataset.select):selectedReceipts.delete(i.dataset.select);renderList()});
 const count=shown.filter(r=>selectedReceipts.has(r.id)).length,all=$('receipt-all');all.checked=shown.length>0&&count===shown.length;all.indeterminate=count>0&&count<shown.length;all.disabled=!shown.length;all.onchange=e=>{shown.forEach(r=>e.target.checked?selectedReceipts.add(r.id):selectedReceipts.delete(r.id));renderList()};
 const picked=records.filter(r=>selectedReceipts.has(r.id));$('batch-delete').disabled=!picked.length;$('batch-audit').disabled=!picked.length;$('batch-reverse').disabled=!picked.length;
}
function batchAction(action){
 const picked=records.filter(r=>selectedReceipts.has(r.id));if(!picked.length)return;
 const reverse=action==='reverse';if(picked.some(r=>r.status!==(reverse?'已入库':'草稿'))){toast(reverse?'反审核仅适用于已入库单，请调整选择':'删除和审核仅适用于草稿单，请调整选择');return}
 if(action==='audit'&&picked.some(r=>!readyForAudit(r))){toast('选中单据存在未填写的必填信息，请先编辑补全');return}
 if(action==='delete')records=records.filter(r=>!selectedReceipts.has(r.id));
 else{const reviewed=reverse?'':now();picked.forEach(r=>{r.status=reverse?'草稿':'已入库';r.reviewer=reverse?'':'德清威德';r.reviewed=reviewed})}
 selectedReceipts.clear();renderList();if(action!=='delete')toast(reverse?'反审核成功':'审核成功');
}
function field(label,value,required=false){return `<div class="field${label==='备注'?' wide':''}"><label>${required?'<span class="required">*</span>':''}${label}</label><div class="value">${value}</div></div>`}
function select(id,values,value){return `<select class="control" id="${id}"><option value="">请选择</option>${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function openForm(record,view){mode=view;draft=record?structuredClone(record):{id:'',wh:'',date:today(),person:'德清威德',delivery:'',creator:'德清威德',created:'',items:[],type:''};const ro=view==='detail';$('query').hidden=true;$('list').hidden=true;$('form').hidden=false;$('title').textContent=ro?'其他入库详情':view==='edit'?'编辑其他入库':'新增其他入库';$('actions').replaceChildren(button('返回列表',list));if(!ro)$('actions').append(button('提交',()=>save(),true));
$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${field('入库单号',esc(draft.id)||'提交后自动生成')}${field('状态',esc(draft.status)||'草稿')}${field('入库日期',ro?esc(draft.date)||'—':`<input class="control" id="f-date" type="date" value="${esc(draft.date)}">`,!ro)}${field('仓库',ro?esc(draft.wh)||'—':select('f-wh',warehouses,draft.wh),!ro)}${field('业务类型',ro?esc(draft.type)||'—':select('f-type',businessTypes,draft.type),!ro)}${field('创建人',esc(draft.creator)||'德清威德')}${field('创建时间',esc(draft.created)||'—')}${field('审核人',esc(draft.reviewer)||'—')}${field('审核时间',esc(draft.reviewed)||'—')}${field('备注',ro?esc(draft.remark)||'—':`<input class="control" id="f-remark" maxlength="500" value="${esc(draft.remark)}" placeholder="请输入">`)}</div><div class="section-head"><h2>物料明细</h2>${ro?'':'<button class="btn primary" id="add-material">添加物料</button>'}</div><div class="table-wrap"><table><thead><tr><th>序号</th><th>物料编码</th><th>物料名称</th><th>规格</th><th>单位</th><th><span class="required">*</span>入库数量</th><th>供应商</th><th>库位</th><th>批次号</th><th>备注</th>${ro?'':'<th>操作</th>'}</tr></thead><tbody id="items"></tbody></table></div><p class="error" id="form-error" role="alert"></p>`;
if(!ro){for(const [id,key] of [['f-wh','wh'],['f-type','type'],['f-date','date'],['f-remark','remark']])$(id).oninput=()=>{draft[key]=$(id).value;if(key==='wh'){draft.items.forEach(m=>m.location='默认库位');renderItems()}};$('add-material').onclick=()=>{if(!draft.wh)return fail('请先选择仓库','f-wh');selection.clear();mp=1;mq={};['m-type','m-group','m-keyword'].forEach(id=>$(id).value='');renderMaterials();$('picker').showModal()}}renderItems()}
function renderItems(){const ro=mode==='detail';$('items').innerHTML=draft.items.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${esc(m.spec)||'—'}</td><td>${esc(m.unit)}</td><td>${ro?esc(m.qty)||'—':`<input class="control" type="number" min="0" step="any" data-qty="${m.code}" value="${esc(m.qty)}" aria-label="${esc(m.name)}入库数量">`}</td><td>${ro?esc(m.supplier?.name)||'—':`<button type="button" class="control supplier-select" data-supplier="${esc(m.code)}" title="${esc(m.supplier?.name)||'请选择'}" aria-label="选择${esc(m.name)}供应商"><span class="supplier-text">${esc(m.supplier?.name)||'请选择'}</span><svg class="supplier-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></button>`}</td><td>${ro?esc(m.location)||'默认库位':`<select class="control" data-location="${m.code}" aria-label="${esc(m.name)}库位">${[...new Set(['默认库位',m.location].filter(Boolean))].map(v=>`<option value="${esc(v)}" ${v===(m.location||'默认库位')?'selected':''}>${esc(v)}</option>`).join('')}</select>`}</td><td>${ro?'—':`<input class="control" data-batch="${m.code}" readonly aria-readonly="true" value="" maxlength="80" aria-label="${esc(m.name)}批次号">`}</td><td>${ro?esc(m.remark)||'—':`<input class="control" data-remark="${m.code}" value="${esc(m.remark)}" maxlength="500" aria-label="${esc(m.name)}备注">`}</td>${ro?'':`<td><button class="link" data-remove="${m.code}">移除</button></td>`}</tr>`).join('')||`<tr><td colspan="${ro?10:11}" style="text-align:center;height:140px;color:var(--gray)">暂无数据</td></tr>`;
$('items').querySelectorAll('[data-supplier]').forEach(b=>b.onclick=()=>openSupplier(b.dataset.supplier));for(const key of ['qty','batch','location','remark'])$('items').querySelectorAll(`[data-${key}]`).forEach(i=>i.oninput=()=>draft.items.find(m=>m.code===i.dataset[key])[key]=i.value);$('items').querySelectorAll('td').forEach(td=>td.title=td.textContent.trim());$('items').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.items=draft.items.filter(m=>m.code!==b.dataset.remove);renderItems()})}
function materialData(){return catalog.filter(m=>(!mq.keyword||m.code.toLowerCase().includes(mq.keyword.toLowerCase())||m.name.toLowerCase().includes(mq.keyword.toLowerCase()))&&(!mq.group||m.group===mq.group)&&(!mq.type||m.type===mq.type))}
function renderMaterials(){const data=materialData();mp=Math.min(mp,Math.max(1,Math.ceil(data.length/ms)));const shown=data.slice((mp-1)*ms,mp*ms),added=new Set(draft.items.map(m=>m.code));$('materials').innerHTML=shown.map(m=>`<tr><td class="check"><input type="checkbox" data-material="${m.code}" aria-label="选择${esc(m.name)}" ${added.has(m.code)?'disabled checked':selection.has(m.code)?'checked':''}></td><td>${m.code}</td><td>${m.name}</td><td>${m.spec||'—'}</td><td>${m.unit}</td><td>${m.group}</td><td>${m.type}</td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;height:100px">暂无匹配物料</td></tr>';
const available=shown.filter(m=>!added.has(m.code)),checked=available.filter(m=>selection.has(m.code)).length;$('m-all').checked=available.length>0&&checked===available.length;$('m-all').indeterminate=checked>0&&checked<available.length;$('m-all').disabled=!available.length;$('m-all').onchange=e=>{available.forEach(m=>e.target.checked?selection.add(m.code):selection.delete(m.code));renderMaterials()};$('materials').querySelectorAll('[data-material]:not(:disabled)').forEach(i=>i.onchange=()=>{i.checked?selection.add(i.dataset.material):selection.delete(i.dataset.material);renderMaterials()});$('materials').querySelectorAll('tr').forEach(row=>{const check=row.querySelector('[data-material]');if(!check)return;row.classList.toggle('selected',check.checked);row.style.cursor=check.disabled?'default':'pointer';row.onclick=e=>{if(e.target.closest('input,button,a,select')||check.disabled)return;selection.has(check.dataset.material)?selection.delete(check.dataset.material):selection.add(check.dataset.material);renderMaterials()}});$('materials').querySelectorAll('td').forEach(td=>td.title=td.textContent.trim());$('m-confirm').disabled=!selection.size;pager('m-pager',data.length,mp,ms,(p,s)=>{mp=p;ms=s;renderMaterials()})}
function fail(t,id){$('form-error').textContent=t;if(id)$(id).focus()}
// 2026-11-19：OTI+YYMMDD+两位流水；首次保存日期每日递增，编辑保留原号。
const receiptSequences=new Map();
function nextReceiptId(date=today()){
 const prefix='OTI'+date.replaceAll('-','').slice(2);
 const max=Math.max(receiptSequences.get(prefix)||0,...records.filter(r=>/^OTI\d{8}$/.test(r.id)&&r.id.startsWith(prefix)).map(r=>Number(r.id.slice(-2))));
 if(max>=99)return '';
 receiptSequences.set(prefix,max+1);return prefix+String(max+1).padStart(2,'0');
}
function save(){{if(!businessTypes.includes(draft.type))return fail('请选择业务类型','f-type');if(!draft.date)return fail('请选择入库日期','f-date');if(!draft.wh)return fail('请选择仓库','f-wh');if(!draft.items.length)return fail('请至少添加一项物料');const invalidQty=draft.items.find(m=>!Number.isFinite(Number(m.qty))||Number(m.qty)<=0);if(invalidQty){fail('请填写'+invalidQty.name+'的大于0的入库数量');$('items').querySelector(`[data-qty="${invalidQty.code}"]`).focus();return}}
const receiptId=draft.id||nextReceiptId();if(!receiptId){toast('当日入库单流水号已达99，请核实编号规则');return}const saved={...structuredClone(draft),id:receiptId,status:'草稿',reviewer:'',reviewed:'',created:draft.created||now()};const idx=records.findIndex(r=>r.id===saved.id);if(idx>=0)records[idx]=saved;else records.unshift(saved);page=1;list();toast('提交成功')}
$('search').onclick=()=>{if($('q-start').value&&$('q-end').value&&$('q-start').value>$('q-end').value){toast('入库开始日期不能晚于结束日期');return}q={code:$('q-code').value.trim(),status:$('q-status').value,type:$('q-type').value,wh:$('q-wh').value,start:$('q-start').value,end:$('q-end').value};page=1;selectedReceipts.clear();renderList()};$('reset').onclick=()=>{['q-code','q-status','q-type','q-wh','q-start','q-end'].forEach(id=>$(id).value='');q={};page=1;selectedReceipts.clear();renderList()};$('query').onkeydown=e=>{if(e.key==='Enter')$('search').click()};
$('m-group').innerHTML='<option value="">全部</option>'+[...new Set(catalog.map(m=>m.group))].map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
$('m-search').onclick=()=>{mq={type:$('m-type').value,group:$('m-group').value,keyword:$('m-keyword').value.trim()};mp=1;selection.clear();renderMaterials()};$('m-reset').onclick=()=>{['m-type','m-group','m-keyword'].forEach(id=>$(id).value='');mq={};selection.clear();mp=1;renderMaterials()};document.querySelector('.modal-query').onkeydown=e=>{if(e.key==='Enter')$('m-search').click()};$('close-picker').onclick=$('m-cancel').onclick=()=>$('picker').close();$('m-confirm').onclick=()=>{catalog.filter(m=>selection.has(m.code)&&!draft.items.some(x=>x.code===m.code)).forEach(m=>draft.items.push({...m,qty:'',batch:'',location:'默认库位',remark:''}));renderItems();$('form-error').textContent='';$('picker').close()};list();

// 2026-11-20：编码及名称复用供应商管理演示数据；简称为AI假设，仅用于原型。
const supplierCatalog=[{code:'GYS01',name:'杭州超孟贸易有限公司',short:'超孟贸易'},{code:'GYS02',name:'德清宏兴化工有限公司',short:'宏兴化工'},{code:'GYS03',name:'无锡市必盛水处理剂有限公司',short:'必盛水处理'}];
let supplierItem='',supplierSelected='',supplierKeyword='',supplierPage=1,supplierSize=5;
function supplierData(){const k=supplierKeyword.toLowerCase();return supplierCatalog.filter(r=>[r.code,r.name,r.short].some(v=>v.toLowerCase().includes(k)))}
function openSupplier(code){supplierItem=code;supplierSelected=draft.items.find(m=>m.code===code)?.supplier?.code||'';supplierKeyword='';supplierPage=1;$('supplier-keyword').value='';renderSuppliers();$('supplier-picker').showModal()}
function renderSuppliers(){const data=supplierData();supplierPage=Math.min(supplierPage,Math.max(1,Math.ceil(data.length/supplierSize)));$('supplier-rows').innerHTML=data.slice((supplierPage-1)*supplierSize,supplierPage*supplierSize).map(r=>`<tr data-supplier-row="${esc(r.code)}"><td class="check"><input type="radio" name="supplier-choice" value="${esc(r.code)}" aria-label="选择${esc(r.name)}" ${supplierSelected===r.code?'checked':''}></td><td>${esc(r.code)}</td><td title="${esc(r.name)}">${esc(r.name)}</td><td>${esc(r.short)}</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;height:100px">暂无数据</td></tr>';$('supplier-rows').querySelectorAll('[data-supplier-row]').forEach(row=>{row.onclick=()=>{supplierSelected=row.dataset.supplierRow;renderSuppliers()}});$('supplier-confirm').disabled=!supplierCatalog.some(r=>r.code===supplierSelected);pager('supplier-pager',data.length,supplierPage,supplierSize,(p,s)=>{supplierPage=p;supplierSize=s;renderSuppliers()})}
$('supplier-search').onclick=()=>{supplierKeyword=$('supplier-keyword').value.trim();supplierSelected='';supplierPage=1;renderSuppliers()};
$('supplier-reset').onclick=()=>{$('supplier-keyword').value='';supplierKeyword='';supplierSelected='';supplierPage=1;renderSuppliers()};
$('supplier-query').onkeydown=e=>{if(e.key==='Enter')$('supplier-search').click()};
$('supplier-close').onclick=$('supplier-cancel').onclick=()=>$('supplier-picker').close();
$('supplier-confirm').onclick=()=>{const item=draft?.items.find(m=>m.code===supplierItem),supplier=supplierCatalog.find(r=>r.code===supplierSelected);if(!item||!supplier)return;item.supplier={...supplier};renderItems();$('supplier-picker').close()};
</script></body></html>
