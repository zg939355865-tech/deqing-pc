<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工具领用台账</title><link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px var(--font-ui);color:var(--ink);background:var(--bg-page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}input:focus,select:focus,textarea:focus{outline:none;box-shadow:none}.page{height:100%;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;flex:none}.head h1{margin:0;font-size:20px;line-height:1.5}.actions{display:flex;gap:10px}.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-bg);color:var(--ink)}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.panel{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:6px}.query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;padding:20px 24px;flex:none}.query>label{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;color:var(--gray);white-space:nowrap}.control{width:100%;height:32px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:3px;background:var(--panel-bg);color:var(--ink)}.query-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}.check-field input{width:16px;height:16px;margin:0;justify-self:start;accent-color:var(--teal)}.check-field input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}.list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{height:44px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:normal;overflow-wrap:anywhere}th{position:sticky;top:0;z-index:2;background:var(--bg-soft);color:var(--gray);font-weight:600}tbody tr:hover{background:#f8fbfc}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}.empty td{height:160px;text-align:center;color:var(--gray)}.pager{display:flex;align-items:center;gap:12px;padding-top:16px;flex:none}.pager .total{margin-right:auto;color:var(--gray)}.pager select{width:100px}@media(max-width:960px){.query{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding:12px}.query{grid-template-columns:1fr}.query-actions{justify-content:flex-start}.head{align-items:flex-start;gap:12px}.actions{flex-wrap:wrap;justify-content:flex-end}}
th,td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal;padding:8px}.query>label{grid-template-columns:110px minmax(0,1fr)}.date-range{grid-column:span 2}.range{display:flex;align-items:center;gap:8px;min-width:0}.range input{min-width:0}.error{color:var(--err);margin:0}.error:empty{display:none}@media(max-width:640px){.date-range{grid-column:span 1}}
/* 2026-11-20：按内容分配列宽，名称优先；数值列统一右对齐并留足列间距。 */
#report th,#report td{padding:10px 14px;height:44px;vertical-align:middle}
#report th{height:42px}
#report th:nth-child(4),#report td:nth-child(4){text-align:center}
#report .num{text-align:right;font-variant-numeric:tabular-nums;padding-right:22px}
#report th:nth-child(8),#report td:nth-child(8){padding-left:22px}
@media(max-width:1100px){#report th,#report td{padding:8px}#report .num{padding-right:12px}#report th:nth-child(8),#report td:nth-child(8){padding-left:12px}}

#report th,#report td{padding:8px;text-align:left}#report th:nth-child(4),#report td:nth-child(4){text-align:left}#report .num{padding:8px;text-align:right}
</style></head><body>
<!-- 2026-11-24：按用户要求调整台账十字段顺序，数量更名；导出同步。移除仓库查询，领用人改为输入框并支持包含匹配。 -->
<!-- 2026-11-24 V0.1：来源为用户“根据领用出库生成工具领用台账，只是个报表”。参照领料出库字段与收发日报样式。
AI假设：仅纳入已出库且物料类型为工具的单据明细，一条出库明细一行，按出库日期、单号倒序；草稿不纳入，不计算归还或在用余额。
工具编码、名称、单位沿用物料主数据原型；下列领用单据、人员关联、数量及日期均为虚构演示，不表示现场事实。
当前领料出库原型数据仅在其页面内存中，尚无共享数据接口，本报表使用独立模拟源单结构，不宣称实时联动；正式取数及反审核后剔除规则待确认。
仅查询、分页、导出，无新增、编辑、删除、审核或库存变更操作。 -->
<main class="page"><header class="head"><h1>工具领用台账</h1><div class="actions"><button class="btn" id="export">导出</button></div></header>
<section class="panel query" id="query"><label class="date-range">出库日期<span class="range"><input class="control" type="date" id="q-start" aria-label="出库开始日期"><span>至</span><input class="control" type="date" id="q-end" aria-label="出库结束日期"></span></label><label>出库单号<input class="control" id="q-code" placeholder="请输入"></label><label>领用人<input class="control" id="q-person" placeholder="请输入"></label><label>物料编码或名称<input class="control" id="q-kw" placeholder="请输入"></label><div class="query-actions"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section>
<p class="error" id="error" role="alert"></p><section class="panel list"><div class="table-wrap"><table id="report"><colgroup><col style="width:9%"><col style="width:13%"><col style="width:8%"><col style="width:5%"><col style="width:7%"><col style="width:8%"><col style="width:11%"><col style="width:15%"><col style="width:9%"><col style="width:15%"></colgroup><thead><tr><th>物料编码</th><th>物料名称</th><th>规格</th><th>单位</th><th class="num">数量</th><th>领用人</th><th>出库日期</th><th>出库单号</th><th>仓库</th><th>备注</th></tr></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section></main><script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tools=[['PJ828','小翻斗车'],['PJ773','电动自行车'],['PJ771','电动三轮车'],['PJ821','手推车']].map(([code,name])=>({code,name,spec:'',unit:'辆',type:'工具'}));
const sourceRecords=Array.from({length:8},(_,i)=>({id:'MSO2611'+String(24-i).padStart(2,'0')+'01',status:i===7?'草稿':'已出库',date:'2026-11-'+String(24-i).padStart(2,'0'),recipient:['德清威德','任健忠','杨忠英'][i%3],wh:'备件仓库',items:[{...tools[i%4],qty:1,remark:['日常巡检领用','维修作业领用','现场搬运领用'][i%3]}]}));
let q={},page=1,size=5;
function rows(){return sourceRecords.filter(r=>r.status==='已出库'&&(!q.start||r.date>=q.start)&&(!q.end||r.date<=q.end)&&(!q.code||r.id.toLowerCase().includes(q.code.toLowerCase()))&&(!q.person||r.recipient.includes(q.person))).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).flatMap(r=>r.items.filter(m=>m.type==='工具'&&(!q.kw||m.code.toLowerCase().includes(q.kw.toLowerCase())||m.name.includes(q.kw))).map(m=>({id:r.id,date:r.date,person:r.recipient,wh:r.wh,...m})))}
const columns=['code','name','spec','unit','qty','person','date','id','wh','remark'];
function button(t,fn,disabled){const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=fn;b.disabled=disabled;return b}
function render(){const data=rows(),pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);$('tbody').innerHTML=data.slice((page-1)*size,page*size).map(r=>'<tr>'+columns.map(k=>`<td ${k==='qty'?'class="num"':''} title="${esc(r[k]??'')}">${esc(r[k]||'—')}</td>`).join('')+'</tr>').join('')||'<tr class="empty"><td colspan="10">暂无数据</td></tr>';
$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="size" aria-label="每页条数">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(button('上一页',()=>{page--;render()},page===1),button('下一页',()=>{page++;render()},page===pages));$('size').onchange=()=>{size=+$('size').value;page=1;render()}}
function search(){const start=$('q-start').value,end=$('q-end').value;if(start&&end&&start>end){$('error').textContent='开始日期不能晚于结束日期';return}$('error').textContent='';q={start,end,code:$('q-code').value.trim(),person:$('q-person').value.trim(),kw:$('q-kw').value.trim()};page=1;render()}
$('search').onclick=search;$('reset').onclick=()=>{['q-start','q-end','q-code','q-person','q-kw'].forEach(id=>$(id).value='');q={};page=1;$('error').textContent='';render()};$('query').onkeydown=e=>{if(e.key==='Enter')search()};
function csvText(){const lines=[['物料编码','物料名称','规格','单位','数量','领用人','出库日期','出库单号','仓库','备注'],...rows().map(r=>columns.map(k=>r[k]??''))];return '\uFEFF'+lines.map(line=>line.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')}
$('export').onclick=()=>{const blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='工具领用台账_'+(q.start||'全部')+'_'+(q.end||'全部')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
