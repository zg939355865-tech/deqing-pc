<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月度出入库汇总</title><link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px var(--font-ui);color:var(--ink);background:var(--bg-page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}input:focus,select:focus,textarea:focus{outline:none;box-shadow:none}.page{height:100%;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;flex:none}.head h1{margin:0;font-size:20px;line-height:1.5}.actions{display:flex;gap:10px}.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-bg);color:var(--ink)}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.panel{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:6px}.query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;padding:20px 24px;flex:none}.query>label{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;color:var(--gray);white-space:nowrap}.control{width:100%;height:32px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:3px;background:var(--panel-bg);color:var(--ink)}.query-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}.check-field input{width:16px;height:16px;margin:0;justify-self:start;accent-color:var(--teal)}.check-field input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}.list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{height:44px;padding:8px 12px;text-align:left;border-bottom:1px solid var(--line-soft);white-space:normal;overflow-wrap:anywhere}th{position:sticky;top:0;z-index:2;background:var(--bg-soft);color:var(--gray);font-weight:600}tbody tr:hover{background:#f8fbfc}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}.empty td{height:160px;text-align:center;color:var(--gray)}.pager{display:flex;align-items:center;gap:12px;padding-top:16px;flex:none}.pager .total{margin-right:auto;color:var(--gray)}.pager select{width:100px}@media(max-width:960px){.query{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding:12px}.query{grid-template-columns:1fr}.query-actions{justify-content:flex-start}.head{align-items:flex-start;gap:12px}.actions{flex-wrap:wrap;justify-content:flex-end}}
th,td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal;padding:8px}.query>label{grid-template-columns:110px minmax(0,1fr)}.date-range{grid-column:span 2}.range{display:flex;align-items:center;gap:8px;min-width:0}.range input{min-width:0}.error{color:var(--err);margin:0}.error:empty{display:none}@media(max-width:640px){.date-range{grid-column:span 1}}

#report th:nth-child(4),#report td:nth-child(4){text-align:center}

@media(max-width:1100px){#report th,#report td{padding:8px}#report .num{padding-right:12px}#report th:nth-child(8),#report td:nth-child(8){padding-left:12px}}
#report th,#report td{padding:8px 6px}#report .num{padding-right:6px}#report th:nth-child(8),#report td:nth-child(8){padding-left:6px}.query-actions{grid-column:2/-1;justify-content:flex-end}@media(max-width:640px){.query-actions{grid-column:auto}}

</head><body><!-- 2026-11-24：按用户输入修订11列及4项查询，同步CSV导出。沿用现有菜单名称。以下为虚构演示数据，不联动真实库存。AI假设：按物料+仓库汇总，统计自然月取用户选择月份，默认浏览器当前月；opening为演示流水前期初，上月结存为月初库存，本月入出库取月内正负流水，本月结存=上月结存+本月入库-本月出库；正式记账口径待确认。 --><main class="page"><header class="head"><h1>月度出入库汇总</h1><div class="actions"><button class="btn" id="export">导出</button></div></header><section class="panel query" id="query"><label>月份<input class="control" type="month" id="q-month" aria-label="月份" required></label><label>物料类型<select class="control" id="q-type"><option value="">全部</option></select></label><label>物料分组<select class="control" id="q-group"><option value="">全部</option></select></label><label>物料编码或名称<input class="control" id="q-kw" placeholder="请输入"></label><label>仓库<select class="control" id="q-wh"><option value="">全部</option></select></label><div class="query-actions"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section><p class="error" id="error" role="alert"></p><section class="panel list"><div class="table-wrap"><table id="report"><colgroup><col style="width:10%"><col style="width:15%"><col style="width:8%"><col style="width:5%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:7%"><col style="width:10%"></colgroup><thead><tr><th>物料编码</th><th>物料名称</th><th>规格</th><th>单位</th><th class="num">上月结存</th><th class="num">本月入库</th><th class="num">本月出库</th><th class="num">本月结存</th><th>物料分组</th><th>物料类型</th><th>仓库</th></tr></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section></main><script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v.toLocaleString('zh-CN',{maximumFractionDigits:3});
const materials=[['PJ716','PAC','kg','药剂系列','药剂','药剂仓库',3200],['PJ708','聚合硫酸铁（水剂）','kg','药剂系列','药剂','药剂仓库',1250],['PJ712','次氯酸钠','kg','药剂系列','药剂','药剂仓库',640],['PJ711','复合碳源','kg','药剂系列','药剂','药剂仓库',2150],['PJ714','散装活性炭','kg','药剂系列','药剂','药剂仓库',500],['PJ883','纳氏试剂','瓶','化验室药剂','化验室','化验仓库',10],['PJ966','容量瓶白1000ml','个','化验室器皿','化验室','化验仓库',6],['PJ821','手推车','辆','工具系列','工具','备件仓库',2]].map(([code,name,unit,group,type,wh,opening])=>({code,name,unit,group,type,wh,opening,spec:code==='PJ883'?'500g':code==='PJ966'?'1000ml':''}));
const movements=materials.flatMap((m,i)=>[{code:m.code,wh:m.wh,date:'2026-11-19',qty:i<5?200:2},{code:m.code,wh:m.wh,date:'2026-11-20',qty:i<5?-50:-1}]);
const now=new Date(),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,defaultMonth=dateKey(now).slice(0,7);
let q={month:defaultMonth},page=1,size=5;
for(const [id,key] of [['q-type','type'],['q-group','group'],['q-wh','wh']])for(const v of new Set(materials.map(m=>m[key]))){const o=document.createElement('option');o.value=v;o.textContent=v;$(id).append(o)}
function rows(){const [year,month]=q.month.split('-').map(Number),start=q.month+'-01',end=dateKey(new Date(year,month,0));return materials.filter(m=>(!q.type||m.type===q.type)&&(!q.group||m.group===q.group)&&(!q.wh||m.wh===q.wh)&&(!q.kw||m.code.toLowerCase().includes(q.kw.toLowerCase())||m.name.includes(q.kw))).map(m=>{const all=movements.filter(t=>t.code===m.code&&t.wh===m.wh&&t.date<=end),period=all.filter(t=>t.date>=start);return {...m,previous:m.opening+all.filter(t=>t.date<start).reduce((s,t)=>s+t.qty,0),income:period.filter(t=>t.qty>0).reduce((s,t)=>s+t.qty,0),issued:-period.filter(t=>t.qty<0).reduce((s,t)=>s+t.qty,0),balance:m.opening+all.reduce((s,t)=>s+t.qty,0)}})}
function button(t,fn,disabled){const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=fn;b.disabled=disabled;return b}
function render(){const data=rows(),pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);$('tbody').innerHTML=data.slice((page-1)*size,page*size).map(r=>`<tr>${[r.code,r.name,r.spec||'—',r.unit].map(v=>`<td title="${esc(v)}">${esc(v)}</td>`).join('')}${['previous','income','issued','balance'].map(k=>`<td class="num" title="${fmt(r[k])}">${fmt(r[k])}</td>`).join('')}${[r.group,r.type,r.wh].map(v=>`<td title="${esc(v)}">${esc(v)}</td>`).join('')}</tr>`).join('')||'<tr class="empty"><td colspan="11">暂无数据</td></tr>';
$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="size">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(button('上一页',()=>{page--;render()},page===1),button('下一页',()=>{page++;render()},page===pages));$('size').onchange=()=>{size=+$('size').value;page=1;render()}}
function search(){const month=$('q-month').value;if(!/^\d{4,}-\d{2}$/.test(month)||!$('q-month').checkValidity()){$('error').textContent='请选择有效月份';$('q-month').focus();return}$('error').textContent='';q={month,type:$('q-type').value,group:$('q-group').value,wh:$('q-wh').value,kw:$('q-kw').value.trim()};page=1;render()}
$('search').onclick=search;$('reset').onclick=()=>{['q-type','q-group','q-kw','q-wh'].forEach(id=>$(id).value='');$('q-month').value=defaultMonth;q={month:defaultMonth};$('error').textContent='';page=1;render()};$('query').onkeydown=e=>{if(e.key==='Enter')search()};
function csvText(){const data=rows(),lines=[['物料编码','物料名称','规格','单位','上月结存','本月入库','本月出库','本月结存','物料分组','物料类型','仓库'],...data.map(r=>[r.code,r.name,r.spec,r.unit,r.previous,r.income,r.issued,r.balance,r.group,r.type,r.wh])];return '\uFEFF'+lines.map(line=>line.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')}
$('export').onclick=()=>{const blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='月度出入库汇总_'+q.month+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('q-month').value=defaultMonth;render();
</script></body></html>
