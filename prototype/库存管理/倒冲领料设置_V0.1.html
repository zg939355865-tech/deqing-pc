'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},now=()=>day()+' '+new Date().toTimeString().slice(0,8);
const clone=o=>JSON.parse(JSON.stringify(o));
function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))||clone(fallback)}catch{return clone(fallback)}}
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{toast('浏览器未允许保存，下次打开将恢复样例')}}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function btn(t,fn,primary=false){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=t;b.onclick=fn;return b}
function field(label,html,wide=false){const box=document.createElement('div');box.innerHTML=html;const control=box.querySelector('input,select,textarea'),id=control?.id;const required=['f-scene','f-wh','f-enabled','f-date','f-kind','f-person'].includes(id);let readonly=false;if(detail&&control){html=esc(control.tagName==='SELECT'?(control.value||'—'):(control.value||'—'))}else if(control){if(required)control.setAttribute('aria-required','true');html=box.innerHTML}if(!control&&!detail&&['创建人','创建时间','领料单号','状态','审核人','审核时间','关联出库流水'].includes(label))readonly=true;return `<div class="field${wide?' wide':''}${readonly?' readonly':''}"><label ${id&&!detail?`for="${id}"`:''}>${required&&!detail?'<span class="required">*</span>':''}${label}</label><div class="value">${html}</div></div>`}

function titles(){document.querySelectorAll('td,th').forEach(el=>el.title=el.textContent.trim())}
function paginate(data,draw){page=Math.min(page,Math.max(1,Math.ceil(data.length/size)));$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${Math.max(1,Math.ceil(data.length/size))} 页</span><select class="control" aria-label="每页条数">${[5,10,20,50].map(n=>`<option ${n===size?'selected':''}>${n}</option>`).join('')}</select>`;$('pager').querySelector('select').onchange=e=>{size=+e.target.value;page=1;draw()};for(const [t,n,off] of [['上一页',page-1,page===1],['下一页',page+1,page*size>=data.length]]){const b=btn(t,()=>{page=n;draw()});b.disabled=off;$('pager').append(b)}return data.slice((page-1)*size,page*size)}
// 情境化虚构样例，编码、库存、人员和仓库归属均待现场核实；未连接真实物料主数据或库存。
const catalog=[{code:'PJ716',name:'PAC',spec:'25kg/袋',unit:'kg',type:'生产'}, {code:'YJ002',name:'PAM',spec:'25kg/袋',unit:'kg',type:'生产'}, {code:'YJ003',name:'葡萄糖',spec:'25kg/袋',unit:'kg',type:'生产'}, {code:'HY001',name:'重铬酸钾',spec:'500g/瓶',unit:'瓶',type:'化验'}, {code:'HY002',name:'硫酸银',spec:'100g/瓶',unit:'瓶',type:'化验'}, {code:'HY003',name:'硫酸汞',spec:'100g/瓶',unit:'瓶',type:'化验'}, {code:'HY004',name:'氢氧化钠',spec:'500g/瓶',unit:'瓶',type:'化验'}, {code:'HY005',name:'盐酸',spec:'500mL/瓶',unit:'瓶',type:'化验'}];
const configKey='dqwd-backflush-config-v1',reportKey='dqwd-lab-issue-v1';
const defaults=[{id:'cfg-prod',scene:'生产',wh:'药剂仓库',enabled:'启用',created:'2026-11-23 09:00:00',creator:'当前用户',items:catalog.slice(0,3).map(x=>({...x,enabled:'启用'}))},{id:'cfg-lab',scene:'化验',wh:'化验仓库',enabled:'启用',created:'2026-11-23 09:10:00',creator:'当前用户',items:catalog.slice(3,7).map(x=>({...x,enabled:'启用'}))}];
let configs=read(configKey,defaults),page=1,size=5,selected=new Set(),draft=null,detail=false;
let pickerSource=[],pickerSelection=new Set(),onPick=null,pickerPage=1,pickerSize=5,pickerQuery={};
function pick(source,callback){pickerSource=source;pickerSelection.clear();onPick=callback;pickerPage=1;pickerQuery={};['pk-key','pk-type','pk-group'].forEach(id=>$(id).value='');pickerRows();$('picker').showModal()}
function pickerRows(){const data=pickerSource.filter(m=>(!pickerQuery.key||(m.code+m.name).includes(pickerQuery.key))&&(!pickerQuery.type||(m.type==='生产'?'药剂':'化验试剂')===pickerQuery.type)&&(!pickerQuery.group||(m.type==='生产'?'生产药剂':'化验试剂')===pickerQuery.group));const totalPages=Math.max(1,Math.ceil(data.length/pickerSize));pickerPage=Math.min(pickerPage,totalPages);const shown=data.slice((pickerPage-1)*pickerSize,pickerPage*pickerSize);$('pk-body').innerHTML=shown.map(m=>`<tr class="${pickerSelection.has(m.code)?'selected':''}"><td class="check"><input aria-label="选择${esc(m.name)}" type="checkbox" value="${esc(m.code)}" ${pickerSelection.has(m.code)?'checked':''}></td><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${esc(m.spec)}</td><td>${esc(m.unit)}</td></tr>`).join('')||'<tr><td colspan="5">暂无可选物料</td></tr>';$('pk-body').querySelectorAll('input').forEach(i=>{i.onchange=()=>{i.checked?pickerSelection.add(i.value):pickerSelection.delete(i.value);pickerRows()};i.closest('tr').onclick=e=>{if(e.target.tagName==='INPUT')return;i.checked=!i.checked;i.onchange()}});const n=shown.filter(m=>pickerSelection.has(m.code)).length,all=$('pk-all');all.checked=!!shown.length&&n===shown.length;all.indeterminate=n>0&&n<shown.length;all.disabled=!shown.length;all.onchange=()=>{shown.forEach(m=>all.checked?pickerSelection.add(m.code):pickerSelection.delete(m.code));pickerRows()};$('pk-add').disabled=!pickerSelection.size;$('pk-pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${pickerPage} / ${totalPages} 页</span><select class="control" aria-label="物料每页条数">${[5,10,20,50].map(n=>`<option ${n===pickerSize?'selected':''}>${n}</option>`).join('')}</select>`;$('pk-pager').querySelector('select').onchange=e=>{pickerSize=+e.target.value;pickerPage=1;pickerRows()};for(const [t,p,off] of [['上一页',pickerPage-1,pickerPage===1],['下一页',pickerPage+1,pickerPage===totalPages]]){const b=btn(t,()=>{pickerPage=p;pickerRows()});b.disabled=off;$('pk-pager').append(b)}titles()}
$('pk-search').onclick=()=>{pickerQuery={key:$('pk-key').value.trim(),type:$('pk-type').value,group:$('pk-group').value};pickerPage=1;pickerSelection.clear();pickerRows()};$('pk-reset').onclick=()=>{['pk-key','pk-type','pk-group'].forEach(id=>$(id).value='');pickerQuery={};pickerPage=1;pickerSelection.clear();pickerRows()};$('pk-close').onclick=()=>$('picker').close();$('pk-cancel').onclick=()=>$('picker').close();$('pk-add').onclick=()=>{onPick(pickerSource.filter(m=>pickerSelection.has(m.code)));$('picker').close()};
function selection(shown,draw){$('rows').querySelectorAll('[data-check]').forEach(i=>i.onchange=()=>{i.checked?selected.add(i.dataset.check):selected.delete(i.dataset.check);draw()});const all=$('all'),n=shown.filter(r=>selected.has(r.id)).length;all.checked=!!shown.length&&n===shown.length;all.indeterminate=n>0&&n<shown.length;all.disabled=!shown.length;all.onchange=()=>{shown.forEach(r=>all.checked?selected.add(r.id):selected.delete(r.id));draw()};$('batch-del').disabled=!selected.size}
function showForm(){ $('query').hidden=true;$('list').hidden=true;$('form').hidden=false }
function showList(){ $('query').hidden=false;$('list').hidden=false;$('form').hidden=true;$('title').textContent=TITLE }


const TITLE='倒冲领料设置';let q={};
function render(){showList();$('actions').replaceChildren(btn('批量删除',()=>{const picked=configs.filter(r=>selected.has(r.id));if(picked.some(r=>read(reportKey,[]).some(d=>d.scene===r.scene&&d.wh===r.wh))){toast('配置已被领料记录引用，请停用');return}configs=configs.filter(r=>!selected.has(r.id));selected.clear();write(configKey,configs);render()}),btn('新增',()=>edit(null),true));$('actions').firstChild.id='batch-del';draw()}
function draw(){const data=configs.filter(r=>(!q.scene||r.scene===q.scene)&&(!q.wh||r.wh===q.wh)&&(!q.enabled||r.enabled===q.enabled)).sort((a,b)=>b.created.localeCompare(a.created));const shown=paginate(data,draw);$('rows').innerHTML=shown.map(r=>`<tr><td class="check"><input type="checkbox" data-check="${r.id}" ${selected.has(r.id)?'checked':''} aria-label="选择配置"></td><td><button class="link" data-view="${r.id}">${r.scene}领料</button></td><td>${esc(r.wh)}</td><td>${r.items.length}</td><td><span class="status ${r.enabled==='停用'?'off':''}">${r.enabled}</span></td><td>${esc(r.creator)}</td><td>${r.created}</td><td><div class="row-ops"><button class="link" data-edit="${r.id}">编辑</button><button class="link" data-delete="${r.id}">删除</button></div></td></tr>`).join('')||'<tr><td colspan="8">暂无数据</td></tr>';
for(const [attr,fn] of [['view',id=>edit(configs.find(r=>r.id===id),true)],['edit',id=>edit(configs.find(r=>r.id===id))],['delete',id=>{const c=configs.find(r=>r.id===id);if(read(reportKey,[]).some(r=>r.scene===c.scene&&r.wh===c.wh)){toast('配置已被领料记录引用，请停用');return}configs=configs.filter(r=>r.id!==id);selected.delete(id);write(configKey,configs);draw()}]])$('rows').querySelectorAll(`[data-${attr}]`).forEach(b=>b.onclick=()=>fn(b.dataset[attr]));selection(shown,draw);titles()}
function edit(r,ro=false){draft=clone(r||{id:'cfg-'+Date.now(),scene:'',wh:'',enabled:'启用',creator:'当前用户',created:'',items:[]});detail=ro;showForm();$('title').textContent=TITLE+' · '+(ro?'详情':r?'编辑':'新增');$('actions').replaceChildren(btn('返回列表',render));if(!ro)$('actions').append(btn('保存',save,true));form()}
function form(){const d=draft;$('form').innerHTML='<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">'+field('业务场景',select('f-scene',['生产','化验'],d.scene,detail))+field('仓库',select('f-wh',['药剂仓库','化验仓库','备件仓库'],d.wh,detail))+field('状态',select('f-enabled',['启用','停用'],d.enabled,detail))+field('创建人',esc(d.creator))+field('创建时间',esc(d.created||'—'))+'</div><p class="error" id="error" role="alert"></p><div class="section-head"><h2>填报物料</h2><div id="item-actions"></div></div><div class="table-wrap"><table><thead><tr><th style="width:60px">顺序</th><th>物料编码</th><th>物料名称</th><th>规格</th><th style="width:65px">单位</th><th style="width:90px">状态</th>'+(!detail?'<th style="width:160px">操作</th>':'')+'</tr></thead><tbody id="items"></tbody></table></div>';
if(!detail){for(const k of ['scene','wh','enabled'])$('f-'+k).onchange=e=>{draft[k]=e.target.value};$('item-actions').append(btn('选择物料',()=>pick(catalog.filter(m=>!draft.items.some(x=>x.code===m.code)),picked=>{draft.items.push(...picked.map(m=>({...m,enabled:'启用'})));itemRows()})))}itemRows()}
function itemRows(){ $('items').innerHTML=draft.items.map((m,i)=>`<tr ${!detail?'draggable="true"':''} data-index="${i}"><td>${i+1}</td><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${esc(m.spec)}</td><td>${esc(m.unit)}</td><td>${detail?esc(m.enabled):select('enabled-'+i,['启用','停用'],m.enabled)}</td>${detail?'':`<td><div class="move"><button class="link" data-up="${i}" ${i===0?'disabled':''}>上移</button><button class="link" data-down="${i}" ${i===draft.items.length-1?'disabled':''}>下移</button><button class="link" data-remove="${i}">移除</button></div></td>`}</tr>`).join('')||`<tr><td colspan="${detail?6:7}">暂无物料</td></tr>`;if(!detail){draft.items.forEach((m,i)=>$('enabled-'+i).onchange=e=>m.enabled=e.target.value);for(const [attr,offset] of [['up',-1],['down',1]])$('items').querySelectorAll(`[data-${attr}]`).forEach(b=>b.onclick=()=>move(+b.dataset[attr],+b.dataset[attr]+offset));$('items').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.items.splice(+b.dataset.remove,1);itemRows()});$('items').querySelectorAll('tr[data-index]').forEach(tr=>{tr.ondragstart=e=>{if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName)){e.preventDefault();return}e.dataTransfer.setData('text/plain',tr.dataset.index)};tr.ondragover=e=>e.preventDefault();tr.ondrop=e=>{e.preventDefault();const from=Number(e.dataTransfer.getData('text/plain'));move(from,+tr.dataset.index)}})}titles()}
function move(from,to){if(!Number.isInteger(from)||from<0||to<0||from>=draft.items.length||to>=draft.items.length)return;const [m]=draft.items.splice(from,1);draft.items.splice(to,0,m);itemRows()}
function save(){if(!draft.scene||!draft.wh||!draft.enabled){$('error').textContent='请选择业务场景、仓库和状态';return}if(!draft.items.length){$('error').textContent='请至少添加一项物料';return}if(draft.enabled==='启用'&&!draft.items.some(m=>m.enabled==='启用')){$('error').textContent='启用配置至少保留一项启用物料';return}if(configs.some(c=>c.id!==draft.id&&c.scene===draft.scene&&c.wh===draft.wh)){$('error').textContent='该业务场景与仓库已存在配置，请编辑已有配置';return}const old=configs.find(c=>c.id===draft.id);if(old&&read(reportKey,[]).some(r=>r.wh===old.wh&&r.scene===old.scene)&&(old.wh!==draft.wh||old.scene!==draft.scene)){$('error').textContent='已有领料记录引用，不能修改场景或仓库';return}draft.created ||= now();configs=configs.filter(c=>c.id!==draft.id);configs.push(clone(draft));write(configKey,configs);render();toast('保存成功')}
$('search').onclick=()=>{q={scene:$('q-scene').value,wh:$('q-wh').value,enabled:$('q-enabled').value};page=1;selected.clear();draw()};$('reset').onclick=()=>{['q-scene','q-wh','q-enabled'].forEach(id=>$(id).value='');q={};page=1;selected.clear();draw()};render();
</script></body></html>
