  const shown=data.slice((page-1)*size,page*size);
  $('thead').innerHTML='<tr><th class="num">序号</th><th>业务类型</th><th>业务日期</th><th>物料编码</th><th>物料名称</th><th>规格</th><th class="num">出入库数量</th><th class="num">当时剩余数量</th><th>单位</th><th>批次号</th><th>库位</th><th>仓库</th><th>供应商</th><th>物料分组</th><th>物料类型</th><th>业务单据</th><th class="num">行号</th><th>流水号</th></tr>';
  $('tbody').innerHTML=shown.map((r,i)=>`<tr><td class="num">${(page-1)*size+i+1}</td><td><span class="tag ${typeTag(r.t)}">${esc(r.t)}</span></td><td>${esc(r.d)}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.spec)||'—'}</td><td class="num ${r.qty>0?'in':'out'}">${r.qty>0?'+':''}${r.qty.toLocaleString('zh-CN')}</td><td class="num">${r.bal.toLocaleString('zh-CN')}</td><td>${esc(r.unit)}</td><td>—</td><td>${esc(r.loc)}</td><td>${esc(r.wn)}</td><td><span class="ellip" title="${esc(r.sup)}">${esc(r.sup)||'—'}</span></td><td>${esc(r.g)||'—'}</td><td>${esc(r.mt)||'—'}</td><td><span class="ellip doc" title="${esc(r.doc)}">${esc(r.doc)}</span></td><td class="num">${r.line}</td><td>${esc(r.serial)}</td></tr>`).join('')||'<tr><td class="empty" colspan="18" style="height:160px;text-align:center;color:var(--gray)">暂无数据</td></tr>';
  $('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="pageSize" aria-label="每页条数">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;
  const prev=document.createElement('button');prev.className='btn';prev.textContent='上一页';prev.disabled=page===1;prev.onclick=()=>{page--;renderList()};
  const next=document.createElement('button');next.className='btn';next.textContent='下一页';next.disabled=page===pages;next.onclick=()=>{page++;renderList()};
  $('pager').append(prev,next);
  $('pageSize').onchange=e=>{size=+e.target.value;page=1;renderList()};
}
// 导出按钮沿用项目既有口径：仅界面展示，不接入真实导出。
$('exportBtn').onclick=null;
drawQuery();renderList();
</script></body></html>
