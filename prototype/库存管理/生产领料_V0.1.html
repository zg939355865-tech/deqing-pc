<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生产投料</title><link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px var(--font-ui);background:var(--bg-page);color:var(--ink)}.page{height:100%;padding:20px 24px;display:flex;flex-direction:column;gap:16px;min-height:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none}h1{font-size:20px;margin:0}.actions,.query-ops{display:flex;gap:10px;align-items:center}.btn{font:inherit;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:white;color:var(--ink);cursor:pointer}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn:disabled{opacity:.5;cursor:default}.panel{background:white;border:1px solid var(--line-soft);border-radius:6px}.query{padding:20px 24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:center;flex:none}.query label{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:center;white-space:nowrap}.control{font:inherit;min-width:0;width:100%;height:32px;padding:4px 8px;border:1px solid var(--line-soft);border-radius:3px;color:var(--ink);background:white}input:focus,select:focus{outline:none;box-shadow:none}.report{display:flex;flex-direction:column;flex:1;min-height:0;padding:20px 24px;gap:14px}.report-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-soft)}.tabs button{font:inherit;border:0;background:none;padding:10px 22px;cursor:pointer;color:var(--gray)}.tabs button.active{border-bottom:2px solid var(--teal);color:var(--teal)}.status{padding:4px 10px;border-radius:3px;background:var(--info-bg);color:var(--teal)}.status.done{background:#f6ffed;color:#389e0d}.status.off{background:var(--bg-soft);color:var(--gray)}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;table-layout:fixed;border-collapse:collapse}th,td{height:35px;padding:4px 8px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{background:var(--bg-soft);font-weight:600;color:var(--gray)}thead th{position:sticky;top:0;z-index:2}.sheet th:first-child{width:16.666%}.sheet input{height:27px;width:100%;min-width:0;font:inherit;color:var(--ink);padding:3px 5px;border:1px solid var(--line-soft);border-radius:3px;background:white}.sheet input:hover{border-color:var(--line)}.sheet .quantity td{border-bottom:2px solid var(--line)}.sheet .person td{background:var(--bg-soft)}.sheet .person input{max-width:240px}.summary{flex:none;border:1px solid var(--line-soft)}.summary td,.summary th{height:32px}.meta{display:flex;gap:24px;flex-wrap:wrap;color:var(--gray);font-size:12px;flex:none}.error{color:var(--err);margin:0;flex:none}.error:empty{display:none}.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border:1px solid var(--line);border-radius:6px;box-shadow:var(--sh-pop);padding:14px 22px;z-index:20}dialog{width:min(520px,90vw);padding:24px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}dialog::backdrop{background:#14263d66}dialog h2{font-size:18px;margin:0 0 18px}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}[hidden]{display:none!important}@media(max-width:900px){.query{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding:12px}.report,.query{padding:12px}.page-head{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}th,td{padding:4px 2px}}.person-label{display:flex;align-items:center;gap:10px;white-space:nowrap}#person select{width:150px;height:28px}.sheet td{height:40px}.sheet th:first-child{width:16%}.sheet th:last-child{width:80px}.row-save{font:inherit;border:0;background:none;color:var(--teal);cursor:pointer;padding:4px 8px;white-space:nowrap}.sheet tfoot td{position:sticky;bottom:0;background:var(--bg-soft);font-weight:600;border-top:2px solid var(--line);z-index:1}/* 2026-11-23：默认10行与合计适配表格可用高度，不通过隐藏滚动条裁切内容。 */
.sheet{height:100%}.sheet th,.sheet td{height:auto;padding:2px 8px}.sheet thead tr,.sheet tfoot tr{height:32px}.sheet input{height:26px}.report{gap:10px}.sheet tfoot td{height:32px}
</style><!-- 2026-11-24：按用户要求，页面标题更名为生产投料，保留原文件路径及交互。 -->
</head><body><!-- 2026-11-23：按用户截图移除页头操作及审核状态，表格右侧增加逐行保存；本页仅记录，不执行审批或扣库。 --><!-- 2026-11-23：按用户纠正改为直接表格，无列表及新增、编辑、删除入口。日期唯一定位日报；时间为每行共用时间，每班默认10行记录，取消末行自动追加；历史超出10行的已填数据保留；值班人使用下拉选择，选项为未核实演示人员。单位、审批权限、领料与加药口径待确认；数据仅本地演示，不执行扣库。 --><main class="page"><header class="page-head"><h1>生产投料</h1></header><section class="panel query"><label>日期<input type="date" class="control" id="q-date"></label><div class="query-ops"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section><section class="panel report"><div class="report-head"><div class="tabs" id="tabs"></div><div class="actions"><label class="person-label">值班人 <span id="person"></span></label></div></div><div class="table-wrap" id="sheet-wrap"><table class="sheet"><thead><tr><th>时间</th><th>PAC（t）</th><th>PAM（t）</th><th>葡萄糖（t）</th><th>醋酸钠（t）</th><th>活性炭（t）</th><th>操作</th></tr></thead><tbody id="sheet-body"></tbody><tfoot id="sheet-total"></tfoot></table></div><p class="error" role="alert" id="error"></p></section></main><div class="toast" id="toast" role="status" hidden></div><script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const meds=['PAC','PAM','葡萄糖','醋酸钠','活性炭'],key='dqwd-production-daily-v01',clone=v=>JSON.parse(JSON.stringify(v));
const today=()=>new Date().toLocaleDateString('sv-SE'),now=()=>new Date().toLocaleString('sv-SE'),emptyRow=()=>({time:'',qty:Array(5).fill('')});
const fresh=()=>({id:Date.now().toString()+Math.random().toString(36).slice(2),date:today(),phase:'一期',creator:'当前用户',created:'',shifts:[{person:'',rows:Array.from({length:10},emptyRow)},{person:'',rows:Array.from({length:10},emptyRow)}]});
let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records))records=[]}catch{records=[]}
if(!records.length){const r=fresh();r.id='sample-production';r.created='2026-11-23 08:15:00';r.shifts[0].person='当班人员甲';r.shifts[1].person='当班人员乙';r.shifts[0].rows[0]={time:'08:00',qty:['120','5','','','']};records=[r]}

let draft=null,shift=0,toastTimer;const sessionDrafts=new Map();
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
const editable=()=>true;
function pad(r){r.shifts.forEach(s=>{s.rows=s.rows.flatMap(row=>{if(!row.times)return [row];const groups=new Map();row.qty.forEach((v,i)=>{const t=row.times[i]||'';if(v!==''||t){if(!groups.has(t))groups.set(t,{time:t,qty:Array(5).fill('')});groups.get(t).qty[i]=v}});return groups.size?[...groups.values()]:[emptyRow()]});while(s.rows.length>10&&!s.rows.at(-1).time&&s.rows.at(-1).qty.every(v=>v===''))s.rows.pop();while(s.rows.length<10)s.rows.push(emptyRow())});return r}
function lookupKey(date){return date}
function load(){const date=$('q-date').value;if(!date){toast('请选择日期');return}if(draft)sessionDrafts.set(draft.date,clone(draft));const found=sessionDrafts.get(date)||records.find(r=>r.date===date);draft=pad(found?clone(found):{...fresh(),date});shift=0;render();$('sheet-wrap').scrollTop=0}
function cell(v,n,i,t){return editable()?`<input aria-label="${shift?'夜班':'白班'}第${n+1}行${i<0?'时间':meds[i]+'用量'}" type="${t}" ${t==='number'?'min="0" step="any" placeholder="请输入"':''} value="${esc(v)}" oninput="updateCell(${n},${i},this.value)">`:esc(v)||'—'}
function rowHTML(r,n){return `<tr><td>${cell(r.time,n,-1,'time')}</td>${r.qty.map((v,i)=>`<td>${cell(v,n,i,'number')}</td>`).join('')}<td><button class="row-save" onclick="saveRow(${n})" aria-label="保存${shift?'夜班':'白班'}第${n+1}行">保存</button></td></tr>`}
function render(){const b=draft.shifts[shift];$('tabs').innerHTML=['白班','夜班'].map((x,i)=>`<button class="${shift===i?'active':''}" onclick="shift=${i};render()">${x}</button>`).join('');$('person').innerHTML=editable()?`<select class="control" aria-label="${shift?'夜班':'白班'}值班人" onchange="draft.shifts[shift].person=this.value"><option value="">请选择</option>${[...new Set(['当班人员甲','当班人员乙',b.person].filter(Boolean))].map(name=>`<option value="${esc(name)}" ${b.person===name?'selected':''}>${esc(name)}</option>`).join('')}</select>`:esc(b.person)||'—';$('sheet-body').innerHTML=b.rows.map(rowHTML).join('');renderTotal();$('error').textContent=''}
// 2026-11-23：取消保存成功Toast，按当前日期、当前班次各物料列实时合计，包含正在填写的值。
function renderTotal(){const rows=draft.shifts[shift].rows;const totals=meds.map((_,i)=>{const sum=rows.reduce((n,r)=>{const v=Number(r.qty[i]);return n+(Number.isFinite(v)&&v>0?v:0)},0);return Number(sum.toFixed(8)).toString()});$('sheet-total').innerHTML='<tr><td>合计</td>'+totals.map(v=>`<td title="${v}">${v}</td>`).join('')+'<td></td></tr>'}
function updateCell(n,i,v){if(!editable())return;const rows=draft.shifts[shift].rows;if(i<0)rows[n].time=v;else rows[n].qty[i]=v;renderTotal();}
function persist(next){try{localStorage.setItem(key,JSON.stringify(next));records=next;return true}catch{toast('本地保存失败，请检查浏览器存储设置');return false}}
// 2026-11-23：改为逐行保存，无提交、审核、驳回及状态展示；只保存所选行和当前班次值班人，不连带保存其他未保存行。
function saveRow(n){const branch=draft.shifts[shift],row=branch.rows[n],filled=row.qty.some(v=>v!=='');let err='';if(!draft.date)err='请选择日期';else if((filled&&!row.time)||(row.time&&!filled))err='请填写时间及至少一种物料用量';else if(filled&&!branch.person.trim())err='请选择值班人';else if(row.qty.some(v=>v!==''&&(!Number.isFinite(Number(v))||Number(v)<=0)))err='物料用量须大于0';if(err){$('error').textContent=`第${n+1}行：${err}`;return}
const stored=records.find(r=>r.date===draft.date);const next=pad(stored?clone(stored):{...fresh(),id:draft.id,date:draft.date});next.created ||= now();next.shifts[shift].person=branch.person;next.shifts[shift].rows[n]={...clone(row),updated:now()};delete next.status;delete next.reviewer;delete next.reviewed;if(!persist([...records.filter(r=>r.date!==next.date),next]))return;draft.id=next.id;draft.created=next.created;sessionDrafts.set(draft.date,clone(draft));$('error').textContent='';renderTotal()}
$('search').onclick=load;$('reset').onclick=()=>{$('q-date').value=today();load()};$('q-date').value=today();load();
</script></body></html>
