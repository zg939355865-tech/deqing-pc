<main class="page" data-scene="water-operations"><header class="page-head"><h1 id="title">领料出库</h1><div class="actions" id="actions"></div></header>

function list(){draft=null;mode='';$('title').textContent='领料出库';$('query').hidden=false;$('list').hidden=false;$('form').hidden=true;const del=button('批量删除',()=>batchAction('delete')),auditBtn=button('审核',()=>batchAction('audit')),reverse=button('反审核',()=>batchAction('reverse'));del.id='batch-delete';auditBtn.id='batch-audit';reverse.id='batch-reverse';$('actions').replaceChildren(del,auditBtn,reverse,button('新增出库单',()=>openForm(null,'new'),true));renderList()}
function renderList(){const data=filtered();page=Math.min(page,Math.max(1,Math.ceil(data.length/size)));$('tbody').innerHTML=data.slice((page-1)*size,page*size).map(r=>`<tr><td class="check"><input type="checkbox" data-select="${esc(r.id)}" aria-label="选择${esc(r.id)}" ${selectedReceipts.has(r.id)?'checked':''}></td><td><button class="link" data-view="${esc(r.id)}">${esc(r.id)}</button></td><td><span class="status ${r.status==='已出库'?'done':r.status==='草稿'?'off':''}">${r.status}</span></td><td>${esc(r.date)||'—'}</td><td>${esc(r.recipient)||'—'}</td><td>${esc(r.wh)||'—'}</td><td>${esc(r.creator)||'—'}</td><td>${esc(r.created)||'—'}</td><td>${esc(r.reviewer)||'—'}</td><td>${esc(r.reviewed)||'—'}</td><td><div class="row-ops"><button class="link" data-edit="${esc(r.id)}" ${r.status==='草稿'?'':'disabled'}>编辑</button><button class="link" data-delete="${esc(r.id)}" ${r.status==='草稿'?'':'disabled'}>删除</button></div></td></tr>`).join('')||'<tr><td colspan="11" style="text-align:center;height:150px">暂无数据</td></tr>';
for(const [attr,fn] of [['view',id=>openForm(records.find(r=>r.id===id),'detail')],['edit',id=>openForm(records.find(r=>r.id===id),'edit')],['delete',id=>{records=records.filter(r=>r.id!==id||r.status!=='草稿');selectedReceipts.delete(id);renderList()}]])$('tbody').querySelectorAll(`[data-${attr}]:not(:disabled)`).forEach(b=>b.onclick=()=>fn(b.dataset[attr]));$('tbody').querySelectorAll('td').forEach(td=>td.title=td.textContent.trim());syncReceiptSelection(data.slice((page-1)*size,page*size));pager('pager',data.length,page,size,(p,s)=>{page=p;size=s;renderList()})}
// 2026-11-19：批量操作仅作用于选中单据；反审核恢复草稿并清空审核信息，仅内存演示，不联动真实库存。
function isTradeIn(m){return (catalog.find(c=>c.code===m.code)?.tradeIn??m.tradeIn)===true}
function validOldQty(m){return !isTradeIn(m)||(String(m.oldQty??'').trim()!==''&&Number.isFinite(Number(m.oldQty))&&Number(m.oldQty)>0)}
function readyForAudit(r){return Boolean(r.date&&r.wh&&r.recipient&&r.items.length&&r.items.every(m=>validOldQty(m)&&Number.isFinite(Number(m.qty))&&Number(m.qty)>0&&Number(m.qty)<=m.stock))}
function audit(id){const r=records.find(r=>r.id===id);if(!r||r.status!=='草稿')return;if(!readyForAudit(r)){toast('出库信息不完整，请先编辑并补全必填信息');return}r.status='已出库';r.reviewer='德清威德';r.reviewed=now();renderList();toast('审核成功')}
function syncReceiptSelection(shown){
 $('tbody').querySelectorAll('[data-select]').forEach(i=>i.onchange=()=>{i.checked?selectedReceipts.add(i.dataset.select):selectedReceipts.delete(i.dataset.select);renderList()});
 const count=shown.filter(r=>selectedReceipts.has(r.id)).length,all=$('receipt-all');all.checked=shown.length>0&&count===shown.length;all.indeterminate=count>0&&count<shown.length;all.disabled=!shown.length;all.onchange=e=>{shown.forEach(r=>e.target.checked?selectedReceipts.add(r.id):selectedReceipts.delete(r.id));renderList()};
 const picked=records.filter(r=>selectedReceipts.has(r.id));$('batch-delete').disabled=!picked.length;$('batch-audit').disabled=!picked.length;$('batch-reverse').disabled=!picked.length;
}
function batchAction(action){
 const picked=records.filter(r=>selectedReceipts.has(r.id));if(!picked.length)return;
 const reverse=action==='reverse';if(picked.some(r=>r.status!==(reverse?'已出库':'草稿'))){toast(reverse?'反审核仅适用于已出库单，请调整选择':'删除和审核仅适用于草稿单，请调整选择');return}
 if(action==='audit'&&picked.some(r=>!readyForAudit(r))){toast('选中单据存在未填写的必填信息，请先编辑补全');return}
 if(action==='delete')records=records.filter(r=>!selectedReceipts.has(r.id));
 else{const reviewed=reverse?'':now();picked.forEach(r=>{r.status=reverse?'草稿':'已出库';r.reviewer=reverse?'':'德清威德';r.reviewed=reviewed})}
 selectedReceipts.clear();renderList();if(action!=='delete')toast(reverse?'反审核成功':'审核成功');
}
function field(label,value,required=false){return `<div class="field${label==='备注'?' wide':''}"><label>${required?'<span class="required">*</span>':''}${label}</label><div class="value">${value}</div></div>`}
function select(id,values,value){return `<select class="control" id="${id}"><option value="">请选择</option>${values.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
function openForm(record,view){mode=view;draft=record?structuredClone(record):{id:'',wh:'',date:today(),person:'德清威德',recipient:'',delivery:'',creator:'德清威德',created:'',items:[],type:'领料出库'};const ro=view==='detail';$('query').hidden=true;$('list').hidden=true;$('form').hidden=false;$('title').textContent=ro?'领料出库详情':view==='edit'?'编辑领料出库':'新增领料出库';$('actions').replaceChildren(button('返回列表',list));if(!ro)$('actions').append(button('提交',()=>save(),true));
$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${field('出库单号',esc(draft.id)||'提交后自动生成')}${field('状态',esc(draft.status)||'草稿')}${field('出库日期',ro?esc(draft.date)||'—':`<input class="control" id="f-date" type="date" value="${esc(draft.date)}">`,!ro)}${field('领用人',ro?esc(draft.recipient)||'—':select('f-recipient',recipients,draft.recipient),!ro)}${field('仓库',ro?esc(draft.wh)||'—':select('f-wh',warehouses,draft.wh),!ro)}${field('创建人',esc(draft.creator)||'德清威德')}${field('创建时间',esc(draft.created)||'—')}${field('审核人',esc(draft.reviewer)||'—')}${field('审核时间',esc(draft.reviewed)||'—')}${field('备注',ro?esc(draft.remark)||'—':`<input class="control" id="f-remark" maxlength="500" value="${esc(draft.remark)}" placeholder="请输入">`)}</div><div class="section-head"><h2>物料明细</h2>${ro?'':'<button class="btn primary" id="add-material">添加库存</button>'}</div><div class="table-wrap"><table><thead><tr><th>序号</th><th>物料编码</th><th>物料名称</th><th>规格</th><th>单位</th><th>库位</th><th>当前库存</th><th><span class="required">*</span>出库数量</th><th>以旧换新</th><th>旧件数量</th><th>批次号</th><th>备注</th>${ro?'':'<th>操作</th>'}</tr></thead><tbody id="items"></tbody></table></div><p class="error" id="form-error" role="alert"></p>`;
if(!ro){for(const [id,key] of [['f-wh','wh'],['f-recipient','recipient'],['f-date','date'],['f-remark','remark']])$(id).oninput=()=>{draft[key]=$(id).value;if(key==='wh'){draft.items=[];renderItems()}if(key==='recipient')renderItems()};$('add-material').onclick=()=>{if(!draft.wh)return fail('请先选择仓库','f-wh');selection.clear();mp=1;mq={};['m-type','m-group','m-keyword'].forEach(id=>$(id).value='');renderMaterials();$('picker').showModal()}}renderItems()}
function renderItems(){const ro=mode==='detail';$('items').innerHTML=draft.items.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${esc(m.spec)||'—'}</td><td>${esc(m.unit)}</td><td>${esc(m.location)||'—'}</td><td>${esc(m.stock) || '0'}</td><td>${ro?esc(m.qty)||'—':`<input class="control" type="number" min="0" step="any" title="可用库存：${esc(m.stock)} ${esc(m.unit)}" max="${m.stock}" data-qty="${m.code}" value="${esc(m.qty)}" aria-label="${esc(m.name)}出库数量">`}</td><td>${isTradeIn(m)?'是':'否'}</td><td>${ro?(isTradeIn(m)?esc(m.oldQty)||'—':'—'):`<input class="control" type="number" min="0" step="any" data-old-qty="${m.code}" value="${isTradeIn(m)?esc(m.oldQty):''}" ${isTradeIn(m)?'required':'disabled'} aria-label="${esc(m.name)}旧件数量" placeholder="${isTradeIn(m)?'请输入':''}">`}</td><td>${ro?'—':`<input class="control" data-batch="${m.code}" readonly aria-readonly="true" value="" maxlength="80" aria-label="${esc(m.name)}批次号">`}</td><td>${ro?esc(m.remark)||'—':`<input class="control" data-remark="${m.code}" value="${esc(m.remark)}" maxlength="500" aria-label="${esc(m.name)}备注">`}</td>${ro?'':`<td><button class="link" data-remove="${m.code}">移除</button></td>`}</tr>`).join('')||`<tr><td colspan="${ro?12:13}" style="text-align:center;height:140px;color:var(--gray)">暂无数据</td></tr>`;
for(const [attr,key] of [['qty','qty'],['batch','batch'],['remark','remark'],['old-qty','oldQty']])$('items').querySelectorAll(`[data-${attr}]`).forEach(i=>i.oninput=()=>{const item=draft.items.find(m=>m.code===i.getAttribute('data-'+attr));if(item)item[key]=i.value;$('form-error').textContent=''});$('items').querySelectorAll('td').forEach(td=>td.title=td.textContent.trim());$('items').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.items=draft.items.filter(m=>m.code!==b.dataset.remove);renderItems()})}
function materialData(){return catalog.filter(m=>(!mq.keyword||m.code.toLowerCase().includes(mq.keyword.toLowerCase())||m.name.toLowerCase().includes(mq.keyword.toLowerCase()))&&(!mq.group||m.group===mq.group)&&(!mq.type||m.type===mq.type))}
function renderMaterials(){const data=materialData();mp=Math.min(mp,Math.max(1,Math.ceil(data.length/ms)));const shown=data.slice((mp-1)*ms,mp*ms),added=new Set(draft.items.map(m=>m.code));$('materials').innerHTML=shown.map(m=>`<tr><td class="check"><input type="checkbox" data-material="${m.code}" aria-label="选择${esc(m.name)}" ${added.has(m.code)?'disabled checked':selection.has(m.code)?'checked':''}></td><td>${m.code}</td><td>${m.name}</td><td>${m.spec||'—'}</td><td>${m.unit}</td><td>${esc(m.stock)}</td><td>${esc(m.location)}</td><td>—</td><td>${m.group}</td><td>${m.type}</td></tr>`).join('')||'<tr><td colspan="10" style="text-align:center;height:100px">暂无匹配物料</td></tr>';
const available=shown.filter(m=>!added.has(m.code)),checked=available.filter(m=>selection.has(m.code)).length;$('m-all').checked=available.length>0&&checked===available.length;$('m-all').indeterminate=checked>0&&checked<available.length;$('m-all').disabled=!available.length;$('m-all').onchange=e=>{available.forEach(m=>e.target.checked?selection.add(m.code):selection.delete(m.code));renderMaterials()};$('materials').querySelectorAll('[data-material]:not(:disabled)').forEach(i=>i.onchange=()=>{i.checked?selection.add(i.dataset.material):selection.delete(i.dataset.material);renderMaterials()});$('materials').querySelectorAll('tr').forEach(row=>{const check=row.querySelector('[data-material]');if(!check)return;row.classList.toggle('selected',check.checked);row.style.cursor=check.disabled?'default':'pointer';row.onclick=e=>{if(e.target.closest('input,button,a,select')||check.disabled)return;selection.has(check.dataset.material)?selection.delete(check.dataset.material):selection.add(check.dataset.material);renderMaterials()}});$('materials').querySelectorAll('td').forEach(td=>td.title=td.textContent.trim());$('m-confirm').disabled=!selection.size;pager('m-pager',data.length,mp,ms,(p,s)=>{mp=p;ms=s;renderMaterials()})}
function fail(t,id){$('form-error').textContent=t;if(id)$(id).focus()}
// 2026-11-19：MSO + YYMMDD + 两位流水号；按首次保存日期每日递增，编辑保持原号。
const issueSequences=new Map();
function nextReceiptId(date=today()){
 const prefix='MSO'+date.replaceAll('-','').slice(2);
 const max=Math.max(issueSequences.get(prefix)||0,...records.filter(r=>/^MSO\d{8}$/.test(r.id)&&r.id.startsWith(prefix)).map(r=>Number(r.id.slice(-2))));
 if(max>=99)return '';
 issueSequences.set(prefix,max+1);return prefix+String(max+1).padStart(2,'0');
}
function save(){{if(!draft.date)return fail('请选择出库日期','f-date');if(!draft.wh)return fail('请选择仓库','f-wh');if(!draft.recipient)return fail('请选择领用人','f-recipient');if(!draft.items.length)return fail('请至少添加一项物料');const invalidQty=draft.items.find(m=>!Number.isFinite(Number(m.qty))||Number(m.qty)<=0||Number(m.qty)>m.stock);if(invalidQty){fail('请填写'+invalidQty.name+'的出库数量须大于0且不超过可用库存');$('items').querySelector(`[data-qty="${invalidQty.code}"]`).focus();return}const missingOld=draft.items.find(m=>!validOldQty(m));if(missingOld){fail(missingOld.name+'：以旧换新物料须填写大于0的旧件数量');$('items').querySelector(`[data-old-qty="${missingOld.code}"]`).focus();return}}
const receiptId=draft.id||nextReceiptId();if(!receiptId){toast('当日出库单流水号已达99，请核实编号规则');return}const saved={...structuredClone(draft),id:receiptId,status:'草稿',reviewer:'',reviewed:'',created:draft.created||now()};const idx=records.findIndex(r=>r.id===saved.id);if(idx>=0)records[idx]=saved;else records.unshift(saved);page=1;list();toast('提交成功')}
$('search').onclick=()=>{if($('q-start').value&&$('q-end').value&&$('q-start').value>$('q-end').value){toast('出库开始日期不能晚于结束日期');return}q={code:$('q-code').value.trim(),status:$('q-status').value,wh:$('q-wh').value,start:$('q-start').value,end:$('q-end').value};page=1;selectedReceipts.clear();renderList()};$('reset').onclick=()=>{['q-code','q-status','q-wh','q-start','q-end'].forEach(id=>$(id).value='');q={};page=1;selectedReceipts.clear();renderList()};$('query').onkeydown=e=>{if(e.key==='Enter')$('search').click()};
$('m-type').innerHTML='<option value="">全部</option>'+[...new Set(catalog.map(m=>m.type))].map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
$('m-group').innerHTML='<option value="">全部</option>'+[...new Set(catalog.map(m=>m.group))].map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
$('m-search').onclick=()=>{mq={type:$('m-type').value,group:$('m-group').value,keyword:$('m-keyword').value.trim()};mp=1;selection.clear();renderMaterials()};$('m-reset').onclick=()=>{['m-type','m-group','m-keyword'].forEach(id=>$(id).value='');mq={};selection.clear();mp=1;renderMaterials()};document.querySelector('.modal-query').onkeydown=e=>{if(e.key==='Enter')$('m-search').click()};$('close-picker').onclick=$('m-cancel').onclick=()=>$('picker').close();$('m-confirm').onclick=()=>{catalog.filter(m=>selection.has(m.code)&&!draft.items.some(x=>x.code===m.code)).forEach(m=>draft.items.push({...m,qty:'',oldQty:'',remark:''}));renderItems();$('form-error').textContent='';$('picker').close()};list();
</script></body></html>
