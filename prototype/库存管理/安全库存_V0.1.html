<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安全库存</title><link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css"><style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg-page);color:var(--ink);font:13px var(--font-ui)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:1px}.page{height:100%;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.page-head{display:flex;align-items:center;justify-content:space-between;flex:none}.page-head h1{margin:0;font-size:20px;line-height:1.5}.actions{display:flex;gap:10px}.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-bg);color:var(--ink)}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{border-color:var(--teal);background:var(--teal);color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.btn.danger{color:var(--err)}.panel{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:6px}.query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;gap:16px;padding:20px 24px;flex:none}.query label{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:10px;color:var(--gray)}.control{width:100%;height:32px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:3px;background:var(--panel-bg);color:var(--ink)}.query-ops{display:flex;justify-content:flex-end;gap:8px}.list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{height:44px;padding:8px 14px;text-align:left;border-bottom:1px solid var(--line-soft)}th{position:sticky;top:0;z-index:2;background:var(--bg-soft);font-weight:600;color:var(--gray)}tbody tr:hover{background:#f8fbfc}.check{position:sticky;left:0;z-index:3;width:44px;min-width:44px;text-align:center;background:var(--panel-bg)}th.check{z-index:4;background:var(--bg-soft)}.status{display:inline-block;padding:3px 8px;border-radius:3px;background:var(--info-bg);color:var(--teal)}.status.off{background:var(--bg-soft);color:var(--gray)}.link{padding:3px 0;border:0;background:none;color:var(--teal);cursor:pointer}.row-ops{display:flex;gap:12px}.pager{display:flex;align-items:center;gap:12px;padding-top:16px;flex:none}.pager .total{margin-right:auto;color:var(--gray)}.pager select{width:100px}.form{min-height:0;overflow:auto;padding:24px}.tabs{margin:0 0 20px;border-bottom:1px solid var(--line-soft)}.tab{display:inline-block;padding:10px 16px;color:var(--teal);border-bottom:2px solid var(--teal)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.field{display:grid;grid-template-columns:110px minmax(0,1fr);min-height:40px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.field label{display:flex;align-items:center;padding:6px 10px;background:var(--bg-soft);color:var(--gray)}.field .value{display:flex;align-items:center;min-width:0;padding:6px 10px;background:var(--panel-bg)}.field .control{height:28px}.field textarea.control{height:auto;min-height:52px;resize:vertical}.wide{grid-column:1/-1}.required{color:var(--err);margin-right:3px}.readonly{background:var(--bg-soft)}.error{min-height:20px;margin:12px 0 0;color:var(--err)}.toast{position:fixed;left:50%;top:50%;z-index:10;transform:translate(-50%,-50%);max-width:min(520px,calc(100vw - 48px));padding:14px 22px;border:1px solid var(--line);border-radius:6px;background:var(--panel-bg);box-shadow:var(--sh-pop);color:var(--ink)}[hidden]{display:none!important}@media(max-width:1000px){.query{grid-template-columns:repeat(2,minmax(0,1fr))}.query-ops{justify-content:flex-end}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding:12px}.query{grid-template-columns:1fr}.query-ops{justify-content:flex-start}.grid{grid-template-columns:1fr}.page-head{gap:12px;align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}}
    /* 查询标签及输入焦点的项目统一规范。 */

    input:focus,select:focus,textarea:focus{outline:none;box-shadow:none}
  
.form{flex:1}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section-head h2{font-size:14px;margin:0}.form .table-wrap{overflow:auto}.qty{width:110px}dialog{border:1px solid var(--line);border-radius:8px;padding:24px;width:min(1200px,95vw);max-height:90vh;color:var(--ink);background:var(--panel-bg)}dialog::backdrop{background:#14263d66}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:18px}.modal-query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.modal-query label{display:flex;flex-direction:column;gap:6px}.modal-table{max-height:42vh;overflow:auto}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.status.done{color:#389e0d;background:#f6ffed}.link:disabled{color:#b8bec5;cursor:not-allowed}.field input[readonly]{background:var(--bg-soft)}.error:empty{display:none}@media(max-width:700px){.modal-query{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style><!-- 2026-11-20：库存字段名称统一为当前库存。 -->
<!-- 2026-11-20：移除列表更新时间；编辑详情采用统一字段网格，无物料子列表；新增编辑主操作统一提交。 -->
<!-- 2026-11-20：安全库存物料弹窗参照领料出库，查询类型、分组、编码或名称；库存未知仍显示—，批次不展示具体值。 -->

</head><body>
<!-- 2026-11-19 V0.1。来源：用户四张安全库存截图。AI假设：仓库+物料唯一、安全库存为非负数、低于安全量=max(安全库存-当前库存,0)。2026-11-19按用户要求补充8条虚构示例，安全库存与当前库存仅用于界面演示，不代表现场阈值；仅内存演示，不触发补货或告警。 -->
<main class="page"><header class="page-head"><h1 id="title">安全库存</h1><div class="actions" id="actions"></div></header>
<section class="panel query" id="query">
<label>物料类型<select class="control" id="q-type"><option value="">全部</option><option>药剂</option></select></label><label>物料分组<select class="control" id="q-group"><option value="">全部</option><option value="YJXL">药剂系列</option></select></label><label>物料编码或名称<input class="control" id="q-kw" placeholder="请输入"></label><label>仓库<select class="control" id="q-wh"><option value="">全部</option><option>药剂仓库</option></select></label><label>低于安全库存<select class="control" id="q-low"><option value="">全部</option><option value="yes">是</option><option value="no">否</option></select></label><div class="query-ops"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section>
<section class="panel list" id="list"><div class="table-wrap"><table><thead><tr><th class="check"><input type="checkbox" id="all" aria-label="选择当前页全部记录"></th><th>物料编码</th><th>物料名称</th><th>规格</th><th>单位</th><th>安全库存</th><th>当前库存</th><th>低于安全库存量</th><th>物料分组</th><th>物料类型</th><th>仓库</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section>
<section class="panel form" id="form" hidden></section></main><div class="toast" id="toast" role="status" hidden></div>
<dialog id="picker" aria-labelledby="picker-title"><div class="modal-head"><h2 id="picker-title">选择物料</h2><button class="btn" id="close-picker" aria-label="关闭">×</button></div><div class="modal-query"><label>物料类型<select class="control" id="m-type"><option value="">全部</option><option>工具</option><option>化验室</option><option>药剂</option></select></label><label>物料分组<select class="control" id="m-group"><option value="">全部</option></select></label><label>物料编码或名称<input class="control" id="m-keyword" placeholder="请输入"></label><div class="query-ops"><button class="btn" id="m-reset">重置</button><button class="btn primary" id="m-search">查询</button></div></div><div class="modal-table"><table><thead><tr><th class="check"><input type="checkbox" id="m-all" aria-label="选择当前页全部物料"></th><th>物料编码</th><th>物料名称</th><th>规格</th><th>单位</th><th>物料分组</th><th>物料类型</th></tr></thead><tbody id="materials"></tbody></table></div><footer class="pager" id="m-pager"></footer><div class="modal-footer"><button class="btn" id="m-cancel">返回</button><button class="btn primary" id="m-confirm" disabled>添加</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const catalog=[['PJ716','PAC'],['PJ708','聚合硫酸铁（水剂）'],['PJ712','次氯酸钠'],['PJ711','复合碳源'],['PJ714','散装活性炭'],['PJ720','石灰'],['PJ718','醋酸钠'],['PJ710','葡萄糖'],['PJ709','聚合硫酸铁（干粉）'],['PJ713','活性炭']].map(([code,name])=>({code,name,unit:'kg',spec:'',stock:null,groupCode:'YJXL',group:'药剂系列',type:'药剂',location:'默认库位',batch:''}));

// 用户要求的虚构示例：含低于、等于、高于阈值及库存未知；保留两项物料供新增演示。
const sampleLevels=[[5000,3200],[3000,4200],[1500,1500],[8000,5100],[1000,0],[2000,2650],[3500,2800],[1200,null]];
let records=catalog.slice(0,8).map((m,i)=>({...m,id:'药剂仓库-'+m.code,wh:'药剂仓库',safe:sampleLevels[i][0],stock:sampleLevels[i][1],created:`2026-11-${String(19-Math.floor(i/2)).padStart(2,'0')} ${i%2?'09:15:00':'14:30:00'}`})),page=1,size=5,q={},draft=null,mode='',selection=new Set(),selected=new Set(),mp=1,ms=5,mq={};
records.forEach(r=>r.updated=r.created);
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function now(){return today()+' '+new Date().toTimeString().slice(0,8)}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function button(t,fn,primary=false){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=t;b.onclick=fn;return b}
function pager(id,count,p,s,change){const pages=Math.max(1,Math.ceil(count/s));$(id).innerHTML=`<span class="total">共 ${count} 条</span><span>第 ${p} / ${pages} 页</span><select class="control" aria-label="每页条数">${[5,10,20,50].map(n=>`<option ${n===s?'selected':''} value="${n}">${n}条/页</option>`).join('')}</select>`;$(id).querySelector('select').onchange=e=>change(1,+e.target.value);for(const [t,np,disabled] of [['上一页',p-1,p===1],['下一页',p+1,p===pages]]){const b=button(t,()=>change(np,s));b.disabled=disabled;$(id).append(b)}}
function field(label,value,required=false){return `<div class="field${label==='备注'?' remark-field':''}"><label>${required?'<span class="required">*</span>':''}${label}</label><div class="value">${value}</div></div>`}

function filtered(){return records.filter(r=>(!q.type||r.type===q.type)&&(!q.group||r.groupCode===q.group)&&(!q.kw||r.code.toLowerCase().includes(q.kw.toLowerCase())||r.name.includes(q.kw))&&(!q.wh||r.wh===q.wh)&&(!q.low||(r.stock!==null&&(q.low==='yes'?r.stock<r.safe:r.stock>=r.safe)))).sort((a,b)=>b.updated.localeCompare(a.updated))}
function list(){draft=null;mode='';$('title').textContent='安全库存';$('query').hidden=false;$('list').hidden=false;$('form').hidden=true;const del=button('批量删除',()=>{records=records.filter(r=>!selected.has(r.id));selected.clear();renderList()});del.id='bulk';$('actions').replaceChildren(del,button('新增安全库存',()=>openForm(null,'new'),true));renderList()}
function renderList(){const data=filtered();page=Math.min(page,Math.max(1,Math.ceil(data.length/size)));const shown=data.slice((page-1)*size,page*size);$('tbody').innerHTML=shown.map(r=>`<tr><td class="check"><input type="checkbox" data-select="${r.id}" aria-label="选择${r.name}" ${selected.has(r.id)?'checked':''}></td><td><button class="link" data-detail="${r.id}">${esc(r.code)}</button></td><td>${esc(r.name)}</td><td>${esc(r.spec)||'—'}</td><td>${esc(r.unit)}</td><td>${r.safe}</td><td>${r.stock??'—'}</td><td>${r.stock===null?'—':Math.max(r.safe-r.stock,0)}</td><td>${esc(r.group)}</td><td>${esc(r.type)}</td><td>${esc(r.wh)}</td><td><div class="row-ops"><button class="link" data-edit="${r.id}">编辑</button><button class="link" data-delete="${r.id}">删除</button></div></td></tr>`).join('')||'<tr><td colspan="12" style="text-align:center;height:160px;color:var(--gray)">暂无数据</td></tr>';
$('tbody').querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openForm(records.find(r=>r.id===b.dataset.detail),'detail'));$('tbody').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(records.find(r=>r.id===b.dataset.edit),'edit'));$('tbody').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{records=records.filter(r=>r.id!==b.dataset.delete);selected.delete(b.dataset.delete);renderList()});$('tbody').querySelectorAll('[data-select]').forEach(i=>i.onchange=()=>{i.checked?selected.add(i.dataset.select):selected.delete(i.dataset.select);renderList()});const n=shown.filter(r=>selected.has(r.id)).length;$('all').checked=shown.length>0&&n===shown.length;$('all').indeterminate=n>0&&n<shown.length;$('all').disabled=!shown.length;$('all').onchange=e=>{shown.forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));renderList()};$('tbody').querySelectorAll('td').forEach(td=>td.title=td.textContent.trim());$('bulk').disabled=!selected.size;pager('pager',data.length,page,size,(p,s)=>{page=p;size=s;renderList()})}
function openForm(record,view){mode=view;draft=record?{wh:record.wh,created:record.created,items:[structuredClone(record)]}:{wh:'',created:'',items:[]};const ro=view==='detail';$('query').hidden=true;$('list').hidden=true;$('form').hidden=false;$('title').textContent=ro?'安全库存详情':view==='edit'?'编辑安全库存':'新增安全库存';$('actions').replaceChildren(button('返回列表',list));if(!ro)$('actions').append(button('提交',save,true));
if(view!=='new'){
const m=draft.items[0];
$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${field('所属工厂','德清水厂')}${field('仓库',esc(draft.wh))}${field('物料编码',esc(m.code))}${field('物料名称',esc(m.name))}${field('规格',esc(m.spec)||'—')}${field('单位',esc(m.unit))}${field('安全库存',ro?esc(m.safe):`<input class="control" id="f-safe" type="number" min="0" step="any" value="${esc(m.safe)}" aria-label="安全库存">`,!ro)}${field('当前库存',m.stock??'—')}${field('低于安全库存量',m.stock===null?'—':Math.max(m.safe-m.stock,0))}${field('物料分组',esc(m.group))}${field('物料类型',esc(m.type))}${field('创建人','德清威德')}${field('创建时间',esc(draft.created)||'—')}${field('备注',ro?esc(m.remark)||'—':`<input class="control" id="f-remark" value="${esc(m.remark)}" maxlength="500" placeholder="请输入">`)}</div><p class="error" id="form-error" role="alert"></p>`;
if(!ro){$('f-safe').oninput=()=>{m.safe=$('f-safe').value};$('f-remark').oninput=()=>{m.remark=$('f-remark').value}}return;
}
$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${field('所属工厂','德清水厂')}${field('仓库',ro||view==='edit'?esc(draft.wh):'<select class="control" id="f-wh"><option value="">请选择仓库</option><option>药剂仓库</option></select>',true)}${field('创建人','德清威德')}${field('创建时间',esc(draft.created)||'—')}</div><div class="section-head"><h2>物料明细</h2>${view==='new'?'<button class="btn primary" id="add-material">添加物料</button>':''}</div><div class="table-wrap"><table><thead><tr><th>序号</th><th>物料编码</th><th>物料名称</th><th>规格</th><th>单位</th><th><span class="required">*</span>安全库存</th><th>物料分组</th><th>物料类型</th><th>备注</th>${view==='new'?'<th>操作</th>':''}</tr></thead><tbody id="items"></tbody></table></div><p class="error" id="form-error" role="alert"></p>`;
if(view==='new'){$('f-wh').onchange=e=>{draft.wh=e.target.value;draft.items=[];renderItems()};$('add-material').onclick=()=>{if(!draft.wh){$('form-error').textContent='请先选择仓库';$('f-wh').focus();return}selection.clear();mp=1;mq={};['m-type','m-group','m-keyword'].forEach(id=>$(id).value='');renderMaterials();$('picker').showModal()}}renderItems()}
function renderItems(){$('items').innerHTML=draft.items.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.code)}</td><td>${esc(m.name)}</td><td>${esc(m.spec)||'—'}</td><td>${esc(m.unit)}</td><td><input class="control" type="number" min="0" step="any" required value="${esc(m.safe)}" data-safe="${esc(m.code)}" aria-label="${esc(m.name)}安全库存" placeholder="请输入"></td><td>${esc(m.group)}</td><td>${esc(m.type)}</td><td><input class="control" data-remark="${esc(m.code)}" value="${esc(m.remark)}" maxlength="500" placeholder="请输入" aria-label="${esc(m.name)}备注"></td><td><button class="link" data-remove="${esc(m.code)}">移除</button></td></tr>`).join('')||'<tr><td colspan="10" style="text-align:center;height:120px;color:var(--gray)">暂无数据</td></tr>';for(const key of ['safe','remark'])$('items').querySelectorAll(`[data-${key}]`).forEach(i=>i.oninput=()=>draft.items.find(m=>m.code===i.dataset[key])[key]=i.value);$('items').querySelectorAll('td').forEach(td=>td.title=td.textContent.trim());$('items').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.items=draft.items.filter(m=>m.code!==b.dataset.remove);renderItems()})}
function materialData(){return catalog.filter(m=>(!mq.keyword||m.code.toLowerCase().includes(mq.keyword.toLowerCase())||m.name.toLowerCase().includes(mq.keyword.toLowerCase()))&&(!mq.group||m.group===mq.group)&&(!mq.type||m.type===mq.type))}
function renderMaterials(){const data=materialData();mp=Math.min(mp,Math.max(1,Math.ceil(data.length/ms)));const shown=data.slice((mp-1)*ms,mp*ms),added=new Set(draft.items.map(m=>m.code));$('materials').innerHTML=shown.map(m=>`<tr><td class="check"><input type="checkbox" data-material="${m.code}" aria-label="选择${esc(m.name)}" ${added.has(m.code)?'disabled checked':selection.has(m.code)?'checked':''}></td><td>${m.code}</td><td>${m.name}</td><td>${m.spec||'—'}</td><td>${m.unit}</td><td>${m.group}</td><td>${m.type}</td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;height:100px">暂无匹配物料</td></tr>';
const available=shown.filter(m=>!added.has(m.code)),checked=available.filter(m=>selection.has(m.code)).length;$('m-all').checked=available.length>0&&checked===available.length;$('m-all').indeterminate=checked>0&&checked<available.length;$('m-all').disabled=!available.length;$('m-all').onchange=e=>{available.forEach(m=>e.target.checked?selection.add(m.code):selection.delete(m.code));renderMaterials()};$('materials').querySelectorAll('[data-material]:not(:disabled)').forEach(i=>i.onchange=()=>{i.checked?selection.add(i.dataset.material):selection.delete(i.dataset.material);renderMaterials()});$('materials').querySelectorAll('tr').forEach(row=>{const check=row.querySelector('[data-material]');if(!check)return;row.classList.toggle('selected',check.checked);row.style.cursor=check.disabled?'default':'pointer';row.onclick=e=>{if(e.target.closest('input,button,a,select')||check.disabled)return;selection.has(check.dataset.material)?selection.delete(check.dataset.material):selection.add(check.dataset.material);renderMaterials()}});$('materials').querySelectorAll('td').forEach(td=>td.title=td.textContent.trim());$('m-confirm').disabled=!selection.size;pager('m-pager',data.length,mp,ms,(p,s)=>{mp=p;ms=s;renderMaterials()})}

function save(){const fail=t=>$('form-error').textContent=t;if(!draft.wh)return fail('请选择仓库');if(!draft.items.length)return fail('请至少添加一项物料');for(const m of draft.items){if(m.safe===''||!Number.isFinite(Number(m.safe))||Number(m.safe)<0){(mode==='edit'?$('f-safe'):$('items').querySelector(`[data-safe="${m.code}"]`)).focus();return fail(m.name+'：请输入大于或等于0的安全库存')}if(mode==='new'&&records.some(r=>r.wh===draft.wh&&r.code===m.code))return fail(m.name+'已配置安全库存，请从列表编辑')}
const created=now();draft.items.forEach(m=>{if(mode==='edit'){const r=records.find(r=>r.id===m.id);r.safe=Number(m.safe);r.remark=m.remark||'';r.updated=created}else records.push({...m,id:draft.wh+'-'+m.code,wh:draft.wh,safe:Number(m.safe),created,updated:created})});page=1;list();toast('提交成功')}
$('search').onclick=()=>{q={type:$('q-type').value,group:$('q-group').value,kw:$('q-kw').value.trim(),wh:$('q-wh').value,low:$('q-low').value};page=1;selected.clear();renderList()};$('reset').onclick=()=>{['q-type','q-group','q-kw','q-wh','q-low'].forEach(id=>$(id).value='');q={};page=1;selected.clear();renderList()};$('query').onkeydown=e=>{if(e.key==='Enter')$('search').click()};
$('m-type').innerHTML='<option value="">全部</option>'+[...new Set(catalog.map(m=>m.type))].map(v=>`<option>${esc(v)}</option>`).join('');$('m-group').innerHTML='<option value="">全部</option>'+[...new Set(catalog.map(m=>m.group))].map(v=>`<option>${esc(v)}</option>`).join('');document.querySelector('.modal-query').onkeydown=e=>{if(e.key==='Enter')$('m-search').click()};
$('m-search').onclick=()=>{mq={type:$('m-type').value,group:$('m-group').value,keyword:$('m-keyword').value.trim()};mp=1;selection.clear();renderMaterials()};$('m-reset').onclick=()=>{['m-type','m-group','m-keyword'].forEach(id=>$(id).value='');mq={};selection.clear();mp=1;renderMaterials()};$('close-picker').onclick=$('m-cancel').onclick=()=>$('picker').close();$('m-confirm').onclick=()=>{catalog.filter(m=>selection.has(m.code)&&!draft.items.some(x=>x.code===m.code)).forEach(m=>draft.items.push({...m,safe:'',remark:''}));renderItems();$('form-error').textContent='';$('picker').close()};list();
</script></body></html>
