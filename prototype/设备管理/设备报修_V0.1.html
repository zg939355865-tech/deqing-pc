<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备报修</title><link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172e43;font:13px 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d9e1e8;border-radius:4px;padding:7px 15px;background:white;color:#314c63}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#087f99;color:white;border-color:#087f99}.link{border:0;padding:3px 7px;background:none;color:#087f99}.danger{color:#c44949}input,select,textarea{border:1px solid #d9e1e8;border-radius:3px;padding:5px 8px;color:#243c50;background:white;max-width:100%}input:focus,select:focus,textarea:focus{outline:1px solid #087f99}input[readonly]{background:#f3f5f7}h1{font-size:20px;margin:0}.page{height:100vh;padding:20px;display:flex;flex-direction:column;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;flex:none}.actions{display:flex;gap:8px}.card{background:white;border:1px solid #e4e9ee;border-radius:5px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;padding:20px}.filter{display:flex;align-items:center;gap:10px}.filter span{white-space:nowrap}.filter input,.filter select{width:100%;min-width:0;height:30px}.filter-actions{display:flex;justify-content:flex-end;gap:8px}.list{flex:1;min-height:0;display:flex;flex-direction:column}.scroll{overflow:auto;flex:1}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{height:46px;padding:9px 14px;text-align:left;border-bottom:1px solid #e6ebef}th{background:#f1f5f8;color:#4b6072;font-weight:500;position:sticky;top:0;z-index:2}tbody tr:hover{background:#f8fbfc}.check{position:sticky;left:0;background:white;z-index:3;width:44px}th.check{background:#f1f5f8;z-index:4}.ops{position:sticky;right:0;background:white;min-width:190px}th.ops{background:#f1f5f8;z-index:4}.tag{padding:4px 9px;border-radius:4px;background:#e7f3f6;color:#087f99}.tag.sent{background:#eef0f5;color:#62728a}.urgent{color:#b9760c;background:#fff3dc;padding:4px 8px;border-radius:4px}.pager{display:flex;gap:14px;align-items:center;justify-content:flex-end;padding:14px 20px;border-top:1px solid #e6ebef}.pager .total{margin-right:auto}.form-card{padding:24px;overflow:auto}.tabs{border-bottom:1px solid #e0e7ed;margin-bottom:20px}.tabs span{display:inline-block;padding:0 2px 12px;border-bottom:2px solid #087f99;color:#087f99}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #dde5eb;border-left:1px solid #dde5eb}.field{display:grid;grid-template-columns:110px minmax(0,1fr);min-height:40px;border-right:1px solid #dde5eb;border-bottom:1px solid #dde5eb}.field label{background:#f2f5f8;padding:10px;display:flex;align-items:center}.value{padding:6px 10px;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.value input,.value select{width:100%;height:28px}.value textarea{width:100%;min-height:60px}.wide{grid-column:1/-1}.req{color:#cc4958}.photos{display:flex;gap:10px;flex-wrap:wrap}.photos img{width:90px;height:75px;object-fit:cover;border:1px solid #dce4eb;cursor:pointer}.error{color:#c44949;font-size:12px}.modal{position:fixed;inset:0;background:#152a4066;display:grid;place-items:center;z-index:10}.dialog{width:min(960px,94vw);max-height:85vh;overflow:auto;background:white;border-radius:7px;padding:24px}.dialog h2{margin:0;font-size:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:#17364ee8;color:white;padding:14px 24px;border-radius:5px;z-index:30}[hidden]{display:none!important}@media(max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}.page{padding:12px}.filters{grid-template-columns:1fr}}
/* 2026-11-15：与菜单框架共用项目字体，覆盖原页面独立的微软雅黑设置。 */
body,button,input,select,textarea,table{font-family:var(--font-ui)}
.device-picker{display:flex;align-items:center;width:100%;gap:6px;min-width:0}.device-picker input{flex:1;min-width:0;width:0}.icon-button{width:28px;height:28px;padding:0;flex:0 0 28px;display:grid;place-items:center}.photo-upload{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:4px 0}.photo-upload .photos:empty{display:none}.photo-upload .photos>span{display:flex;flex-direction:column;align-items:center;gap:4px}.photo-upload input[type=file]{display:none}
</style></head><body><div class="page"><header class="head"><h1 id="title">设备报修</h1><div class="actions" id="actions"></div></header><section class="card filters" id="filters"></section><section class="card list" id="list"><div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section><section class="card form-card" id="form" hidden></section></div><div id="modal" hidden></div><div id="toast" class="toast" hidden></div>
<script>
// 2026-11-15：用户截图与会话为输入。设备与人员为界面演示样例；一键报修仅展示来源记录，未模拟真实接入。已派单记录锁定编辑、删除和重复派单，按确认方案实现。
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const devices=[['W01-BIO2253','潜水搅拌推流器08','YQYYC','一期厌氧池','非标'],['W01-BIO1857','污泥回流泵03','EHCHN','二号磁混凝','泵类'],['W01-BIO1901','污泥回流泵02','YHCHN','一号磁混凝','泵类'],['W01-BIO1806','PAM制备装置','CHNJYJ','磁混凝加药间','非标'],['W01-BIO1856','污泥回流泵04','EHCHN','二号磁混凝','泵类'],['W01-BIO2103','刮泥机02','YQESC','一期二沉池','非标'],['W01-BIO2433','粗格栅01','TSBF','提升泵房','非标']];
let rows=devices.slice(0,6).map((d,i)=>({id:'TB202611'+String(15-i).padStart(2,'0')+'000'+(i+1),device:i,status:i%2?'已派单':'已报修',urgency:i%3?'一般':'急',source:i%2?'人工提报':'一键报修',sourceNo:i%2?'':'SCADA：'+(124343+i),outsourced:i===3?'是':'否',reporter:['周琦','吴叶波'][i%2],time:'2026-11-'+String(15-i).padStart(2,'0')+' 09:30:00',description:['运行时出现异常振动，请现场检查。','设备运行异响，需检查轴承及连接部位。'][i%2],photos:[],handler:i%2?'柳博':'',dispatchTime:i%2?'2026-11-'+String(15-i).padStart(2,'0')+' 10:15:00':'',remark:'',creator:'周琦',created:'2026-11-'+String(15-i).padStart(2,'0')+' 09:30:00'}));
let page=1,size=5,selection=new Set(),query={},draft=null,mode='list',devicePick=null,deviceSearch='',deviceLocation='',devicePage=1;const currentUser='德清威德';
function now(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3500)}
function btn(t,fn,cls='',disabled=false){const b=document.createElement('button');b.textContent=t;b.className=cls;b.disabled=disabled;b.onclick=fn;return b}function actions(items){$('actions').replaceChildren(...items)}
const filterDefs=[['id','报修工单'],['code','设备编码'],['name','设备名称'],['status','状态',['已报修','已派单']],['reporter','报修人'],['outsourced','是否委外',['是','否']],['source','来源',['一键报修','人工提报']]];
$('filters').innerHTML=filterDefs.map(([k,n,opts])=>`<label class="filter"><span>${n}</span>${opts?`<select id="q-${k}"><option value="">全部</option>${opts.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input id="q-${k}" aria-label="${n}" placeholder="请输入">`}</label>`).join('')+'<div class="filter-actions" id="filterActions"></div>';
$('filterActions').append(btn('重置',()=>{query={};filterDefs.forEach(([k])=>$('q-'+k).value='');page=1;selection.clear();list()}),btn('查询',()=>{filterDefs.forEach(([k])=>query[k]=$('q-'+k).value.trim());page=1;selection.clear();list()},'primary'));
function filtered(){return rows.filter(r=>filterDefs.every(([k])=>{const v=k==='code'?devices[r.device][0]:k==='name'?devices[r.device][1]:r[k];return !query[k]||(['status','source','outsourced'].includes(k)?v===query[k]:String(v).includes(query[k]))})).sort((a,b)=>b.time.localeCompare(a.time))}
function list(){mode='list';$('title').textContent='设备报修';$('filters').hidden=false;$('list').hidden=false;$('form').hidden=true;actions([btn('批量删除',()=>remove([...selection]),'',!selection.size),btn('新增',()=>edit(null),'primary')]);const data=filtered();page=Math.max(1,Math.min(page,Math.ceil(data.length/size)||1));const visible=data.slice((page-1)*size,page*size);$('thead').innerHTML='<tr><th class="check"><input type="checkbox" id="all" aria-label="当前页全选"></th>'+['报修工单','状态','紧急程度','设备编码','设备名称','设备位置编码','设备位置','设备位置路径','来源','来源单号','是否委外','报修人','报修时间','操作'].map((x,i)=>`<th class="${i===13?'ops':''}">${x}</th>`).join('')+'</tr>';$('tbody').innerHTML=visible.map(r=>{const d=devices[r.device];return `<tr><td class="check"><input type="checkbox" data-check="${r.id}" ${selection.has(r.id)?'checked':''} aria-label="选择${r.id}"></td><td><button class="link" data-detail="${r.id}">${r.id}</button></td><td><span class="tag ${r.status==='已派单'?'sent':''}">${r.status}</span></td><td><span class="${r.urgency==='急'?'urgent':''}">${r.urgency}</span></td>${[d[0],d[1],d[2],d[3],d[3],r.source,r.sourceNo||'—',r.outsourced,r.reporter,r.time].map(v=>`<td>${esc(v)}</td>`).join('')}<td class="ops"><button class="link" data-dispatch="${r.id}" ${r.status==='已派单'?'disabled':''}>派单</button><button class="link" data-edit="${r.id}" ${r.status==='已派单'?'disabled':''}>编辑</button><button class="link danger" data-delete="${r.id}" ${r.status==='已派单'?'disabled':''}>删除</button></td></tr>`}).join('')||'<tr><td colspan="15" style="text-align:center;padding:50px">暂无数据</td></tr>';$('all').checked=visible.length>0&&visible.every(r=>selection.has(r.id));$('all').onchange=e=>{visible.forEach(r=>e.target.checked?selection.add(r.id):selection.delete(r.id));list()};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{el.checked?selection.add(el.dataset.check):selection.delete(el.dataset.check);list()});['detail','edit','dispatch','delete'].forEach(type=>document.querySelectorAll('[data-'+type+']').forEach(el=>el.onclick=()=>{const r=rows.find(x=>x.id===el.dataset[type]);if(type==='delete')remove([r.id]);else if(type==='detail')view(r);else if(type==='edit')edit(r);else dispatch(r)}));$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${Math.ceil(data.length/size)||1} 页</span><select id="size" aria-label="每页条数">${[5,10,20,50].map(n=>`<option ${n===size?'selected':''} value="${n}">${n}条/页</option>`).join('')}</select>`;$('pager').append(btn('上一页',()=>{page--;list()},'',page===1),btn('下一页',()=>{page++;list()},'',page*size>=data.length));$('size').onchange=e=>{size=+e.target.value;page=1;list()}}
function remove(ids){if(ids.some(id=>rows.find(r=>r.id===id)?.status==='已派单'))return toast('已派单记录已关联派工信息，无法删除。');rows=rows.filter(r=>!ids.includes(r.id));ids.forEach(id=>selection.delete(id));list()}
function field(label,content,wide=false,required=false){return `<div class="field ${wide?'wide':''}"><label>${required?'<span class="req">*</span>':''}${label}</label><div class="value">${content}</div></div>`}function input(k,v='',ro=false){return `<input id="f-${k}" value="${esc(v)}" ${ro?'readonly':''}>`}function select(k,values,v){return `<select id="f-${k}">${values.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${x||'请选择'}</option>`).join('')}</select>`}
function stage(title){$('title').textContent=title;$('filters').hidden=true;$('list').hidden=true;$('form').hidden=false}function edit(r){mode='edit';draft=r?structuredClone(r):{id:'',device:null,status:'已报修',urgency:'',source:'人工提报',sourceNo:'',outsourced:'否',reporter:currentUser,time:now(),description:'',photos:[],creator:currentUser,created:''};drawEdit()}
function drawEdit(){stage(draft.id?'编辑设备报修':'新增设备报修');actions([btn('返回列表',list),btn('提交',save,'primary')]);const d=devices[draft.device]||['','','',''];$('form').innerHTML='<div class="tabs"><span>基础信息</span></div><div class="grid">'+field('报修工单',input('id',draft.id,true))+field('设备编码',`<div class="device-picker">${input('code',d[0],true)}<button id="pick" class="icon-button" type="button" title="选择设备" aria-label="选择设备"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button></div>`,false,true)+field('设备名称',input('name',d[1],true))+field('设备位置路径',input('path',d[3],true))+field('设备位置编码',input('locationCode',d[2],true))+field('设备位置',input('location',d[3],true))+field('所属工厂',input('plant','德清水厂',true))+field('报修人',input('reporter',draft.reporter,true))+field('报修时间',input('time',draft.time,true))+field('紧急程度',select('urgency',['','特急','急','一般'],draft.urgency),false,true)+field('来源',input('source',draft.source,true))+field('来源单据',input('sourceNo',draft.sourceNo,true))+field('故障描述',`<textarea id="f-description">${esc(draft.description)}</textarea>`,true,false)+field('现场照片','<div class="photo-upload"><input type="file" id="photoInput" accept="image/*" multiple hidden><button type="button" id="uploadPhoto">上传照片</button><div class="photos" id="photos"></div></div>',true,false)+'</div><p class="error" id="error" role="alert"></p>';$('pick').onclick=()=>{stash();deviceSearch='';deviceLocation='';devicePage=1;devicePick=draft.device;pick()};$('uploadPhoto').onclick=()=>$('photoInput').click();$('photoInput').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;if(f.size>10*1024*1024){toast('单张图片不能超过10MB');continue}draft.photos.push(await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(f)}))}e.target.value='';photos()};photos()}
function stash(){draft.urgency=$('f-urgency').value;draft.description=$('f-description').value.trim()}function photos(){const p=$('photos');p.replaceChildren();draft.photos.forEach((src,i)=>{const span=document.createElement('span'),im=document.createElement('img');im.src=src;im.alt='现场照片'+(i+1);im.onclick=()=>preview(src);span.append(im,btn('移除',()=>{draft.photos.splice(i,1);photos()},'link'));p.append(span)})}function save(){stash();const errors=[];if(draft.device===null)errors.push('请选择设备');if(!draft.urgency)errors.push('请选择紧急程度');if(errors.length){$('error').textContent=errors.join('；');return}const t=now();if(!draft.id){draft.id='TB'+t.replace(/\D/g,'');draft.time=draft.time||t;draft.created=t;rows.push(draft)}else rows[rows.findIndex(r=>r.id===draft.id)]=draft;selection.clear();list();toast('提交成功')}
function modal(content){$('modal').className='modal';$('modal').hidden=false;$('modal').innerHTML='<div class="dialog" role="dialog" aria-modal="true">'+content+'</div>'}function closeModal(){$('modal').hidden=true;$('modal').replaceChildren()}function preview(src){modal('<div class="dialog-head"><h2>现场照片</h2><button id="close">关闭</button></div><img id="preview" style="max-width:100%;max-height:65vh;object-fit:contain">');$('preview').src=src;$('close').onclick=closeModal}
function pick(){const ds=devices.map((d,i)=>({d,i})).filter(({d})=>(!deviceSearch||d[0].includes(deviceSearch)||d[1].includes(deviceSearch))&&(!deviceLocation||d[3].includes(deviceLocation)));const total=Math.ceil(ds.length/5)||1;devicePage=Math.min(devicePage,total);modal('<div class="dialog-head"><h2>选择设备</h2><button id="close">关闭</button></div><div style="display:flex;gap:10px;margin-bottom:16px"><input id="deviceSearch" placeholder="设备编码／名称" value="'+esc(deviceSearch)+'" aria-label="设备编码或名称"><input id="deviceLocation" placeholder="设备位置" aria-label="设备位置" value="'+esc(deviceLocation)+'"><button id="searchDevice" class="primary">查询</button></div><table><thead><tr><th></th><th>设备编码</th><th>设备名称</th><th>设备类型</th><th>设备位置</th><th>设备位置路径</th></tr></thead><tbody>'+ds.slice((devicePage-1)*5,devicePage*5).map(({d,i})=>`<tr><td><input type="radio" name="device" value="${i}" ${devicePick===i?'checked':''}></td><td>${d[0]}</td><td>${d[1]}</td><td>${d[4]}</td><td>${d[3]}</td><td>${d[3]}</td></tr>`).join('')+'</tbody></table><div class="pager" id="devicePager">共 '+ds.length+' 条 · 第 '+devicePage+' / '+total+' 页 · 5条/页</div><div class="dialog-foot"><button id="cancel">取消</button><button id="confirmDevice" class="primary">确定</button></div>');$('devicePager').append(btn('上一页',()=>{devicePage--;pick()},'',devicePage===1),btn('下一页',()=>{devicePage++;pick()},'',devicePage===total));document.querySelectorAll('[name=device]').forEach(el=>el.onchange=()=>devicePick=+el.value);$('close').onclick=$('cancel').onclick=closeModal;$('searchDevice').onclick=()=>{deviceSearch=$('deviceSearch').value.trim();deviceLocation=$('deviceLocation').value.trim();devicePage=1;pick()};$('confirmDevice').onclick=()=>{if(devicePick===null)return toast('请选择设备');draft.device=devicePick;closeModal();drawEdit()}}
function view(r,dispatching=false){stage(dispatching?'设备报修派单':'设备报修详情');actions([btn('返回列表',list),...(dispatching?[btn('派单',()=>finishDispatch(r),'primary')]:[])]);const d=devices[r.device];const fields=[['报修工单',r.id],['状态',r.status],['紧急程度',r.urgency],['设备编码',d[0]],['设备名称',d[1]],['设备位置路径',d[3]],['设备位置编码',d[2]],['设备位置',d[3]],['所属工厂','德清水厂'],['报修人',r.reporter],['报修时间',r.time],['来源',r.source],['来源单据',r.sourceNo||'—']];$('form').innerHTML='<div class="tabs"><span>基础信息</span></div><div class="grid">'+fields.map(([k,v])=>field(k,esc(v))).join('')+field('故障描述',esc(r.description),true)+field('现场照片','<div class="photos" id="detailPhotos"></div>',true)+'</div>'+((dispatching||r.status==='已派单')?'<div class="tabs" style="margin-top:24px"><span>派单信息</span></div><div class="grid">'+field('派单时间',dispatching?now():r.dispatchTime)+field('处理人',dispatching?select('handler',['','柳博','李阳洋','吴叶波'],''):esc(r.handler),false,dispatching)+field('是否委外',dispatching?select('outsourced',['否','是'],'否'):r.outsourced)+field('备注',dispatching?'<textarea id="f-remark"></textarea>':esc(r.remark||'—'),true)+'</div>':'')+'<p id="error" class="error" role="alert"></p>';r.photos.forEach(src=>{const im=document.createElement('img');im.src=src;im.alt='现场照片';im.onclick=()=>preview(src);$('detailPhotos').append(im)});if(!r.photos.length)$('detailPhotos').textContent='暂无照片'}function dispatch(r){if(r.status==='已派单')return;view(r,true)}function finishDispatch(r){if(!$('f-handler').value){$('error').textContent='请选择处理人';return}r.handler=$('f-handler').value;r.outsourced=$('f-outsourced').value;r.remark=$('f-remark').value.trim();r.dispatchTime=now();r.status='已派单';list();toast('派单成功')}
list();
</script></body></html>
