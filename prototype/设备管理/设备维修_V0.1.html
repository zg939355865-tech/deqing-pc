<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设备维修</title><link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172e43;font:13px 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d9e1e8;border-radius:4px;padding:7px 15px;background:white;color:#314c63}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#087f99;color:white;border-color:#087f99}.link{border:0;padding:3px 7px;background:none;color:#087f99}.danger{color:#c44949}input,select,textarea{border:1px solid #d9e1e8;border-radius:3px;padding:5px 8px;color:#243c50;background:white;max-width:100%}input:focus,select:focus,textarea:focus{outline:1px solid #087f99}input[readonly]{background:#f3f5f7}h1{font-size:20px;margin:0}.page{height:100vh;padding:20px;display:flex;flex-direction:column;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;flex:none}.actions{display:flex;gap:8px}.card{background:white;border:1px solid #e4e9ee;border-radius:5px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 20px;padding:20px}.filter{display:flex;align-items:center;gap:10px}.filter span{white-space:nowrap}.filter input,.filter select{width:100%;min-width:0;height:30px}.filter-actions{display:flex;justify-content:flex-end;gap:8px}.list{flex:1;min-height:0;display:flex;flex-direction:column}.scroll{overflow:auto;flex:1}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{height:46px;padding:9px 14px;text-align:left;border-bottom:1px solid #e6ebef}th{background:#f1f5f8;color:#4b6072;font-weight:500;position:sticky;top:0;z-index:2}tbody tr:hover{background:#f8fbfc}.check{position:sticky;left:0;background:white;z-index:3;width:44px}th.check{background:#f1f5f8;z-index:4}.ops{position:sticky;right:0;background:white;min-width:190px}th.ops{background:#f1f5f8;z-index:4}.tag{padding:4px 9px;border-radius:4px;background:#e7f3f6;color:#087f99}.tag.sent{background:#eef0f5;color:#62728a}.urgent{color:#b9760c;background:#fff3dc;padding:4px 8px;border-radius:4px}.pager{display:flex;gap:14px;align-items:center;justify-content:flex-end;padding:14px 20px;border-top:1px solid #e6ebef}.pager .total{margin-right:auto}.form-card{padding:24px;overflow:auto}.tabs{border-bottom:1px solid #e0e7ed;margin-bottom:20px}.tabs span{display:inline-block;padding:0 2px 12px;border-bottom:2px solid #087f99;color:#087f99}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #dde5eb;border-left:1px solid #dde5eb}.field{display:grid;grid-template-columns:110px minmax(0,1fr);min-height:40px;border-right:1px solid #dde5eb;border-bottom:1px solid #dde5eb}.field label{background:#f2f5f8;padding:10px;display:flex;align-items:center}.value{padding:6px 10px;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.value input,.value select{width:100%;height:28px}.value textarea{width:100%;min-height:60px}.wide{grid-column:1/-1}.req{color:#cc4958}.photos{display:flex;gap:10px;flex-wrap:wrap}.photos img{width:90px;height:75px;object-fit:cover;border:1px solid #dce4eb;cursor:pointer}.error{color:#c44949;font-size:12px}.modal{position:fixed;inset:0;background:#152a4066;display:grid;place-items:center;z-index:10}.dialog{width:min(960px,94vw);max-height:85vh;overflow:auto;background:white;border-radius:7px;padding:24px}.dialog h2{margin:0;font-size:18px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:#17364ee8;color:white;padding:14px 24px;border-radius:5px;z-index:30}[hidden]{display:none!important}@media(max-width:1000px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}.page{padding:12px}.filters{grid-template-columns:1fr}}
/* 2026-11-15：与菜单框架共用项目字体，覆盖原页面独立的微软雅黑设置。 */
body,button,input,select,textarea,table{font-family:var(--font-ui)}
.device-picker{display:flex;align-items:center;width:100%;gap:6px;min-width:0}.device-picker input{flex:1;min-width:0;width:0}.icon-button{width:28px;height:28px;padding:0;flex:0 0 28px;display:grid;place-items:center}.photo-upload{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:4px 0}.photo-upload .photos:empty{display:none}.photo-upload .photos>span{display:flex;flex-direction:column;align-items:center;gap:4px}.photo-upload input[type=file]{display:none}

.head{position:sticky;top:0;z-index:5;background:#f4f6fa}.tag.done{background:#eaf5ec;color:#388349}.tag.wait{background:#fff0df;color:#a7691c}.form-card{flex:1;min-height:0}.tabs{margin-top:20px}.tabs:first-child{margin-top:0}.photos img{border-radius:4px}
</style></head><body><div class="page"><header class="head"><h1 id="title">设备维修</h1><div class="actions" id="actions"></div></header><section class="card filters" id="filters"></section><section class="card list" id="list"><div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section><section class="card form-card" id="form" hidden></section></div><div id="modal" hidden></div><div id="toast" class="toast" hidden></div><script>
// 2026-11-15：依据用户截图和确认方案。样例为虚构演示记录；维修级别和故障类型完整字典、转委外流程待确认，不执行跨模块流转。
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const devices=[['W01-BIO2430','排泥泵02','YQESC','一期二沉池'],['W01-BIO2253','潜水搅拌推流器08','YQYYC','一期厌氧池'],['W01-BIO1857','污泥回流泵03','EHCHN','二号磁混凝'],['W01-BIO1901','污泥回流泵02','YHCHN','一号磁混凝'],['W01-BIO1806','PAM制备装置','CHNJYJ','磁混凝加药间'],['W01-BIO1856','污泥回流泵04','EHCHN','二号磁混凝'],['W01-BIO2103','刮泥机02','YQESC','一期二沉池']];
const user='德清威德';
let rows=devices.map((d,i)=>({id:'WO202611'+String(15-i).padStart(2,'0')+'000'+(7-i),device:i,status:i===0?'待接单':i===1?'维修中':'已完成',urgency:['急','特急','一般'][i%3],receiver:i===0?'':'柳博',received:i===0?'':'2026-11-'+String(15-i).padStart(2,'0')+' 10:00:00',completed:i<2?'':'2026-11-'+String(15-i).padStart(2,'0')+' 14:30:00',reportId:'TB202611'+String(15-i).padStart(2,'0')+'000'+(7-i),reported:'2026-11-'+String(15-i).padStart(2,'0')+' 09:00:00',reporter:'周琦',source:i%2?'人工提报':'一键报修',sourceNo:i%2?'':'SCADA：'+(124343+i),description:'运行过程中出现异常振动，需检查设备连接与传动部位。',scene:[],level:i<2?'':'小修',fault:i<2?'':'电气故障',content:i<2?'':'检查线路及接线端子，完成紧固和运行复核。',photos:[]}));
let page=1,size=5,query={},active=null,formMode='',draft=null;
function now(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
function btn(t,fn,c='',disabled=false){const b=document.createElement('button');b.textContent=t;b.className=c;b.disabled=disabled;b.onclick=fn;return b}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3500)}
const defs=[['id','维修工单'],['code','设备编码'],['name','设备名称'],['status','状态',['待接单','维修中','已完成']],['receiver','接单人'],['reported','报修时间',null,'date'],['reportId','报修工单']];
$('filters').innerHTML=defs.map(([k,n,opts,type])=>'<label class="filter"><span>'+n+'</span>'+(k==='reported'?'<input id="q-reported" type="date" aria-label="报修开始日期"><span>至</span><input id="q-reportEnd" type="date" aria-label="报修结束日期">':opts?'<select id="q-'+k+'"><option value="">全部</option>'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select>':'<input id="q-'+k+'" type="'+(type||'text')+'" placeholder="请输入" aria-label="'+n+'">')+'</label>').join('')+'<div class="filter-actions" id="queryActions" style="grid-column:1/-1"></div>';
$('queryActions').append(btn('重置',()=>{defs.forEach(([k])=>$('q-'+k).value='');$('q-reportEnd').value='';query={};page=1;list()}),btn('查询',()=>{defs.forEach(([k])=>query[k]=$('q-'+k).value.trim());query.reportEnd=$('q-reportEnd').value;if(query.reported&&query.reportEnd&&query.reported>query.reportEnd){toast('开始日期不能晚于结束日期');return}page=1;list()},'primary'));
function filtered(){return rows.filter(r=>defs.every(([k])=>{if(k==='reported')return (!query.reported||r.reported.slice(0,10)>=query.reported)&&(!query.reportEnd||r.reported.slice(0,10)<=query.reportEnd);let v=k==='code'?devices[r.device][0]:k==='name'?devices[r.device][1]:r[k];return !query[k]||(k==='status'?v===query[k]:String(v).includes(query[k]))})).sort((a,b)=>b.reported.localeCompare(a.reported))}
function list(){active=null;$('title').textContent='设备维修';$('actions').replaceChildren();$('filters').hidden=false;$('list').hidden=false;$('form').hidden=true;const data=filtered();page=Math.max(1,Math.min(page,Math.ceil(data.length/size)||1));const visible=data.slice((page-1)*size,page*size);$('thead').innerHTML='<tr>'+['维修工单','状态','紧急程度','设备编码','设备名称','设备位置编码','设备位置','设备位置路径','接单人','接单时间','完成时间','报修工单','报修时间','操作'].map((n,i)=>'<th class="'+(i===13?'ops':'')+'">'+n+'</th>').join('')+'</tr>';$('tbody').innerHTML=visible.map(r=>{const d=devices[r.device];return '<tr><td><button class="link" data-view="'+r.id+'">'+r.id+'</button></td><td><span class="tag '+(r.status==='已完成'?'done':r.status==='待接单'?'wait':'')+'">'+r.status+'</span></td><td><span class="'+(r.urgency==='一般'?'':'urgent')+'">'+r.urgency+'</span></td>'+[d[0],d[1],d[2],d[3],d[3],r.receiver||'—',r.received||'—',r.completed||'—',r.reportId,r.reported].map(v=>'<td>'+esc(v)+'</td>').join('')+'<td class="ops"><button class="link" data-accept="'+r.id+'" '+(r.status==='待接单'?'':'disabled')+'>接单</button><button class="link" data-repair="'+r.id+'" '+(r.status==='维修中'?'':'disabled')+'>维修</button></td></tr>'}).join('')||'<tr><td colspan="14" style="text-align:center;padding:45px">暂无数据</td></tr>';['view','accept','repair'].forEach(m=>document.querySelectorAll('[data-'+m+']').forEach(b=>b.onclick=()=>open(rows.find(r=>r.id===b.dataset[m]),m)));$('pager').innerHTML='<span class="total">共 '+data.length+' 条</span><span>第 '+page+' / '+(Math.ceil(data.length/size)||1)+' 页</span><select id="size" aria-label="每页条数">'+[5,10,20,50].map(n=>'<option '+(n===size?'selected':'')+'>'+n+'</option>').join('')+'</select><span>条/页</span>';$('pager').append(btn('上一页',()=>{page--;list()},'',page===1),btn('下一页',()=>{page++;list()},'',page*size>=data.length));$('size').onchange=e=>{size=+e.target.value;page=1;list()}}
function field(n,v,wide=false,required=false){return '<div class="field '+(wide?'wide':'')+'"><label>'+(required?'<span class="req">*</span>':'')+n+'</label><div class="value">'+v+'</div></div>'}
function fields(items){return items.map(([n,v])=>field(n,esc(v||'—'))).join('')}
function select(k,v){const opts=k==='level'?['大修','中修','小修']:['电气故障','机械故障'];return '<select id="f-'+k+'"><option value="">请选择</option>'+opts.map(x=>'<option '+(x===v?'selected':'')+'>'+x+'</option>').join('')+'</select>'}
function open(r,m){if(m==='accept'&&r.status!=='待接单'||m==='repair'&&r.status!=='维修中')return;active=r;formMode=m;draft=structuredClone(r);$('filters').hidden=true;$('list').hidden=true;$('form').hidden=false;$('title').textContent=m==='accept'?'设备维修接单':m==='repair'?'维修信息填写':'设备维修详情';$('actions').replaceChildren(btn('返回列表',list));if(m==='accept')$('actions').append(btn('接单',accept,'primary'));if(m==='repair')$('actions').append(btn('提交',complete,'primary'));const d=devices[r.device];$('form').innerHTML='<div class="tabs"><span>报修信息</span></div><div class="grid">'+fields([['报修工单',r.reportId],['报修状态','已派单'],['紧急程度',r.urgency],['设备编码',d[0]],['设备名称',d[1]],['设备位置路径',d[3]],['设备位置编码',d[2]],['设备位置',d[3]],['所属工厂','德清水厂'],['报修人',r.reporter],['报修时间',r.reported],['来源',r.source],['来源单据',r.sourceNo]])+field('故障描述',m==='repair'?'<textarea id="f-description">'+esc(r.description)+'</textarea>':esc(r.description||'—'),true,m==='repair')+field('现场照片',m==='repair'?'<div class="photo-upload"><input id="sceneUpload" type="file" accept="image/*" multiple hidden><button id="sceneUploadBtn">上传照片</button><div class="photos" id="scene"></div></div>':'<div class="photos" id="scene"></div>',true,m==='repair')+'</div><div class="tabs"><span>维修信息</span></div><div class="grid">'+fields([['维修工单',r.id],['状态',r.status]])+field('维修级别',m==='repair'?select('level',r.level):esc(r.level||'—'),false,m==='repair')+field('故障类型',m==='repair'?select('fault',r.fault):esc(r.fault||'—'),false,m==='repair')+field('接单人',esc(r.receiver||'—'))+fields([['接单时间',r.received],['完成时间',m==='repair'?now():r.completed]])+field('维修内容',m==='repair'?'<textarea id="f-content">'+esc(r.content)+'</textarea>':esc(r.content||'—'),true,m==='repair')+field('维修照片',m==='repair'?'<div class="photo-upload"><input id="upload" type="file" accept="image/*" multiple hidden><button id="uploadBtn">上传照片</button><div class="photos" id="repairPhotos"></div></div>':'<div class="photos" id="repairPhotos"></div>',true,m==='repair')+'</div><p class="error" id="error" role="alert"></p>';paintPhotos('scene',draft.scene,m==='repair');paintPhotos('repairPhotos',draft.photos,m==='repair');if(m==='repair'){$('sceneUploadBtn').onclick=()=>$('sceneUpload').click();$('sceneUpload').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;if(f.size>10*1024*1024){toast('单张图片不能超过10MB');continue}draft.scene.push(await new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.readAsDataURL(f)}))}e.target.value='';paintPhotos('scene',draft.scene,true)};$('uploadBtn').onclick=()=>$('upload').click();$('upload').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;if(f.size>10*1024*1024){toast('单张图片不能超过10MB');continue}draft.photos.push(await new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.readAsDataURL(f)}))}e.target.value='';paintPhotos('repairPhotos',draft.photos,true)}}}
function paintPhotos(id,photos,editable){const root=$(id);root.replaceChildren();if(!photos.length&&!editable){root.textContent='暂无照片';return}photos.forEach((src,i)=>{const span=document.createElement('span'),img=document.createElement('img');img.src=src;img.alt='照片'+(i+1);img.onclick=()=>preview(src);span.append(img);if(editable)span.append(btn('移除',()=>{photos.splice(i,1);paintPhotos(id,photos,true)},'link'));root.append(span)})}
function preview(src){$('modal').className='modal';$('modal').hidden=false;$('modal').innerHTML='<div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2>照片预览</h2><button id="closePhoto">关闭</button></div><img id="fullPhoto" style="max-width:100%;max-height:65vh"></div>';$('fullPhoto').src=src;$('closePhoto').onclick=()=>{$('modal').hidden=true;$('modal').replaceChildren()}}
function accept(){if(!active||active.status!=='待接单')return;active.receiver=user;active.received=now();active.status='维修中';list();toast('接单成功')}
function complete(){const level=$('f-level').value.trim(),fault=$('f-fault').value.trim(),content=$('f-content').value.trim();const description=$('f-description').value.trim();const errors=[];if(!description)errors.push('请填写故障描述');if(!draft.scene.length)errors.push('请上传现场照片');if(!level)errors.push('请填写维修级别');if(!fault)errors.push('请填写故障类型');if(!content)errors.push('请填写维修内容');if(!draft.photos.length)errors.push('请上传维修照片');if(errors.length){$('error').textContent=errors.join('；');return}if(!active||active.status!=='维修中')return;Object.assign(active,{description,scene:draft.scene,level,fault,content,photos:draft.photos,completed:now(),status:'已完成'});list();toast('维修提交成功')}
list();
</script></body></html>
