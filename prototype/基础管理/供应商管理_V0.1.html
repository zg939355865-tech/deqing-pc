    ];
    let query={code:'',name:'',level:'',category:'',status:''},page=1,size=5,selected=new Set(),draft=null;
    function now(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
    function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
    function button(text,fn,cls='',disabled=false){const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=text;b.disabled=disabled;b.onclick=fn;return b}
    function filtered(){return rows.filter(r=>(!query.code||r.id.toLowerCase().includes(query.code.toLowerCase()))&&(!query.name||r.name.includes(query.name))&&(!query.level||r.level===query.level)&&(!query.category||categoryValues(r.category).includes(query.category))&&(!query.status||r.status===query.status)).sort((a,b)=>b.created.localeCompare(a.created))}
    function setActions(items){$('actions').replaceChildren(...items)}
    function showList(){draft=null;$('title').textContent='供应商管理';$('query').hidden=false;$('list').hidden=false;$('form').hidden=true;renderList()}
    function renderList(){const data=filtered(),pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);const visible=data.slice((page-1)*size,page*size);setActions([button('导入',()=>{}),button('导出',()=>{}),button('批量删除',()=>remove([...selected]),'danger',!selected.size),button('新增',()=>edit(null),'primary')]);$('thead').innerHTML='<tr><th class="check"><input type="checkbox" id="all" aria-label="当前页全选"></th><th>供应商编码</th><th>供应商名称</th><th>供应商简介</th><th>供应商等级</th><th>供应商分类</th><th>状态</th><th>操作</th></tr>';$('tbody').innerHTML=visible.map(r=>`<tr><td class="check"><input type="checkbox" data-check="${esc(r.id)}" ${selected.has(r.id)?'checked':''} aria-label="选择${esc(r.name)}"></td><td><button class="link" data-view="${esc(r.id)}">${esc(r.id)}</button></td><td>${esc(r.name)}</td><td title="${esc(r.intro)}">${esc(r.intro)||'—'}</td><td>${esc(r.level)||'—'}</td><td>${esc(categoryText(r.category))}</td><td><span class="status ${r.status==='停用'?'off':''}">${r.status}</span></td><td><div class="row-ops"><button class="link" data-edit="${esc(r.id)}">编辑</button><button class="link" data-delete="${esc(r.id)}">删除</button></div></td></tr>`).join('')||'<tr><td colspan="8" style="height:160px;text-align:center;color:var(--gray)">暂无数据</td></tr>';$('all').checked=visible.length>0&&visible.every(r=>selected.has(r.id));$('all').onchange=e=>{visible.forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));renderList()};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{el.checked?selected.add(el.dataset.check):selected.delete(el.dataset.check);renderList()});document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>view(rows.find(r=>r.id===el.dataset.view)));document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>edit(rows.find(r=>r.id===el.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>remove([el.dataset.delete]));$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="pageSize" aria-label="每页条数">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(button('上一页',()=>{page--;renderList()},'',page===1),button('下一页',()=>{page++;renderList()},'',page===pages));$('pageSize').onchange=e=>{size=+e.target.value;page=1;renderList()}}

    document.addEventListener('click',event=>{const picker=$('f-category');if(picker&&!picker.contains(event.target))picker.open=false});

    function edit(row){draft=row?{...structuredClone(row),originalId:row.id}:{id:'',name:'',intro:'',level:'',category:'',creditCode:'',address:'',contact:'',phone:'',email:'',currency:'人民币',creditDays:'30',payment:'',invoiceType:'',status:'启用',factory:currentFactory,creator:currentUser,created:'',remark:'',originalId:null};stage(row?'编辑供应商':'新增供应商',[button('返回列表',showList),button('保存',save,'primary')]);$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${field('供应商编码',input('id',draft.id),{required:true})}${field('供应商名称',input('name',draft.name),{required:true})}${field('供应商分类',categoryPicker(draft.category),{required:true})}${field('供应商等级',select('level',levels,draft.level,true))}${field('供应商简介',input('intro',draft.intro))}${field('统一社会信用代码',input('creditCode',draft.creditCode))}${field('供应商地址',input('address',draft.address))}${field('联系人',input('contact',draft.contact))}${field('联系人电话',input('phone',draft.phone))}${field('联系人邮箱',input('email',draft.email))}${field('结算币别',select('currency',currencies,draft.currency,true))}${field('账期(天)',select('creditDays',creditDays,draft.creditDays,true))}${field('付款方式',select('payment',payments,draft.payment,true))}${field('发票类型',select('invoiceType',invoices,draft.invoiceType,true))}${field('状态',select('status',['启用','停用'],draft.status))}${field('所属企业',input('factory',draft.factory,true))}${field('创建人',input('creator',draft.creator,true))}${field('创建时间',input('created',draft.created,true))}${field('备注',`<textarea class="control" id="f-remark">${esc(draft.remark)}</textarea>`,{wide:true})}</div><p class="error" id="error" role="alert"></p>`}
    function save(){const get=k=>$('f-'+k).value.trim();const data={id:get('id'),name:get('name'),intro:get('intro'),level:get('level'),category:[...document.querySelectorAll('#f-category input:checked')].map(el=>el.value),creditCode:get('creditCode'),address:get('address'),contact:get('contact'),phone:get('phone'),email:get('email'),currency:get('currency'),creditDays:get('creditDays'),payment:get('payment'),invoiceType:get('invoiceType'),status:$('f-status').value,remark:get('remark')};if(!data.id||!data.name){$('error').textContent='请填写供应商编码和供应商名称。';return}if(!data.category.length){$('error').textContent='请选择供应商分类。';return}if(rows.some(r=>r.id===data.id&&r.id!==draft.originalId)){$('error').textContent='供应商编码已存在。';return}const saved={...draft,...data,created:draft.created||now()};const index=rows.findIndex(r=>r.id===draft.originalId);if(index>=0)rows[index]=saved;else rows.push(saved);selected.clear();showList();toast('保存成功')}
    function view(row){stage('供应商详情',[button('返回列表',showList)]);const fields=[['供应商编码',row.id],['供应商名称',row.name],['供应商分类',categoryText(row.category)],['供应商等级',row.level||'—'],['供应商简介',row.intro||'—'],['统一社会信用代码',row.creditCode||'—'],['供应商地址',row.address||'—'],['联系人',row.contact||'—'],['联系人电话',row.phone||'—'],['联系人邮箱',row.email||'—'],['结算币别',row.currency||'—'],['账期(天)',row.creditDays||'—'],['付款方式',row.payment||'—'],['发票类型',row.invoiceType||'—'],['状态',row.status],['所属企业',row.factory||'—'],['创建人',row.creator],['创建时间',row.created],['备注',row.remark||'—',true]];$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${fields.map(([label,value,wide])=>field(esc(label),esc(value),{wide})).join('')}</div>`}
    $('search').onclick=()=>{query={code:$('q-code').value.trim(),name:$('q-name').value.trim(),level:$('q-level').value,category:$('q-category').value,status:$('q-status').value};page=1;selected.clear();renderList()};$('reset').onclick=()=>{document.querySelectorAll('#query input,#query select').forEach(x=>x.value='');query={code:'',name:'',level:'',category:'',status:''};page=1;selected.clear();renderList()};showList();
  </script>
