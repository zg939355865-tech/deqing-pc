<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>库位</title>
<link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg-page);color:var(--ink);font:13px var(--font-ui)}button,input,select,textarea{font:inherit}button{cursor:pointer}.page{height:100%;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.head{display:flex;align-items:center;justify-content:space-between;flex:none}.head h1{margin:0;font-size:20px}.actions,.ops{display:flex;gap:10px}.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger,.del{color:var(--err)}.btn:disabled{opacity:.48;cursor:not-allowed}.panel{background:#fff;border:1px solid var(--line-soft);border-radius:6px}.query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:20px 24px;flex:none}.query label{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:10px;white-space:nowrap;color:var(--gray)}.query-ops{display:flex;justify-content:flex-end;gap:8px}.control{width:100%;height:32px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:3px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:0;box-shadow:none;border-color:var(--teal)}.list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{height:44px;padding:8px 14px;border-bottom:1px solid var(--line-soft);text-align:left}th{position:sticky;top:0;z-index:2;background:var(--bg-soft);color:var(--gray)}tbody tr:hover{background:#f8fbfc}.check{position:sticky;left:0;z-index:3;width:44px;min-width:44px;text-align:center;background:#fff}th.check{z-index:4;background:var(--bg-soft)}.tag{display:inline-block;padding:3px 8px;border:1px solid var(--line-soft);border-radius:3px}.on{border-color:#c8efd8;background:#f0fff5;color:#18a65b}.off{background:var(--bg-soft);color:var(--gray)}.link{padding:3px 0;border:0;background:none;color:var(--teal)}.ops{gap:12px}.pager{display:flex;align-items:center;gap:12px;padding-top:16px}.total{margin-right:auto;color:var(--gray)}.pager select{width:100px}.form{min-height:0;overflow:auto;padding:24px}.tabs{margin-bottom:20px;border-bottom:1px solid var(--line-soft)}.tab{display:inline-block;padding:10px 16px;color:var(--teal);border-bottom:2px solid var(--teal)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-right:0;border-bottom:0}.field{display:grid;grid-template-columns:110px minmax(0,1fr);min-height:40px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.field label{display:flex;align-items:center;padding:6px 10px;background:var(--bg-soft);color:var(--gray)}.value{display:flex;align-items:center;min-width:0;padding:6px 10px;background:#fff}.field .control{height:28px}.field textarea.control{height:auto;min-height:52px;resize:vertical}.wide{grid-column:1/-1}.req{color:var(--err);margin-right:3px}.readonly{background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}.readonly:hover,.readonly:focus{border:0;outline:none;box-shadow:none}.switch{position:relative;width:42px;height:24px;padding:0;border:0;border-radius:12px;background:#aebdca}.switch:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff}.switch.on{background:var(--teal)}.switch.on:after{left:20px}.error{min-height:20px;margin:12px 0 0;color:var(--err)}.toast{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 22px;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:var(--sh-pop)}[hidden]{display:none!important}@media(max-width:1000px){.query,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.query-ops{grid-column:1/-1}}@media(max-width:640px){.page{padding:12px}.query,.grid{grid-template-columns:1fr}.query-ops{justify-content:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}}
</style><!-- 2026-11-25：只读默认值统一优化为无背景、无输入框边框；保留外层字段网格和可编辑控件样式。 --><style>/* 2026-11-25：备注按字段顺序填满创建时间后的本行剩余列。 */
.grid>.remark-tail{grid-column:span 3}.grid>.remark-tail:nth-child(3n+2){grid-column:span 2}.grid>.remark-tail:nth-child(3n){grid-column:span 1}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid>.remark-tail{grid-column:span 2}.grid>.remark-tail:nth-child(2n){grid-column:span 1}}@media(max-width:640px){.grid{grid-template-columns:1fr}.grid>.remark-tail,.grid>.remark-tail:nth-child(2n){grid-column:1/-1}}
</style><!-- 2026-11-25：备注使用单行输入框，高度28px，与普通字段一致。 --></head><body><main class="page" data-scene="water-operations"><header class="head"><h1 id="title">库位</h1><div class="actions" id="actions"></div></header>
<section class="panel query" id="query"><label>库位编码<input class="control" id="qc" placeholder="请输入"></label><label>库位<input class="control" id="qn" placeholder="请输入"></label><label>仓库编码<input class="control" id="qwc" placeholder="请输入"></label><label>仓库<input class="control" id="qw" placeholder="请输入"></label><label>状态<select class="control" id="qs"><option value="">全部</option><option>启用</option><option>停用</option></select></label><div class="query-ops"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section>
<section class="panel list" id="list"><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section><section class="panel form" id="form" hidden></section></main><div class="toast" id="toast" hidden></div>
<script>'use strict';
// 2026-11-18：字段和示例数据来自用户截图；仅作原型演示，非已核实主数据。
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[['JXKW','机修库位','JXCK','机修仓库','是'],['HYKW','化验库位','HYCK','化验仓库','是'],['WJKW','五金库位','WJCK','五金仓库','是'],['FPKW','废品库位','FPCK','废品仓库','是'],['TNJKW','脱泥间库位','YJCK','药剂仓库','否'],['XDJKW','消毒间库位','YJCK','药剂仓库','否'],['JYJ','加药间库位','YJCK','药剂仓库','是'],['HWO05','废品库','C001','生产仓库','否']].map((x,i)=>({id:x[0],name:x[1],warehouseCode:x[2],warehouse:x[3],default:x[4],status:'启用',factory:'德清水厂',creator:'德清威德',created:`2026-11-${String(18-i).padStart(2,'0')} 09:30:00`,remark:''}));
let q={code:'',name:'',wc:'',w:'',s:''},page=1,size=5,chosen=new Set(),draft;const user='德清威德',wh={JXCK:'机修仓库',HYCK:'化验仓库',WJCK:'五金仓库',FPCK:'废品仓库',YJCK:'药剂仓库',C001:'生产仓库'};
const now=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'medium'}).format(new Date()).replace('T',' ');
function btn(t,f,c='',d=false){const b=document.createElement('button');b.className='btn '+c;b.textContent=t;b.disabled=d;b.onclick=f;return b}function tip(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3500)}function data(){return rows.filter(r=>(!q.code||r.id.includes(q.code))&&(!q.name||r.name.includes(q.name))&&(!q.wc||r.warehouseCode.includes(q.wc))&&(!q.w||r.warehouse.includes(q.w))&&(!q.s||r.status===q.s)).sort((a,b)=>b.created.localeCompare(a.created))}
function list(){draft=null;$('title').textContent='库位';$('query').hidden=false;$('list').hidden=false;$('form').hidden=true;draw()}function draw(){const d=data(),pages=Math.max(1,Math.ceil(d.length/size));page=Math.min(page,pages);const v=d.slice((page-1)*size,page*size);$('actions').replaceChildren(btn('批量删除',()=>del([...chosen]),'danger',!chosen.size),btn('新增',()=>edit(),'primary'));$('thead').innerHTML='<tr><th class="check"><input id="all" type="checkbox" aria-label="当前页全选"></th><th>库位编码</th><th>库位</th><th>仓库编码</th><th>仓库</th><th>默认库位</th><th>状态</th><th>操作</th></tr>';$('tbody').innerHTML=v.map(r=>`<tr><td class="check"><input type="checkbox" data-check="${esc(r.id)}" ${chosen.has(r.id)?'checked':''}></td><td><button class="link" data-view="${esc(r.id)}">${esc(r.id)}</button></td><td>${esc(r.name)}</td><td>${esc(r.warehouseCode)}</td><td>${esc(r.warehouse)}</td><td><span class="tag">${r.default}</span></td><td><span class="tag ${r.status==='启用'?'on':'off'}">${r.status}</span></td><td><div class="ops"><button class="link" data-edit="${esc(r.id)}">编辑</button><button class="link del" data-del="${esc(r.id)}">删除</button></div></td></tr>`).join('')||'<tr><td colspan="8" style="height:160px;text-align:center;color:var(--gray)">暂无数据</td></tr>';$('all').checked=v.length>0&&v.every(r=>chosen.has(r.id));$('all').onchange=e=>{v.forEach(r=>e.target.checked?chosen.add(r.id):chosen.delete(r.id));draw()};document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{e.checked?chosen.add(e.dataset.check):chosen.delete(e.dataset.check);draw()});document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>view(rows.find(r=>r.id===e.dataset.view)));document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>edit(rows.find(r=>r.id===e.dataset.edit)));document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>del([e.dataset.del]));$('pager').innerHTML=`<span class="total">共 ${d.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="ps">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(btn('上一页',()=>{page--;draw()},'',page===1),btn('下一页',()=>{page++;draw()},'',page===pages));$('ps').onchange=e=>{size=+e.target.value;page=1;draw()}}function del(ids){rows=rows.filter(r=>!ids.includes(r.id));ids.forEach(id=>chosen.delete(id));draw()}
const field=(l,v,o={})=>`<div class="field ${l==='备注'?'remark-tail':o.wide?'wide':''}"><label>${o.req?'<span class="req">*</span>':''}${l}</label><div class="value">${v}</div></div>`,input=(k,v='',ro=false)=>`<input class="control ${ro?'readonly':''}" id="f-${k}" value="${esc(v)}" ${ro?'readonly':''}>`,sel=(k,a,v)=>`<select class="control" id="f-${k}">${a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
function edit(row){draft=row?{...structuredClone(row),original:row.id}:{id:'',name:'',warehouseCode:'',warehouse:'',default:'是',status:'启用',factory:'德清水厂',creator:user,created:'',remark:'',original:null};$('title').textContent=row?'编辑库位':'新增库位';$('query').hidden=true;$('list').hidden=true;$('form').hidden=false;$('actions').replaceChildren(btn('返回列表',list),btn('保存',save,'primary'));$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${field('库位编码',input('id',draft.id),{req:true})}${field('库位',input('name',draft.name),{req:true})}${field('仓库编码',sel('wc',['',...Object.keys(wh)],draft.warehouseCode),{req:true})}${field('仓库',input('w',draft.warehouse,true))}${field('状态','<button class="switch '+(draft.status==='启用'?'on':'')+'" id="sw" type="button"></button>')}${field('默认库位',sel('default',['是','否'],draft.default))}${field('所属工厂',input('factory',draft.factory,true))}${field('创建人',input('creator',draft.creator,true))}${field('创建时间',input('created',draft.created,true))}${field('备注',`<input class="control" id="f-remark" value="${esc(draft.remark)}" placeholder="请输入">`,{wide:true})}</div><p class="error" id="error"></p>`;$('sw').onclick=()=>{draft.status=draft.status==='启用'?'停用':'启用';edit(draft)};$('f-wc').onchange=e=>$('f-w').value=wh[e.target.value]||''}
function save(){const id=$('f-id').value.trim(),name=$('f-name').value.trim(),warehouseCode=$('f-wc').value,exists=rows.find(r=>r.id===id);if(!id||!name||!warehouseCode){$('error').textContent='请填写库位编码、库位和仓库编码。';return}if(exists&&id!==draft.original){$('error').textContent='库位编码已存在。';return}Object.assign(draft,{id,name,warehouseCode,warehouse:$('f-w').value,default:$('f-default').value,remark:$('f-remark').value.trim(),created:draft.created||now()});const i=rows.findIndex(r=>r.id===draft.original);i<0?rows.push(draft):rows[i]=draft;chosen.clear();list();tip('保存成功')}
function view(r){$('title').textContent='库位详情';$('query').hidden=true;$('list').hidden=true;$('form').hidden=false;$('actions').replaceChildren(btn('返回列表',list));const fs=[['库位编码',r.id],['库位',r.name],['仓库编码',r.warehouseCode],['仓库',r.warehouse],['状态',r.status],['默认库位',r.default],['所属工厂',r.factory],['创建人',r.creator],['创建时间',r.created],['备注',r.remark||'—',true]];$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${fs.map(([l,v,w])=>field(l,esc(v),{wide:w})).join('')}</div>`}
$('search').onclick=()=>{q={code:$('qc').value.trim(),name:$('qn').value.trim(),wc:$('qwc').value.trim(),w:$('qw').value.trim(),s:$('qs').value};page=1;chosen.clear();draw()};$('reset').onclick=()=>{document.querySelectorAll('#query input,#query select').forEach(x=>x.value='');q={code:'',name:'',wc:'',w:'',s:''};page=1;chosen.clear();draw()};list();
</script><script>/* 导入、导出仅作界面展示，不接入功能；仅在列表页显示，新增/编辑/详情页不显示。 */(()=>{const labels=['导入','导出'],sync=()=>{const root=document.getElementById('actions'),form=document.getElementById('form');if(!root||(form&&!form.hidden))return;labels.forEach(label=>{let b=[...root.children].find(x=>x.textContent===label);if(b){if(!b.dataset.staticAction){const copy=b.cloneNode(true);copy.dataset.staticAction='true';b.replaceWith(copy)}}else{b=document.createElement('button');b.className='btn';b.textContent=label;b.dataset.staticAction='true';root.insertBefore(b,[...root.children].find(x=>x.textContent==='批量删除')||null)}})};sync();new MutationObserver(sync).observe(document.getElementById('actions'),{childList:true})})();</script></body></html>
