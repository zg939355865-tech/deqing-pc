</style><!-- 2026-11-25：备注使用单行输入框，高度28px，与普通字段一致。 --></head><body><!-- 2026-11-23：按用户要求出库方式选项统一为倒冲领料、生产领料。 --><main class="page" data-scene="water-operations"><header class="head"><h1 id="title">物料主数据</h1><div class="actions" id="actions"></div></header><section class="panel query" id="query"></section><section class="panel list" id="list"><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section><section class="panel form" id="form" hidden></section></main><div class="toast" id="toast" hidden></div><script>

function now(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3500)}function button(t,fn,cls='',disabled=false){const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=t;b.disabled=disabled;b.onclick=fn;return b}function setActions(items){$('actions').replaceChildren(...items)}
function drawQuery(){$('query').innerHTML=fields.map(([key,label])=>`<label>${label}${key==='status'?`<select class="control" id="q-${key}"><option value="">全部</option><option>启用</option><option>停用</option></select>`:key==='group'?`<select class="control" id="q-${key}"><option value="">全部</option>${[...new Set(rows.map(r=>r.group))].map(group=>`<option value="${esc(group)}">${esc(group)}</option>`).join('')}</select>`:key==='type'?`<select class="control" id="q-${key}"><option value="">全部</option><option>药剂</option><option>工具</option><option>化验室</option><option>备品备件</option><option>劳保用品</option></select>`:`<input class="control" id="q-${key}" placeholder="请输入">`}</label>`).join('')+'<div class="query-actions"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div>';$('search').onclick=()=>{query=Object.fromEntries(fields.map(([k])=>[k,$('q-'+k).value.trim()]));page=1;selected.clear();renderList()};$('reset').onclick=()=>{query={};fields.forEach(([k])=>$('q-'+k).value='');page=1;selected.clear();renderList()}}
function filtered(){return rows.filter(r=>fields.every(([k])=>!query[k]||(k==='keyword'?[r.id,r.name].some(v=>String(v).toLowerCase().includes(query[k].toLowerCase())):r[k]===query[k]))).sort((a,b)=>b.created.localeCompare(a.created))}
function showList(){draft=null;activeTab='仓库';$('title').textContent='物料主数据';$('query').hidden=false;$('list').hidden=false;$('form').hidden=true;drawQuery();renderList()}
function renderList(){const data=filtered(),pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);const shown=data.slice((page-1)*size,page*size);setActions([button('批量删除',()=>remove([...selected]),'danger',!selected.size),button('新增',()=>edit(null),'primary')]);$('thead').innerHTML='<tr><th class="check"><input id="all" type="checkbox" aria-label="当前页全选"></th><th>物料编码</th><th>物料名称</th><th>规格</th><th>基础单位</th><th>物料类型</th><th>物料分组</th><th>状态</th><th>操作</th></tr>';$('tbody').innerHTML=shown.map(r=>`<tr><td class="check"><input type="checkbox" data-check="${esc(r.id)}" ${selected.has(r.id)?'checked':''} aria-label="选择${esc(r.name)}"></td><td><button class="link" data-view="${esc(r.id)}">${esc(r.id)}</button></td><td>${esc(r.name)}</td><td>${esc(r.spec)||'—'}</td><td>${esc(r.unit)}</td><td>${esc(r.type)}</td><td>${esc(r.group)}</td><td><span class="tag ${r.status==='停用'?'off':''}">${r.status}</span></td><td><div class="row-ops"><button class="link" data-edit="${esc(r.id)}">编辑</button><button class="link" data-delete="${esc(r.id)}">删除</button></div></td></tr>`).join('')||'<tr><td colspan="9" style="height:160px;text-align:center;color:var(--gray)">暂无数据</td></tr>';$('all').checked=shown.length>0&&shown.every(r=>selected.has(r.id));$('all').onchange=e=>{shown.forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));renderList()};document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{e.checked?selected.add(e.dataset.check):selected.delete(e.dataset.check);renderList()});document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>view(rows.find(r=>r.id===e.dataset.view)));document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>edit(rows.find(r=>r.id===e.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>remove([e.dataset.delete]));$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="pageSize" aria-label="每页条数">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(button('上一页',()=>{page--;renderList()},'',page===1),button('下一页',()=>{page++;renderList()},'',page===pages));$('pageSize').onchange=e=>{size=+e.target.value;page=1;renderList()}}
function remove(ids){rows=rows.filter(r=>!ids.includes(r.id));ids.forEach(id=>selected.delete(id));renderList()}function field(label,body,o={}){return `<div class="field ${label==='备注'?'remark-tail':o.wide?'wide':''}"><label>${o.required?'<span class="required">*</span>':''}${label}</label><div class="value">${body}</div></div>`}function input(key,value='',ro=false){return `<input class="control ${ro?'readonly':''}" id="f-${key}" value="${esc(value)}" ${ro?'readonly':''}>`}function select(key,options,value){return `<select class="control" id="f-${key}">${options.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select>`}

function edit(row){draft=row?{...structuredClone(row),originalId:row.id}:{id:'',name:'',spec:'',unit:'kg',type:'药剂',groupCode:'YJXL',group:'药剂系列',status:'启用',remark:'',creator:currentUser,created:'',originalId:null};activeTab='仓库';stage(row?'编辑物料主数据':'新增物料主数据',[button('返回列表',showList),button('保存',save,'primary')]);drawForm(false)}
function drawForm(readOnly){const r=draft;const f=(key,label,opts={},values)=>field(label,readOnly?esc(r[key]||'—'):(values?select(key,values,r[key]):input(key,r[key],opts.readonly)),opts);$('form').innerHTML=`<h2 class="section-title">基础信息</h2><div class="grid">${f('id','物料编码',{required:true})}${f('name','物料名称',{required:true})}${f('type','物料类型',{},['药剂','工具','化验室','备品备件','劳保用品'])}${f('groupCode','分组编码',{},['YJXL','GJXL','HYSQM'])}${f('group','物料分组',{readonly:true})}${f('unit','基础单位',{},['kg','公斤','辆','个'])}${f('spec','规格')}${readOnly?field('状态',esc(r.status)):field('状态',`<button id="statusSwitch" class="switch ${r.status==='启用'?'on':''}" type="button" aria-label="切换状态"></button>`)}${f('creator','创建人',{readonly:true})}${f('created','创建时间',{readonly:true})}${f('remark','备注',{follow:true})}</div><section class="factory"><h2 class="section-title">工厂配置</h2><div class="factory-layout"><aside class="factory-list"><strong>工厂</strong><div class="factory-option">● 德清水厂</div></aside><div class="config"><div class="tabs">${['仓库','生产','财务'].map(t=>`<button class="tab ${activeTab===t?'active':''}" type="button" data-tab="${t}">${t}</button>`).join('')}</div><div class="config-grid" id="configGrid"></div></div></div></section><p class="error" id="error" role="alert"></p>`;if(!readOnly)$('statusSwitch').onclick=()=>{r.status=r.status==='启用'?'停用':'启用';drawForm(false)};document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{activeTab=e.dataset.tab;drawForm(readOnly)});drawConfig(readOnly)}

function drawConfig(readOnly){const configs={仓库:[['批次策略','否',['否','是']],['出库策略','FIFO',['FIFO','LIFO']],['来料检测','否',['否','是']],['ABC分类','', ['','A类','B类','C类']],['包装方式','', ['','袋装','桶装','散装']],['最小包装量','',null]],生产:[['出库方式','倒冲领料',['倒冲领料','生产领料']],['以旧换新','否',['否','是']]],财务:[['移动加权平均价','',null],['价格更新时间','',null],['最近入库价','',null],['最近入库时间','',null]]},financial=activeTab==='财务';$('configGrid').innerHTML=configs[activeTab].map(([label,value,options])=>`<label class="config-field"><span>${esc(label)}</span>${readOnly||financial?`<span class="control readonly">${value||'—'}</span>`:options?`<select class="control"><option>${value||'请选择'}</option>${options.filter(x=>x&&x!==value).map(x=>`<option>${x}</option>`).join('')}</select>`:`<input class="control" placeholder="请输入">`}</label>`).join('')}
function save(){const id=$('f-id').value.trim(),name=$('f-name').value.trim(),existing=rows.find(r=>r.id===id);if(!id||!name){$('error').textContent='请填写物料编码和物料名称。';return}if(existing&&existing.id!==draft.originalId){$('error').textContent='物料编码已存在。';return}draft={...draft,id,name,spec:$('f-spec').value.trim(),unit:$('f-unit').value,type:$('f-type').value,groupCode:$('f-groupCode').value,group:$('f-group').value,remark:$('f-remark').value.trim(),created:draft.created||now()};const i=rows.findIndex(r=>r.id===draft.originalId);if(i>=0)rows[i]=draft;else rows.push(draft);selected.clear();showList();toast('保存成功')}

</script><script>/* 导入、导出仅作界面展示，不接入功能；仅在列表页显示，新增/编辑/详情页不显示。 */(()=>{const labels=['导入','导出'],sync=()=>{const root=document.getElementById('actions'),form=document.getElementById('form');if(!root||(form&&!form.hidden))return;labels.forEach(label=>{let b=[...root.children].find(x=>x.textContent===label);if(b){if(!b.dataset.staticAction){const copy=b.cloneNode(true);copy.dataset.staticAction='true';b.replaceWith(copy)}}else{b=document.createElement('button');b.className='btn';b.textContent=label;b.dataset.staticAction='true';root.insertBefore(b,[...root.children].find(x=>x.textContent==='批量删除')||null)}})};sync();new MutationObserver(sync).observe(document.getElementById('actions'),{childList:true})})();</script></body></html>
