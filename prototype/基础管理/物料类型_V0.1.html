<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>物料类型</title>
  <link rel="stylesheet" href="../../assets/components/tokens.css">
  <link rel="stylesheet" href="../../assets/components/components.css">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg-page);color:var(--ink);font:13px var(--font-ui)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:1px}.page{height:100%;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.page-head{display:flex;align-items:center;justify-content:space-between;flex:none}.page-head h1{margin:0;font-size:20px;line-height:1.5}.actions{display:flex;gap:10px}.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-bg);color:var(--ink)}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{border-color:var(--teal);background:var(--teal);color:#fff}.btn:disabled{opacity:.48;cursor:not-allowed}.btn.danger{color:var(--err)}.panel{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:6px}.query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;gap:16px;padding:20px 24px;flex:none}.query label{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:10px;color:var(--gray)}.control{width:100%;height:32px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:3px;background:var(--panel-bg);color:var(--ink)}.query-ops{display:flex;justify-content:flex-end;gap:8px}.list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{height:44px;padding:8px 14px;text-align:left;border-bottom:1px solid var(--line-soft)}th{position:sticky;top:0;z-index:2;background:var(--bg-soft);font-weight:600;color:var(--gray)}tbody tr:hover{background:#f8fbfc}.check{position:sticky;left:0;z-index:3;width:44px;min-width:44px;text-align:center;background:var(--panel-bg)}th.check{z-index:4;background:var(--bg-soft)}.status{display:inline-block;padding:3px 8px;border-radius:3px;background:var(--info-bg);color:var(--teal)}.status.off{background:var(--bg-soft);color:var(--gray)}.link{padding:3px 0;border:0;background:none;color:var(--teal);cursor:pointer}.row-ops{display:flex;gap:12px}.pager{display:flex;align-items:center;gap:12px;padding-top:16px;flex:none}.pager .total{margin-right:auto;color:var(--gray)}.pager select{width:100px}.form{min-height:0;overflow:auto;padding:24px}.tabs{margin:0 0 20px;border-bottom:1px solid var(--line-soft)}.tab{display:inline-block;padding:10px 16px;color:var(--teal);border-bottom:2px solid var(--teal)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.field{display:grid;grid-template-columns:110px minmax(0,1fr);min-height:40px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.field label{display:flex;align-items:center;padding:6px 10px;background:var(--bg-soft);color:var(--gray)}.field .value{display:flex;align-items:center;min-width:0;padding:6px 10px;background:var(--panel-bg)}.field .control{height:28px}.field textarea.control{height:auto;min-height:52px;resize:vertical}.wide{grid-column:1/-1}.required{color:var(--err);margin-right:3px}.readonly{background:var(--bg-soft)}.error{min-height:20px;margin:12px 0 0;color:var(--err)}.toast{position:fixed;left:50%;top:50%;z-index:10;transform:translate(-50%,-50%);max-width:min(520px,calc(100vw - 48px));padding:14px 22px;border:1px solid var(--line);border-radius:6px;background:var(--panel-bg);box-shadow:var(--sh-pop);color:var(--ink)}[hidden]{display:none!important}@media(max-width:1000px){.query{grid-template-columns:repeat(2,minmax(0,1fr))}.query-ops{justify-content:flex-end}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding:12px}.query{grid-template-columns:1fr}.query-ops{justify-content:flex-start}.grid{grid-template-columns:1fr}.page-head{gap:12px;align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}}
    /* 查询标签及输入焦点的项目统一规范。 */
    .query label{grid-template-columns:90px minmax(0,1fr);white-space:nowrap}
    input:focus,select:focus,textarea:focus{outline:none;box-shadow:none}
  </style>
</head>
<body>
  <main class="page" data-scene="water-operations">
    <header class="page-head"><h1 id="title">物料类型</h1><div class="actions" id="actions"></div></header>
    <section class="panel query" id="query"><label>物料类型编码<input class="control" id="q-code" placeholder="请输入"></label><label>物料类型<input class="control" id="q-name" placeholder="请输入"></label><label>状态<select class="control" id="q-status"><option value="">全部</option><option>启用</option><option>停用</option></select></label><div class="query-ops"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section>
    <section class="panel list" id="list"><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section>
    <section class="panel form" id="form" hidden></section>
  </main>
  <div class="toast" id="toast" hidden></div>
  <script>
    'use strict';
    // 2026-11-18：依据用户提供字段生成；查询区增加物料类型编码。启用/停用、必填与编码唯一性为原型演示假设，不代表现场正式制度。
    const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let rows=[
      {id:'WLLX-001',name:'药剂类',status:'启用',remark:'用于水处理药剂分类。',creator:'德清威德',created:'2026-11-18 09:30:00'},
      {id:'WLLX-002',name:'备品备件类',status:'启用',remark:'用于设备维修及保养备件分类。',creator:'德清威德',created:'2026-11-17 14:20:00'},
      {id:'WLLX-003',name:'劳保用品类',status:'启用',remark:'',creator:'德清威德',created:'2026-11-16 10:10:00'},
      {id:'WLLX-004',name:'化验耗材类',status:'启用',remark:'',creator:'德清威德',created:'2026-11-15 16:40:00'},
      {id:'WLLX-005',name:'通用耗材类',status:'停用',remark:'暂不使用。',creator:'德清威德',created:'2026-11-14 11:05:00'},
      {id:'WLLX-006',name:'办公用品类',status:'启用',remark:'',creator:'德清威德',created:'2026-11-13 09:15:00'}
    ];
    let query={name:'',code:'',status:''},page=1,size=5,selected=new Set(),draft=null;const currentUser='德清威德';
    function now(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}
    function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
    function button(text,fn,cls='',disabled=false){const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=text;b.disabled=disabled;b.onclick=fn;return b}
    function filtered(){return rows.filter(r=>(!query.name||r.name.includes(query.name))&&(!query.code||r.id.includes(query.code))&&(!query.status||r.status===query.status)).sort((a,b)=>b.created.localeCompare(a.created))}
    function setActions(items){$('actions').replaceChildren(...items)}
    function showList(){draft=null;$('title').textContent='物料类型';$('query').hidden=false;$('list').hidden=false;$('form').hidden=true;renderList()}
    function renderList(){const data=filtered(),pages=Math.max(1,Math.ceil(data.length/size));page=Math.min(page,pages);const visible=data.slice((page-1)*size,page*size);setActions([button('批量删除',()=>remove([...selected]),'danger',!selected.size),button('新增',()=>edit(null),'primary')]);$('thead').innerHTML='<tr><th class="check"><input type="checkbox" id="all" aria-label="当前页全选"></th><th>物料类型编码</th><th>物料类型</th><th>状态</th><th>备注</th><th>操作</th></tr>';$('tbody').innerHTML=visible.map(r=>`<tr><td class="check"><input type="checkbox" data-check="${esc(r.id)}" ${selected.has(r.id)?'checked':''} aria-label="选择${esc(r.name)}"></td><td><button class="link" data-view="${esc(r.id)}">${esc(r.id)}</button></td><td>${esc(r.name)}</td><td><span class="status ${r.status==='停用'?'off':''}">${r.status}</span></td><td title="${esc(r.remark)}">${esc(r.remark)||'—'}</td><td><div class="row-ops"><button class="link" data-edit="${esc(r.id)}">编辑</button><button class="link" data-delete="${esc(r.id)}">删除</button></div></td></tr>`).join('')||'<tr><td colspan="6" style="height:160px;text-align:center;color:var(--gray)">暂无数据</td></tr>';$('all').checked=visible.length>0&&visible.every(r=>selected.has(r.id));$('all').onchange=e=>{visible.forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));renderList()};document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{el.checked?selected.add(el.dataset.check):selected.delete(el.dataset.check);renderList()});document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>view(rows.find(r=>r.id===el.dataset.view)));document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>edit(rows.find(r=>r.id===el.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>remove([el.dataset.delete]));$('pager').innerHTML=`<span class="total">共 ${data.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="pageSize" aria-label="每页条数">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(button('上一页',()=>{page--;renderList()},'',page===1),button('下一页',()=>{page++;renderList()},'',page===pages));$('pageSize').onchange=e=>{size=+e.target.value;page=1;renderList()}}
    function remove(ids){rows=rows.filter(r=>!ids.includes(r.id));ids.forEach(id=>selected.delete(id));renderList()}
    function field(label,content,options={}){return `<div class="field ${options.wide?'wide':''}"><label>${options.required?'<span class="required">*</span>':''}${label}</label><div class="value">${content}</div></div>`}
    function input(key,value='',readOnly=false){return `<input class="control ${readOnly?'readonly':''}" id="f-${key}" value="${esc(value)}" ${readOnly?'readonly':''}>`}
    function select(key,values,value){return `<select class="control" id="f-${key}">${values.map(v=>`<option ${v===value?'selected':''}>${v}</option>`).join('')}</select>`}
    function stage(title,actions){$('title').textContent=title;$('query').hidden=true;$('list').hidden=true;$('form').hidden=false;setActions(actions)}
    function edit(row){draft=row?{...structuredClone(row),originalId:row.id}:{id:'',name:'',status:'启用',remark:'',creator:currentUser,created:'',originalId:null};stage(row?'编辑物料类型':'新增物料类型',[button('返回列表',showList),button('保存',save,'primary')]);$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${field('物料类型编码',input('id',draft.id),{required:true})}${field('物料类型',input('name',draft.name),{required:true})}${field('状态',select('status',['启用','停用'],draft.status),{required:true})}${field('创建人',input('creator',draft.creator,true))}${field('创建时间',input('created',draft.created||'',true))}${field('备注',`<textarea class="control" id="f-remark">${esc(draft.remark)}</textarea>`,{wide:true})}</div><p class="error" id="error" role="alert"></p>`}
    function save(){const id=$('f-id').value.trim(),name=$('f-name').value.trim(),status=$('f-status').value,remark=$('f-remark').value.trim(),existing=rows.find(r=>r.id===id);if(!id||!name){$('error').textContent='请填写物料类型编码和物料类型。';return}if(existing&&existing.id!==draft.originalId){$('error').textContent='物料类型编码已存在。';return}draft={...draft,id,name,status,remark,created:draft.created||now()};const index=rows.findIndex(r=>r.id===draft.originalId);if(index>=0)rows[index]=draft;else rows.push(draft);selected.clear();showList();toast('保存成功')}
    function view(row){stage('物料类型详情',[button('返回列表',showList)]);const fields=[['物料类型编码',row.id],['物料类型',row.name],['状态',row.status],['创建人',row.creator],['创建时间',row.created],['备注',row.remark||'—',true]];$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${fields.map(([label,value,wide])=>field(label,esc(value),{wide})).join('')}</div>`}
    $('search').onclick=()=>{query={name:$('q-name').value.trim(),code:$('q-code').value.trim(),status:$('q-status').value};page=1;selected.clear();renderList()};$('reset').onclick=()=>{$('q-name').value='';$('q-code').value='';$('q-status').value='';query={name:'',code:'',status:''};page=1;selected.clear();renderList()};showList();
  </script>
<script>/* 导入、导出仅作界面展示，不接入功能；仅在列表页显示，新增/编辑/详情页不显示。 */(()=>{const labels=['导入','导出'],sync=()=>{const root=document.getElementById('actions'),form=document.getElementById('form');if(!root||(form&&!form.hidden))return;labels.forEach(label=>{let b=[...root.children].find(x=>x.textContent===label);if(b){if(!b.dataset.staticAction){const copy=b.cloneNode(true);copy.dataset.staticAction='true';b.replaceWith(copy)}}else{b=document.createElement('button');b.className='btn';b.textContent=label;b.dataset.staticAction='true';root.insertBefore(b,[...root.children].find(x=>x.textContent==='批量删除')||null)}})};sync();new MutationObserver(sync).observe(document.getElementById('actions'),{childList:true})})();</script>
</body>
</html>
