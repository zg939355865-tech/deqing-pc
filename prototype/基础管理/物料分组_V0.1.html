<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物料分组</title>
  <link rel="stylesheet" href="../../assets/components/tokens.css"><link rel="stylesheet" href="../../assets/components/components.css">
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg-page);color:var(--ink);font:13px var(--font-ui)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}.page{height:100%;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:16px}.head{display:flex;justify-content:space-between;align-items:center;flex:none}.head h1{margin:0;font-size:20px;line-height:1.5}.actions,.row-ops{display:flex;gap:10px}.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--panel-bg);color:var(--ink)}.btn:hover{border-color:var(--teal);color:var(--teal)}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{color:#fff}.btn.danger{color:var(--err)}.btn:disabled{opacity:.48;cursor:not-allowed}.panel{background:var(--panel-bg);border:1px solid var(--line-soft);border-radius:6px}.query{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:20px 24px;flex:none}.query label{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:center;gap:10px;color:var(--gray);white-space:nowrap}.query-ops{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.control{width:100%;height:32px;padding:5px 8px;border:1px solid var(--line-soft);border-radius:3px;background:var(--panel-bg);color:var(--ink)}input:focus,select:focus,textarea:focus{outline:none;box-shadow:none}.list{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 24px}.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line-soft);border-radius:4px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{height:44px;padding:8px 14px;text-align:left;border-bottom:1px solid var(--line-soft)}th{position:sticky;top:0;z-index:2;background:var(--bg-soft);font-weight:600;color:var(--gray)}tbody tr:hover{background:#f8fbfc}.check{position:sticky;left:0;z-index:3;width:44px;min-width:44px;text-align:center;background:var(--panel-bg)}th.check{z-index:4;background:var(--bg-soft)}.status{display:inline-block;padding:3px 8px;border-radius:3px;background:var(--info-bg);color:var(--teal)}.status.off{background:var(--bg-soft);color:var(--gray)}.link{padding:3px 0;border:0;background:none;color:var(--teal)}.row-ops{gap:12px}.pager{display:flex;align-items:center;gap:12px;padding-top:16px;flex:none}.total{margin-right:auto;color:var(--gray)}.pager select{width:100px}.form{min-height:0;overflow:auto;padding:24px}.tabs{margin:0 0 20px;border-bottom:1px solid var(--line-soft)}.tab{display:inline-block;padding:10px 16px;color:var(--teal);border-bottom:2px solid var(--teal)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}.field{display:grid;grid-template-columns:110px minmax(0,1fr);min-height:40px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.field label{display:flex;align-items:center;padding:6px 10px;background:var(--bg-soft);color:var(--gray)}.value{display:flex;align-items:center;min-width:0;padding:6px 10px;background:var(--panel-bg)}.field .control{height:28px}.field textarea.control{height:auto;min-height:52px;resize:vertical}.wide{grid-column:1/-1}.required{color:var(--err);margin-right:3px}.readonly{background:var(--bg-soft)}.switch{position:relative;width:42px;height:24px;padding:0;border:0;border-radius:12px;background:#aebdca}.switch:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff}.switch.on{background:var(--teal)}.switch.on:after{left:20px}.error{min-height:20px;margin:12px 0 0;color:var(--err)}.toast{position:fixed;left:50%;top:50%;z-index:10;transform:translate(-50%,-50%);padding:14px 22px;border:1px solid var(--line);border-radius:6px;background:var(--panel-bg);box-shadow:var(--sh-pop)}[hidden]{display:none!important}@media(max-width:1000px){.query,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.page{padding:12px}.query,.grid{grid-template-columns:1fr}.query-ops{justify-content:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}}
  </style>
</head>
<body>
  <main class="page" data-scene="water-operations">
    <header class="head"><h1 id="title">物料分组</h1><div class="actions" id="actions"></div></header>
    <section class="panel query" id="query"><label>物料分组编码<input class="control" id="q-code" placeholder="请输入"></label><label>物料分组<input class="control" id="q-name" placeholder="请输入"></label><label>物料类型<select class="control" id="q-type"><option value="">全部</option><option>材料</option><option>药剂</option></select></label><label>状态<select class="control" id="q-status"><option value="">全部</option><option>启用</option><option>停用</option></select></label><div class="query-ops"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></section>
    <section class="panel list" id="list"><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><footer class="pager" id="pager"></footer></section>
    <section class="panel form" id="form" hidden></section>
  </main><div class="toast" id="toast" hidden></div>
  <script>
    'use strict';
    // 样例数据仅用于原型展示，非已核实主数据。
    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let rows=['ZCXL|轴承系列','DQXL|电气系列','FMXL|阀门系列','FFXXL|防腐防锈系列','JQXL|机电系列','LTCLXL|链条齿轮系列','LSXL|螺丝系列','QDQL|气动系列','SLGDJFXL|塑料管道及附件系列','YSYHXL|易损易耗系列'].map((v,i)=>{const[id,name]=v.split('|');return{id,name,type:'材料',status:'启用',remark:'',plant:'德清水厂',creator:'德清威德',created:`2026-11-${String(18-i).padStart(2,'0')} 09:30:00`}});
    let query={code:'',name:'',type:'',status:''},page=1,size=5,selected=new Set(),draft=null;
    const now=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'medium'}).format(new Date()).replace('T',' ');
    function btn(t,f,c='',disabled=false){const x=document.createElement('button');x.type='button';x.className='btn '+c;x.textContent=t;x.disabled=disabled;x.onclick=f;return x}
    function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3500)}
    function filtered(){return rows.filter(r=>(!query.code||r.id.includes(query.code))&&(!query.name||r.name.includes(query.name))&&(!query.type||r.type===query.type)&&(!query.status||r.status===query.status)).sort((a,b)=>b.created.localeCompare(a.created))}
    function showList(){draft=null;$('title').textContent='物料分组';$('query').hidden=false;$('list').hidden=false;$('form').hidden=true;draw()}
    function draw(){const d=filtered(),pages=Math.max(1,Math.ceil(d.length/size));page=Math.min(page,pages);const view=d.slice((page-1)*size,page*size);$('actions').replaceChildren(btn('导出',()=>toast('已导出物料分组数据')),btn('导入',()=>toast('导入功能为原型演示入口')),btn('批量删除',()=>remove([...selected]),'danger',!selected.size),btn('新增',()=>edit(),'primary'));$('thead').innerHTML='<tr><th class="check"><input id="all" type="checkbox" aria-label="当前页全选"></th><th>物料分组编码</th><th>物料分组</th><th>物料类型</th><th>状态</th><th>备注</th><th>操作</th></tr>';$('tbody').innerHTML=view.map(r=>`<tr><td class="check"><input type="checkbox" data-check="${esc(r.id)}" ${selected.has(r.id)?'checked':''}></td><td><button class="link" data-view="${esc(r.id)}">${esc(r.id)}</button></td><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td><span class="status ${r.status==='停用'?'off':''}">${r.status}</span></td><td>${esc(r.remark)||'—'}</td><td><div class="row-ops"><button class="link" data-edit="${esc(r.id)}">编辑</button><button class="link" data-delete="${esc(r.id)}">删除</button></div></td></tr>`).join('')||'<tr><td colspan="7" style="height:160px;text-align:center;color:var(--gray)">暂无数据</td></tr>';$('all').checked=view.length>0&&view.every(r=>selected.has(r.id));$('all').onchange=e=>{view.forEach(r=>e.target.checked?selected.add(r.id):selected.delete(r.id));draw()};document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{e.checked?selected.add(e.dataset.check):selected.delete(e.dataset.check);draw()});document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>viewDetail(rows.find(r=>r.id===e.dataset.view)));document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>edit(rows.find(r=>r.id===e.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>remove([e.dataset.delete]));$('pager').innerHTML=`<span class="total">共 ${d.length} 条</span><span>第 ${page} / ${pages} 页</span><select class="control" id="page-size">${[5,10,20,50].map(n=>`<option value="${n}" ${n===size?'selected':''}>${n}条/页</option>`).join('')}</select>`;$('pager').append(btn('上一页',()=>{page--;draw()},'',page===1),btn('下一页',()=>{page++;draw()},'',page===pages));$('page-size').onchange=e=>{size=+e.target.value;page=1;draw()}}
    function remove(ids){rows=rows.filter(r=>!ids.includes(r.id));ids.forEach(id=>selected.delete(id));draw()}
    const field=(l,v,o={})=>`<div class="field ${o.wide?'wide':''}"><label>${o.required?'<span class="required">*</span>':''}${l}</label><div class="value">${v}</div></div>`,input=(k,v='',ro=false)=>`<input class="control ${ro?'readonly':''}" id="f-${k}" value="${esc(v)}" ${ro?'readonly':''}>`;
    function edit(row){draft=row?{...structuredClone(row),original:row.id}:{id:'',name:'',type:'材料',status:'启用',plant:'德清水厂',creator:'德清威德',created:'',remark:'',original:null};$('title').textContent=row?'编辑物料分组':'新增物料分组';$('query').hidden=true;$('list').hidden=true;$('form').hidden=false;$('actions').replaceChildren(btn('返回列表',showList),btn('保存',save,'primary'));$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${field('物料分组编码',input('id',draft.id),{required:true})}${field('物料分组',input('name',draft.name),{required:true})}${field('物料类型',`<select class="control" id="f-type"><option ${draft.type==='材料'?'selected':''}>材料</option><option ${draft.type==='药剂'?'selected':''}>药剂</option></select>`)}${field('状态',`<button class="switch ${draft.status==='启用'?'on':''}" id="switch" type="button"></button>`)}${field('所属工厂',input('plant',draft.plant,true))}${field('创建人',input('creator',draft.creator,true))}${field('创建时间',input('created',draft.created,true))}${field('备注',`<textarea class="control" id="f-remark">${esc(draft.remark)}</textarea>`,{wide:true})}</div><p class="error" id="error"></p>`;$('switch').onclick=()=>{draft.status=draft.status==='启用'?'停用':'启用';edit(draft)}}
    function save(){const id=$('f-id').value.trim(),name=$('f-name').value.trim(),exists=rows.find(r=>r.id===id);if(!id||!name){$('error').textContent='请填写物料分组编码和物料分组。';return}if(exists&&id!==draft.original){$('error').textContent='物料分组编码已存在。';return}Object.assign(draft,{id,name,type:$('f-type').value,remark:$('f-remark').value.trim(),created:draft.created||now()});const i=rows.findIndex(r=>r.id===draft.original);i<0?rows.push(draft):rows[i]=draft;selected.clear();showList();toast('保存成功')}
    function viewDetail(r){$('title').textContent='物料分组详情';$('query').hidden=true;$('list').hidden=true;$('form').hidden=false;$('actions').replaceChildren(btn('返回列表',showList));$('form').innerHTML=`<div class="tabs"><span class="tab">基础信息</span></div><div class="grid">${[['物料分组编码',r.id],['物料分组',r.name],['物料类型',r.type],['状态',r.status],['所属工厂',r.plant],['创建人',r.creator],['创建时间',r.created],['备注',r.remark||'—',true]].map(([l,v,w])=>field(l,esc(v),{wide:w})).join('')}</div>`}
    $('search').onclick=()=>{query={code:$('q-code').value.trim(),name:$('q-name').value.trim(),type:$('q-type').value,status:$('q-status').value};page=1;selected.clear();draw()};$('reset').onclick=()=>{document.querySelectorAll('#query input,#query select').forEach(x=>x.value='');query={code:'',name:'',type:'',status:''};page=1;selected.clear();draw()};showList();
  </script>
<script>/* 导入、导出仅作界面展示，不接入功能；仅在列表页显示，新增/编辑/详情页不显示。 */(()=>{const labels=['导入','导出'],sync=()=>{const root=document.getElementById('actions'),form=document.getElementById('form');if(!root||(form&&!form.hidden))return;labels.forEach(label=>{let b=[...root.children].find(x=>x.textContent===label);if(b){if(!b.dataset.staticAction){const copy=b.cloneNode(true);copy.dataset.staticAction='true';b.replaceWith(copy)}}else{b=document.createElement('button');b.className='btn';b.textContent=label;b.dataset.staticAction='true';root.insertBefore(b,[...root.children].find(x=>x.textContent==='批量删除')||null)}})};sync();new MutationObserver(sync).observe(document.getElementById('actions'),{childList:true})})();</script>
</body></html>
