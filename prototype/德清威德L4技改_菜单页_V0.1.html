<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>德清威德L4技改｜菜单</title>
  <!-- 2026-11-15：保留原页面顶部栏、白色菜单栏和内容区；删除原深蓝一级菜单栏，菜单结构按用户截图配置。 -->
  <link rel="stylesheet" href="../assets/components/tokens.css">
  <link rel="stylesheet" href="../assets/components/components.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:var(--font-ui);color:var(--ink);background:var(--bg-page);font-size:14px}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--teal-web);outline-offset:-2px}
    .shell{height:100vh;display:grid;grid-template-columns:304px minmax(0,1fr);grid-template-rows:68px minmax(0,1fr)}
    .top{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--panel-bg);border-bottom:1px solid var(--line-soft);gap:20px}.brand{font-size:19px;font-weight:700;letter-spacing:1px}.brand small{font-size:10px;color:var(--gray-l);display:block;font-weight:400;letter-spacing:1.5px;margin-top:4px}.account{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--gray)}.avatar{background:var(--info-bg);color:var(--teal);width:34px;height:34px;display:grid;place-items:center;border-radius:50%}.plain{border:0;background:none;color:var(--teal);padding:8px}
    .sidebar{background:var(--panel-bg);border-right:1px solid var(--line-soft);min-height:0;display:flex;flex-direction:column}.side-heading{padding:20px 20px 14px;border-bottom:1px solid var(--line-soft)}.side-heading h2{margin:0;font-size:16px}.apps{overflow:auto;flex:1;padding:10px 8px 20px;scrollbar-width:thin}.group{border-radius:5px;margin:2px 0}.app-head,.menu-item{border:0;background:none;width:100%;display:flex;align-items:center;text-align:left;color:var(--ink);line-height:1.4}.app-head{min-height:46px;padding:10px 12px;gap:10px;font-size:14px}.app-head:hover{color:var(--teal);background:var(--bg-soft)}.app-head.active{color:var(--teal);font-weight:600}.group.open>.app-head{background:var(--bg-soft)}.group.open>.app-head.active{background:var(--info-bg)}.nav-icon{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.chevron{margin-left:auto;width:16px;height:16px;transition:transform .16s}.group.open .chevron{transform:rotate(180deg)}.children{padding:2px 0 7px}.children[hidden]{display:none}.menu-item{min-height:40px;padding:9px 10px 9px 42px;gap:10px;border-radius:4px;font-size:13px;color:var(--gray)}.menu-item:hover{color:var(--teal);background:var(--bg-soft)}.menu-item.active{background:var(--info-bg);color:var(--teal);font-weight:600;box-shadow:inset 3px 0 var(--teal-web)}.menu-item .nav-icon{width:16px;height:16px;flex-basis:16px}
    .main{padding:22px 24px;overflow:auto;min-width:0}.content{background:var(--panel-bg);border:1px solid var(--line-soft);min-height:calc(100% - 2px);border-radius:5px;overflow:hidden}.content-head{padding:22px 26px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:15px}.content-head h1{font-size:20px;margin:0}.badge{font-size:12px;background:var(--info-bg);color:var(--teal);padding:5px 10px;white-space:nowrap}.intro{padding:30px 28px;max-width:900px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--teal)}.intro h2{font-size:24px;margin:12px 0 20px;line-height:1.5}.desc{font-size:15px;line-height:2;color:var(--gray);max-width:720px}.divider{height:1px;background:var(--line-soft);margin:32px 0}.note{border-left:3px solid var(--teal-web);background:var(--bg-soft);padding:18px 22px;color:var(--gray);line-height:1.8}.note strong{display:block;color:var(--ink);margin-bottom:5px}.footer{padding-top:30px;font-size:12px;color:var(--gray-l)}
    @media(max-width:900px){.shell{grid-template-columns:270px minmax(0,1fr)}.top{padding:0 18px}.main{padding:18px}.brand{font-size:17px}}@media(max-width:640px){.shell{grid-template-columns:230px minmax(280px,1fr)}.top{padding:0 12px}.brand small,.account .tenant{display:none}.main{padding:12px}.content-head{padding:18px}.intro{padding:24px}}
    /* 2026-11-15：移除菜单区标题与说明占位，统一紧凑间距和青蓝选中样式。 */
    .shell{grid-template-columns:248px minmax(0,1fr);grid-template-rows:64px minmax(0,1fr)}
    .top{padding:0 24px}.brand{font-size:18px;letter-spacing:.5px}.brand small{font-size:9px;letter-spacing:1px}.account{gap:12px}.plain{border-radius:4px}.plain:hover{background:var(--info-bg)}
    .apps{padding:14px 10px 20px}.group{margin:3px 0}.app-head{min-height:44px;border-radius:5px;padding:11px 12px;font-weight:500}.app-head.active{background:var(--info-bg)}.children{padding:4px 0 6px}.menu-item{min-height:38px;margin:2px 0;padding-left:42px}.menu-item.active{box-shadow:inset 3px 0 var(--teal-web)}
    .main{padding:20px;overflow:hidden;min-height:0}.content{height:100%;min-height:0;display:flex;flex-direction:column;border-radius:6px}.content-head{padding:20px 24px;min-height:66px}.content-head h1{font-size:20px;line-height:1.4}.workspace{flex:1;min-height:0;overflow:auto}
    @media(max-width:900px){.shell{grid-template-columns:224px minmax(0,1fr)}.main{padding:16px}}@media(max-width:640px){.shell{grid-template-columns:200px minmax(240px,1fr)}.main{padding:12px}}
    [hidden]{display:none!important}.workspace:has(iframe){overflow:hidden}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top"><div class="brand">德清威德L4技改<small>WASTEWATER OPERATIONS PLATFORM</small></div><div class="account"><span class="tenant">德清威德</span><span class="avatar" aria-hidden="true">用</span><span>演示账号</span><button class="plain" type="button">退出</button></div></header>
    <aside class="sidebar"><nav class="apps" id="apps" aria-label="功能菜单"></nav></aside>
    <main class="main"><section class="content"><header class="content-head"><h1 id="pageTitle">工艺流程图</h1></header><div class="workspace" id="workspace"></div></section></main>
  </div>
  <script>
    'use strict';
    const icon={process:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="m7 20 3-3m7 3-3-3M7 9h.01M11 9h6M7 13h10"/>',device:'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 3v3m6-3v3m0 12v3m-6-3v3M3 9h3m12 0h3M3 15h3m12 0h3"/>',inspect:'<path d="M12 3a6 6 0 0 0-6 6c0 5-3 6-3 9h18c0-3-3-4-3-9a6 6 0 0 0-6-6Z"/><circle cx="12" cy="10" r="2"/><path d="M8 21h8"/>',schedule:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-8 4h4m-4 3h3"/>',lab:'<path d="M9 3v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 3h8M7 15h10"/>',inventory:'<path d="m4 8 8-4 8 4v10l-8 4-8-4V8Z"/><path d="m4 8 8 4 8-4m-8 4v10"/>',alarm:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 10h18c0-3-3-3-3-10Z"/><path d="M9 21h6"/>',config:'<path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="11" cy="17" r="1.5"/>',report:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 16l2-2 2 1 3-4"/>',basic:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6m-14 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',list:'<rect x="5" y="4" width="5" height="5" rx="1"/><rect x="14" y="4" width="5" height="5" rx="1"/><rect x="5" y="14" width="5" height="5" rx="1"/><rect x="14" y="14" width="5" height="5" rx="1"/>',item:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 13h6m-6 4h5"/>'};
    const menus=[['工艺监视','process',['工艺流程图']],['设备管理','device',['设备类型','设备位置','设备台账','保养项','保养计划','保养工单','保养记录','设备报修','设备维修','委外维修','仪器仪表','计量校准']],['巡检管理','inspect',['巡检点','巡检项','巡检计划','巡检工单','巡检记录']],['排班管理','schedule',['班组设置','班次管理','排班','交接班日志']],['化验管理','lab',['检验类型','检验项','检验方法','采样点','水质检验标准','来料检验标准','化验计划','水质检验单','来料检验单','镜检AI分析']],['库存管理','inventory',['库存总账','库存明细','库存流水','领料单','出库单','入库单','盘库','盘库差异调整','安全库存']],['告警管理','alarm',['实时告警','历史告警','告警配置']],['配置管理','config',[]],['报表管理','report',['参数实时监测','参数趋势分析','化验日报','化验分析','运行日报表','运行月报表','运行年报表','物料出库排名']],['基础管理','basic',['变量地址','序列号管理','供应商管理','单位管理','物料分组','物料主数据','仓库','库位']]];
    const apps=document.getElementById('apps');let open=0,selected={group:0,item:0};const svg=name=>`<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">${icon[name]||icon.item}</svg>`;
    function choose(group,item){selected={group,item};const label=item===null?menus[group][0]:menus[group][2][item];document.getElementById('pageTitle').textContent=label;const workspace=document.getElementById('workspace');const content=workspace.closest('.content');workspace.replaceChildren();content.querySelector('.content-head').hidden=['设备报修','设备维修'].includes(label);if(['设备报修','设备维修'].includes(label)){const frame=document.createElement('iframe');frame.src='设备管理/'+label+'_V0.1.html';frame.title=label;frame.style='width:100%;height:100%;border:0;display:block';workspace.append(frame)}render()}
    function render(){apps.replaceChildren();menus.forEach(([name,kind,items],groupIndex)=>{const group=document.createElement('section');group.className=`group${open===groupIndex?' open':''}`;const head=document.createElement('button');head.type='button';head.className=`app-head${selected.group===groupIndex?' active':''}`;head.setAttribute('aria-expanded',String(open===groupIndex));head.innerHTML=`${svg(kind)}<span>${name}</span><svg class="nav-icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;head.onclick=()=>{selected={group:groupIndex,item:null};open=open===groupIndex?-1:groupIndex;choose(groupIndex,null)};group.append(head);if(items.length){const children=document.createElement('div');children.className='children';children.hidden=open!==groupIndex;items.forEach((item,itemIndex)=>{const child=document.createElement('button');child.type='button';child.className=`menu-item${selected.group===groupIndex&&selected.item===itemIndex?' active':''}`;child.innerHTML=`${svg(itemIndex===0?'list':'item')}<span>${item}</span>`;child.onclick=()=>choose(groupIndex,itemIndex);children.append(child)});group.append(children)}apps.append(group)})}render();
  </script>
</body>
</html>
