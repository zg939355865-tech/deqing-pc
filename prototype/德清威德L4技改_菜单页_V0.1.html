<body>
  <div class="shell">
    <header class="top"><div class="brand">德清威德L4级智能化水厂<small>WASTEWATER OPERATIONS PLATFORM</small></div><div class="account"><span class="tenant">德清威德</span><span class="avatar" aria-hidden="true">用</span><span>演示账号</span><button class="plain" type="button">退出</button></div></header>

  <script>
    'use strict';
    const icon={process:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="m7 20 3-3m7 3-3-3M7 9h.01M11 9h6M7 13h10"/>',device:'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 3v3m6-3v3m0 12v3m-6-3v3M3 9h3m12 0h3M3 15h3m12 0h3"/>',inspect:'<path d="M12 3a6 6 0 0 0-6 6c0 5-3 6-3 9h18c0-3-3-4-3-9a6 6 0 0 0-6-6Z"/><circle cx="12" cy="10" r="2"/><path d="M8 21h8"/>',schedule:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16m-8 4h4m-4 3h3"/>',lab:'<path d="M9 3v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 3h8M7 15h10"/>',inventory:'<path d="m4 8 8-4 8 4v10l-8 4-8-4V8Z"/><path d="m4 8 8 4 8-4m-8 4v10"/>',alarm:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 10h18c0-3-3-3-3-10Z"/><path d="M9 21h6"/>',config:'<path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="11" cy="17" r="1.5"/>',report:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 16l2-2 2 1 3-4"/>',basic:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6m-14 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',list:'<rect x="5" y="4" width="5" height="5" rx="1"/><rect x="14" y="4" width="5" height="5" rx="1"/><rect x="5" y="14" width="5" height="5" rx="1"/><rect x="14" y="14" width="5" height="5" rx="1"/>',item:'<path d="M6 3h9l4 4v14H6z"/><path d="M15 3v5h4M9 13h6m-6 4h5"/>'};
    // 2026-11-19：按用户要求在安全库存下方增加五个菜单，页面待后续制作。
    // 2026-11-23：移除生产投料单、化验用料单，增加倒冲领料设置菜单；配置页面待制作。
    // 2026-11-23：生产领料、化验领料更名，并依次移至领料出库下方。
    // 2026-11-23：生产领料、化验领料依次移至工具领用台账之后。
    // 2026-11-23：按用户要求移除化验领料菜单，保留原型文件。
    // 2026-11-23：按用户要求恢复化验领料菜单，置于生产领料之后。
    // 2026-11-23：按用户最新要求移除化验领料菜单，保留原型文件。
    // 2026-11-23：按用户要求移除倒冲领料设置菜单，保留原型文件。
    // 2026-11-23：按用户要求在生产领料下方增加入库未收票菜单，页面待制作。
    // 2026-11-23：按用户指定重排库存管理12个菜单，菜单文字采用其他入库、其他出库，保留原页面路径。
    // 2026-11-24：按用户要求将菜单统一为其他入库、其他出库，同步图标与页面映射。
    // 2026-11-24：按用户要求菜单“入库未收票”更名为“入库收票登记”，保留原文件映射。
    const menus=[['指挥中心','command',[]],['工作台','workbench',[]],['工艺监视','process',['工艺流程图']],['设备管理','device',['设备类型','设备位置','设备台账','保养项','保养计划','保养工单','保养记录','设备报修','设备维修','委外维修','仪器仪表','计量校准']],['巡检管理','inspect',['巡检点','巡检项','巡检计划','巡检工单','巡检记录']],['排班管理','schedule',['班组设置','班次管理','排班','交接班日志']],['化验管理','lab',['检验类型','检验项','检验方法','采样点','水质检验标准','来料检验标准','化验计划','水质检验单','来料检验单','镜检AI分析']],['库存管理','inventory',['采购入库','领料出库','生产投料','其他入库','其他出库','安全库存','库存总账','即时库存','出入库流水','月度出入库汇总','月度出入库明细','工具领用台账','入库收票登记']],['告警管理','alarm',['实时告警','历史告警','告警配置']],['配置管理','config',[]],['报表管理','report',['参数实时监测','参数趋势分析','化验日报','化验分析','运行日报表','运行月报表','运行年报表','物料出库排名']],['基础管理','basic',['变量地址','序列号管理','供应商管理','单位管理','物料类型','物料分组','物料主数据','仓库','库位']]];
    // 2026-11-19：库存子菜单按账簿、流转、出入库、安全及生产/化验业务区分图标。
    Object.assign(icon,{
      command:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11M11 13h6m-6 4h4"/>',
      workbench:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v3h4v-3"/>',
      ledger:'<path d="M4 4h7v16H4zM11 4h9v16h-9M7 8h1m-1 4h1m6-4h3m-3 4h3m-3 4h3"/>',
      detail:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11m-6-6h18"/>',
      flow:'<path d="M3 7h17m-4-4 4 4-4 4M21 17H4m4-4-4 4 4 4"/>',
      purchase:'<path d="M3 4h3l2 11h10l3-8H7M12 3v7m-3-3 3 3 3-3"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',
      receive:'<path d="M4 13v7h16v-7M12 3v12m-4-4 4 4 4-4M4 16h4m8 0h4"/>',
      issue:'<path d="M4 13v7h16v-7M12 15V3m-4 4 4-4 4 4M4 16h4m8 0h4"/>',
      picking:'<path d="m3 9 6-3 6 3v9l-6 3-6-3V9Zm0 0 6 3 6-3m-6 3v9M15 4h6m-3-3 3 3-3 3"/>',
      safety:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="M12 7v6m0 3h.01"/>',
      daily:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18M6 14h11m-3-2 3 2-3 2M18 18H7m3-2-3 2 3 2"/>',
      productionReport:'<path d="M4 3h13l3 3v15H4zM14 3v5h6M7 18v-5l3 2v-3l4 3v3H7Zm9-6v6"/>',
      labReport:'<path d="M4 3h13l3 3v15H4zM14 3v5h6M9 10v3l-3 5h10l-3-5v-3M8 10h6m-6 6h6"/>',
      feeding:'<path d="M4 3h16l-6 8v4l-4 2v-6L4 3ZM4 17v4h16v-4M12 17v4"/>',
      labUsage:'<path d="M9 3v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3M8 3h8M7 15h10m-6-4h2"/>'
    });
    const inventoryIcons={'库存总账':'ledger','即时库存':'detail','出入库流水':'flow','采购入库':'purchase','领料出库':'picking','其他入库':'receive','其他出库':'issue','安全库存':'safety','月度出入库汇总':'daily','月度出入库明细':'detail','工具领用台账':'ledger','生产投料':'productionReport','化验领料':'labReport','倒冲领料设置':'config'};
    const apps=document.getElementById('apps');let open=0,selected={group:0,item:0};const svg=name=>`<svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">${icon[name]||icon.item}</svg>`;
    // 2026-11-23：接入生产领料、化验领料与倒冲领料设置原型。
    function choose(group,item){selected={group,item};const label=item===null?menus[group][0]:menus[group][2][item];const pages={'指挥中心':'指挥中心_V0.1.html','工作台':'工作台_V0.1.html','月度出入库明细':'库存管理/月度出入库明细_V0.1.html','入库收票登记':'库存管理/入库未收票_V0.1.html','工具领用台账':'库存管理/工具领用台账_V0.1.html','生产投料':'库存管理/生产领料_V0.1.html','化验领料':'库存管理/化验领料_V0.1.html','倒冲领料设置':'库存管理/倒冲领料设置_V0.1.html','月度出入库汇总':'库存管理/收发日报_V0.1.html','安全库存':'库存管理/安全库存_V0.1.html','其他出库':'库存管理/其他出库_V0.1.html','其他入库':'库存管理/其他入库_V0.1.html','采购入库':'库存管理/采购入库_V0.1.html','领料出库':'库存管理/领料出库_V0.1.html','仓库':'基础管理/仓库_V0.1.html','库位':'基础管理/库位_V0.1.html','设备报修':'设备管理/设备报修_V0.1.html','设备维修':'设备管理/设备维修_V0.1.html','物料类型':'基础管理/物料类型_V0.1.html','物料分组':'基础管理/物料分组_V0.1.html','物料主数据':'基础管理/物料主数据_V0.1.html','供应商管理':'基础管理/供应商管理_V0.1.html','库存总账':'库存管理/库存总账_V0.1.html','即时库存':'库存管理/库存明细_V0.1.html','出入库流水':'库存管理/库存流水_V0.1.html'};document.getElementById('pageTitle').textContent=label;const workspace=document.getElementById('workspace');const content=workspace.closest('.content');workspace.replaceChildren();content.querySelector('.content-head').hidden=Boolean(pages[label]);if(pages[label]){const frame=document.createElement('iframe');frame.src=pages[label];frame.title=label;frame.style='width:100%;height:100%;border:0;display:block';workspace.append(frame)}render()}
    function render(){apps.replaceChildren();menus.forEach(([name,kind,items],groupIndex)=>{const group=document.createElement('section');group.className=`group${open===groupIndex?' open':''}`;const head=document.createElement('button');head.type='button';head.className=`app-head${selected.group===groupIndex?' active':''}`;head.setAttribute('aria-expanded',String(open===groupIndex));head.innerHTML=`${svg(kind)}<span>${name}</span><svg class="nav-icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;if(!items.length){head.querySelector('.chevron').remove();head.removeAttribute('aria-expanded')}head.onclick=()=>{selected={group:groupIndex,item:null};open=open===groupIndex?-1:groupIndex;choose(groupIndex,null)};group.append(head);if(items.length){const children=document.createElement('div');children.className='children';children.hidden=open!==groupIndex;items.forEach((item,itemIndex)=>{const child=document.createElement('button');child.type='button';child.className=`menu-item${selected.group===groupIndex&&selected.item===itemIndex?' active':''}`;child.innerHTML=`${svg((kind==='inventory'&&inventoryIcons[item])||(itemIndex===0?'list':'item'))}<span>${item}</span>`;child.onclick=()=>choose(groupIndex,itemIndex);children.append(child)});group.append(children)}apps.append(group)})}
    // 2026-11-25：新增指挥中心、工作台两个直属菜单及页面，任务详情可进入已有业务模块。
    window.addEventListener('message',event=>{const frame=document.querySelector('#workspace iframe');if(event.source!==frame?.contentWindow||event.data?.type!=='task-portal-navigate')return;const allowed=['设备维修','领料出库','入库收票登记'];if(!allowed.includes(event.data.menu))return;for(let g=0;g<menus.length;g++){const i=menus[g][2].indexOf(event.data.menu);if(i>=0){open=g;choose(g,i);break}}});
    choose(0,null);
  </script>
